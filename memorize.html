<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OPIc 빈출 문장 암기 | 선택주제 + ★4+ 핵심 반복</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-soft: #eef2ff;
      --accent: #0f766e;
      --accent-soft: #f0fdfa;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --danger: #dc2626;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --shadow-player: 0 -4px 16px rgba(15, 23, 42, 0.14);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(74px + var(--safe-bottom));
    }

    /* Top Header */
    .top-header {
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 100%);
      color: #ffffff;
      padding: 12px 14px 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .app-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .nav-pills {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-btn.is-survey {
      background: #fef3c7;
      color: #78350f;
      border-color: #f59e0b;
      font-weight: 800;
    }

    .sub-caption {
      font-size: 11.5px;
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pool-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Settings Card */
    .settings-panel {
      margin: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .setting-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-sub);
    }

    .setting-hint {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .seg-row {
      display: flex;
      gap: 5px;
    }

    .seg-btn {
      flex: 1;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 4px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      transition: all 0.15s;
    }

    .seg-btn small {
      font-size: 10px;
      font-weight: 600;
      opacity: 0.8;
      margin-top: 2px;
    }

    .seg-btn.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .repeat-row .seg-btn {
      padding: 7px 2px;
      flex-direction: row;
    }

    .voice-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .voice-select {
      flex: 1;
      min-width: 0;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 600;
      padding: 0 8px;
    }

    .speed-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--primary-dark);
      font-size: 11.5px;
      font-weight: 800;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Main Flashcard */
    .flashcard {
      margin: 0 12px 10px;
      background: var(--surface);
      border: 1.5px solid #c7d2fe;
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .flashcard.is-speaking {
      border-color: var(--primary);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.16);
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .source-badges {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .tag-chip {
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .star-chip {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--amber-soft);
      color: var(--amber);
      border: 1px solid #fcd34d;
      white-space: nowrap;
    }

    .rank-chip {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }

    .script-name-line {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repeat-tracker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .repeat-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .repeat-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .r-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cbd5e1;
      transition: transform 0.15s, background 0.15s;
    }

    .r-dot.is-done {
      background: #a5b4fc;
    }

    .r-dot.is-current {
      background: var(--primary);
      transform: scale(1.22);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .sentence-en {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.48;
      color: var(--text);
      margin: 2px 0 0;
      word-break: break-word;
    }

    .sentence-ko {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-sub);
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 8px 10px;
      border-radius: 0 8px 8px 0;
      margin: 0;
    }

    .card-action-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .act-btn {
      flex: 1;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 800;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .act-btn.is-primary {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      border-color: #4f46e5;
      color: #ffffff;
    }

    .act-btn.is-playing {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      border-color: #dc2626;
      color: #ffffff;
    }

    /* Candidate Sentence List */
    .list-section {
      margin: 0 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .list-header {
      padding: 10px 12px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-sub);
    }

    .sent-list {
      max-height: 340px;
      overflow-y: auto;
    }

    .sent-row {
      padding: 9px 12px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sent-row:last-child {
      border-bottom: none;
    }

    .sent-row.is-active {
      background: #eef2ff;
      border-left: 3px solid var(--primary);
    }

    .sent-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .sent-row-en {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.38;
    }

    .sent-row-ko {
      font-size: 11.5px;
      color: var(--text-sub);
      line-height: 1.35;
    }

    /* Sticky Bottom 1-Line Mini Player */
    .mini-player {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      color: #f8fafc;
      padding: 6px 10px calc(6px + var(--safe-bottom));
      z-index: 50;
      box-shadow: var(--shadow-player);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .player-now {
      font-size: 11px;
      font-weight: 700;
      color: #c7d2fe;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .p-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      height: 32px;
      min-width: 32px;
      padding: 0 7px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .p-btn.p-main {
      background: #4f46e5;
      border-color: #6366f1;
      min-width: 36px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(56px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 999px;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      max-width: 90vw;
      text-align: center;
    }

    .toast.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="header-row">
        <h1 class="app-title">🧠 OPIc 빈출 문장 암기</h1>
        <div class="nav-pills">
          <a href="opic_study.html" class="nav-btn">🎧 스터디</a>
          <a href="survey.html" class="nav-btn is-survey">📋 서베이</a>
        </div>
      </div>
      <div class="sub-caption">
        <span>선택주제 + ★4개 이상 빈출 문장 반복 암기</span>
        <span id="poolBadge" class="pool-badge">40문장 선택</span>
      </div>
    </header>

    <!-- Controls: Scope (100/150/200/300%), Repeat (1-5), Speed & Voice -->
    <section class="settings-panel">
      <div class="setting-block">
        <div class="setting-label">
          <span>🎯 빈출 문장 범위</span>
          <span id="scopeDesc" class="setting-hint">가장 다용도·핵심 문장 우선</span>
        </div>
        <div id="scopeRow" class="seg-row" role="group" aria-label="빈출 문장 범위 선택">
          <button type="button" class="seg-btn is-active" data-scope="100"><span>100%</span><small>40문장</small></button>
          <button type="button" class="seg-btn" data-scope="150"><span>150%</span><small>60문장</small></button>
          <button type="button" class="seg-btn" data-scope="200"><span>200%</span><small>80문장</small></button>
          <button type="button" class="seg-btn" data-scope="300"><span>300%</span><small>120문장</small></button>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <span>🔁 한 문장 반복 횟수</span>
          <span class="setting-hint">반복 후 랜덤 다음 문장 이동</span>
        </div>
        <div id="repeatRow" class="seg-row repeat-row" role="group" aria-label="반복 횟수 선택">
          <button type="button" class="seg-btn" data-repeat="1">1회</button>
          <button type="button" class="seg-btn" data-repeat="2">2회</button>
          <button type="button" class="seg-btn is-active" data-repeat="3">3회</button>
          <button type="button" class="seg-btn" data-repeat="4">4회</button>
          <button type="button" class="seg-btn" data-repeat="5">5회</button>
        </div>
      </div>

      <div class="voice-row">
        <select id="voiceSelect" class="voice-select" aria-label="여성 원어민 TTS 음성 선택">
          <option value="">음성 로딩...</option>
        </select>
        <button type="button" id="btnRate" class="speed-btn" aria-label="재생 속도">1.0x</button>
      </div>
    </section>

    <!-- Active Flashcard -->
    <section id="flashcard" class="flashcard" aria-live="polite">
      <div class="card-top-meta">
        <div class="source-badges">
          <span id="cardTag" class="tag-chip">만능 묘사</span>
          <span id="cardStarChip" class="star-chip">★★★★★</span>
        </div>
        <span id="cardRank" class="rank-chip">#1 / 40문장</span>
      </div>
      <div id="cardScriptTitle" class="script-name-line">#19 [가족거주] 현재 사는 집과 좋아하는 방 묘사</div>

      <div class="repeat-tracker">
        <span id="repeatStatusText" class="repeat-label">반복 1 / 3 (랜덤 암기)</span>
        <div id="repeatDots" class="repeat-dots"></div>
      </div>

      <p id="sentenceEn" class="sentence-en">로딩 중...</p>
      <p id="sentenceKo" class="sentence-ko">번역 로딩 중...</p>

      <div class="card-action-row">
        <button type="button" id="btnMainPlay" class="act-btn is-primary">▶ 랜덤 암기 시작</button>
        <button type="button" id="btnNextRandom" class="act-btn">🎲 다음 랜덤</button>
      </div>
    </section>

    <!-- Sentence Pool List -->
    <section class="list-section">
      <div class="list-header">
        <span id="listTitle">📋 현재 암기 범위 문장 (40개)</span>
        <span id="listCountHint" class="setting-hint">터치하면 바로 재생</span>
      </div>
      <div id="sentList" class="sent-list"></div>
    </section>
  </div>

  <!-- Sticky Bottom 1-Line Mini Player -->
  <aside class="mini-player" aria-label="암기 미니 플레이어">
    <div id="playerNow" class="player-now">대기 중</div>
    <div class="player-controls">
      <button type="button" id="btnPrev" class="p-btn" aria-label="이전 문장">⏮</button>
      <button type="button" id="btnPlayPause" class="p-btn p-main" aria-label="재생/일시정지">▶</button>
      <button type="button" id="btnStop" class="p-btn" aria-label="정지">⏹</button>
      <button type="button" id="btnNext" class="p-btn" aria-label="다음 랜덤 문장">⏭</button>
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script>
    // Ranked high-frequency, versatile OPIc sentences from Choice (선택주제) + ★4+ scripts
    // Scope mapping: 100% = top 40, 150% = top 60, 200% = top 80, 300% = top 120
    const MEMORIZE_BANK = [
      // === TIER 100% (1..40): Ultra-versatile, high-impact IH/AL core sentences ===
      { rank: 1, itemId: 19, stars: 5, tag: "만능 감상/휴식", script: "[가족거주] 현재 사는 집과 방 묘사", en: "It's a great place to relax after a busy day, and I spend most of my free time there.", ko: "바쁜 하루를 보낸 후 휴식을 취하기에 아주 좋은 공간이라 여가 시간의 대부분을 그곳에서 보냅니다." },
      { rank: 2, itemId: 19, stars: 5, tag: "만능 환경묘사", script: "[가족거주] 현재 사는 집과 방 묘사", en: "I especially like that it's in a quiet area, so we can enjoy a peaceful environment.", ko: "특히 조용한 동네에 위치해 있어 평화로운 환경을 누릴 수 있다는 점이 마음에 듭니다." },
      { rank: 3, itemId: 19, stars: 5, tag: "만능 결론", script: "[가족거주] 현재 사는 집과 방 묘사", en: "Overall, I really love my home, and I wouldn't want to live anywhere else.", ko: "전반적으로 저는 제 집을 정말 사랑하며, 다른 어디에서도 살고 싶지 않습니다." },
      { rank: 4, itemId: 25, stars: 5, tag: "만능 선호이유", script: "[음악감상] 좋아하는 음악 장르와 가수", en: "It doesn't really go out of style, so I never get tired of listening to it.", ko: "유행을 타지 않아서 아무리 들어도 질리지 않습니다." },
      { rank: 5, itemId: 25, stars: 5, tag: "만능 감정표현", script: "[음악감상] 좋아하는 음악 장르와 가수", en: "It's catchy, energetic, and easy to sing along to, so it always puts me in a good mood.", ko: "귀에 쏙쏙 들어오고 에너지가 넘치며 따라 부르기 쉬워서 언제나 기분을 좋게 만들어 줍니다." },

      { rank: 118, itemId: 34, stars: 0, tag: "먹거리 묘사", script: "[해외여행] 방문했던 국가 묘사", en: "Another thing I noticed in these cities is that there are many kinds of street food.", ko: "이 도시들에서 제가 또 눈여겨본 점은 다양한 길거리 음식이 있다는 것입니다." },

      { rank: 120, itemId: 40, stars: 0, tag: "놀람 감정묘사", script: "[공원] 공원에서의 특별한 사건", en: "She was so shocked that she couldn't even move!", ko: "그녀는 너무 놀라서 꼼짝도 못 하더군요!" }
    ];

    const SCOPE_COUNT = { 100: 40, 150: 60, 200: 80, 300: 120 };
    const RATES = [0.85, 1.0, 1.15];
    const STORAGE_KEY = "opic_memorize_prefs_v1";

    const state = {
      scopePct: 100,
      repeatCount: 3,
      rate: 1.0,
      voiceName: "",
      voices: [],
      deck: [],
      deckPos: 0,
      history: [],
      curRepeat: 1,
      playing: false,
      paused: false,
      sessionToken: 0,
      delayTimer: null,
      chimeTimer: null,
      wakeLock: null
    };

    window._memUtterance = null;
    let audioCtx = null;

    function unlockAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!audioCtx) {
        try { audioCtx = new AudioCtx(); } catch { return null; }
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTransitionChime() {
      const ctx = unlockAudioContext();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const notes = [
          { freq: 783.99, delay: 0, dur: 0.14, peak: 0.065 },
          { freq: 1046.5, delay: 0.08, dur: 0.22, peak: 0.08 }
        ];
        notes.forEach(({ freq, delay, dur, peak }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(0.0001, now + delay);
          gain.gain.linearRampToValueAtTime(peak, now + delay + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur + 0.02);
        });
      } catch {}
    }

    async function acquireWakeLock() {
      if (!("wakeLock" in navigator) || state.wakeLock) return;
      try {
        state.wakeLock = await navigator.wakeLock.request("screen");
        state.wakeLock.addEventListener("release", () => { state.wakeLock = null; });
      } catch {}
    }

    async function releaseWakeLock() {
      if (!state.wakeLock) return;
      try { await state.wakeLock.release(); } catch {}
      state.wakeLock = null;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("is-show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("is-show"), 1900);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        if ([100, 150, 200, 300].includes(p.scopePct)) state.scopePct = p.scopePct;
        if (typeof p.repeatCount === "number" && p.repeatCount >= 1 && p.repeatCount <= 5) state.repeatCount = p.repeatCount;
        if (RATES.includes(p.rate)) state.rate = p.rate;
        if (typeof p.voiceName === "string") state.voiceName = p.voiceName;
      } catch {}
    }

    function savePrefs() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        scopePct: state.scopePct,
        repeatCount: state.repeatCount,
        rate: state.rate,
        voiceName: state.voiceName
      }));
    }

    function getActivePool() {
      const limit = SCOPE_COUNT[state.scopePct] || 40;
      return MEMORIZE_BANK.slice(0, limit);
    }

    function shuffleWithoutRepeat(pool, lastRank) {
      const copy = [...pool];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      if (copy.length > 1 && lastRank && copy[0].rank === lastRank) {
        const swapIdx = 1 + Math.floor(Math.random() * (copy.length - 1));
        [copy[0], copy[swapIdx]] = [copy[swapIdx], copy[0]];
      }
      return copy;
    }

    function resetDeck(preserveRank = null) {
      const pool = getActivePool();
      state.deck = shuffleWithoutRepeat(pool, preserveRank);
      if (preserveRank !== null) {
        const idx = state.deck.findIndex(x => x.rank === preserveRank);
        if (idx > 0) {
          [state.deck[0], state.deck[idx]] = [state.deck[idx], state.deck[0]];
        }
      }
      state.deckPos = 0;
      state.curRepeat = 1;
    }

    function getCurrentItem() {
      if (!state.deck.length) resetDeck();
      return state.deck[state.deckPos] || state.deck[0];
    }

    function advanceToRandomNext() {
      const cur = getCurrentItem();
      if (cur) state.history.push(cur);
      if (state.history.length > 50) state.history.shift();

      if (state.deckPos + 1 < state.deck.length) {
        state.deckPos += 1;
      } else {
        state.deck = shuffleWithoutRepeat(getActivePool(), cur ? cur.rank : null);
        state.deckPos = 0;
      }
      state.curRepeat = 1;
    }

    function scoreVoice(v) {
      const lang = (v.lang || "").toLowerCase();
      const name = (v.name || "").toLowerCase();
      let score = 0;
      if (lang === "en-us" || lang === "en_us") score += 100;
      else if (lang.startsWith("en-")) score += 40;
      else return -1;

      const maleKeywords = [
        /\bmale\b/, /\bdavid\b/, /\bmark\b/, /\bguy\b/, /\bandrew\b/,
        /\bbrian\b/, /\bchristopher\b/, /\beric\b/, /\broger\b/, /\bsteffan\b/,
        /\bdaniel\b/, /\balex\b/, /\bfred\b/, /\bjames\b/, /\brichard\b/,
        /\bgeorge\b/, /\bpaul\b/, /\bryan\b/, /\bthomas\b/, /\boliver\b/,
        /\barthur\b/, /iom/, /tpd/, /sfb/
      ];
      for (const rx of maleKeywords) {
        if (rx.test(name)) { score -= 500; break; }
      }
      const femalePriorities = [
        ["female", 200], ["ava", 160], ["aria", 155], ["jenny", 150],
        ["zira", 148], ["samantha", 145], ["google us english", 140],
        ["tpf", 135], ["sfg", 135], ["iob", 135], ["victoria", 132],
        ["karen", 130], ["moira", 130], ["tessa", 130], ["allison", 130],
        ["susan", 130], ["siri", 130], ["nicky", 128], ["emma", 125],
        ["natural", 30], ["enhanced", 25], ["premium", 22], ["online", 15]
      ];
      for (const [kw, pts] of femalePriorities) {
        if (name.includes(kw)) score += pts;
      }
      if (v.localService) score += 4;
      return score;
    }

    function loadVoices() {
      const sel = document.getElementById("voiceSelect");
      if (!("speechSynthesis" in window)) {
        sel.innerHTML = `<option value="">TTS 미지원</option>`;
        return;
      }
      const all = window.speechSynthesis.getVoices() || [];
      const englishVoices = all
        .map(v => ({ voice: v, score: scoreVoice(v) }))
        .filter(x => x.score >= 0)
        .sort((a, b) => b.score - a.score)
        .map(x => x.voice);

      state.voices = englishVoices;
      if (!englishVoices.length) {
        sel.innerHTML = `<option value="">여성 기본 (en-US)</option>`;
        return;
      }
      if (!state.voiceName || !englishVoices.some(v => v.name === state.voiceName)) {
        state.voiceName = englishVoices[0].name;
      }
      sel.innerHTML = englishVoices
        .map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`)
        .join("");
      sel.value = state.voiceName;
    }

    function getSelectedVoice() {
      if (!state.voices.length) return null;
      return state.voices.find(v => v.name === state.voiceName) || state.voices[0];
    }

    function clearTimers() {
      if (state.delayTimer) { clearTimeout(state.delayTimer); state.delayTimer = null; }
      if (state.chimeTimer) { clearTimeout(state.chimeTimer); state.chimeTimer = null; }
    }

    function stopMemorize(silent = false) {
      clearTimers();
      state.sessionToken += 1;
      state.playing = false;
      state.paused = false;
      state.curRepeat = 1;
      window._memUtterance = null;
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      releaseWakeLock();
      renderAll();
      if (!silent) {
        document.getElementById("playerNow").textContent = "대기 중";
      }
    }

    function speakCurrentRepeat(myToken) {
      if (!state.playing || state.paused || state.sessionToken !== myToken) return;
      if (!("speechSynthesis" in window)) {
        stopMemorize();
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }

      const item = getCurrentItem();
      if (!item) return;

      renderCard();
      renderListHighlight();
      updateStatusLine();

      const utt = new SpeechSynthesisUtterance(item.en);
      window._memUtterance = utt;
      const voice = getSelectedVoice();
      if (voice) {
        utt.voice = voice;
        utt.lang = voice.lang;
      } else {
        utt.lang = "en-US";
      }
      utt.rate = state.rate;
      utt.pitch = 1.08;

      utt.onend = () => {
        if (state.sessionToken !== myToken || !state.playing || state.paused) return;
        handleRepeatFinished(myToken);
      };

      utt.onerror = (ev) => {
        if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
        if (state.sessionToken !== myToken || !state.playing || state.paused) return;
        handleRepeatFinished(myToken);
      };

      try {
        window.speechSynthesis.speak(utt);
      } catch {
        stopMemorize();
        showToast("음성 재생 중 오류가 발생했습니다.");
      }
    }

    function handleRepeatFinished(myToken) {
      if (state.curRepeat < state.repeatCount) {
        state.curRepeat += 1;
        renderCard();
        updateStatusLine();
        state.delayTimer = setTimeout(() => {
          if (state.sessionToken === myToken && state.playing && !state.paused) {
            speakCurrentRepeat(myToken);
          }
        }, 700);
        return;
      }

      // Finished all repeats for this sentence -> chime + next random sentence
      advanceToRandomNext();
      renderCard();
      renderListHighlight();
      document.getElementById("playerNow").textContent = "🎲 다음 랜덤 문장...";

      state.chimeTimer = setTimeout(() => {
        if (state.sessionToken === myToken && state.playing && !state.paused) {
          playTransitionChime();
        }
      }, 150);

      state.delayTimer = setTimeout(() => {
        if (state.sessionToken === myToken && state.playing && !state.paused) {
          speakCurrentRepeat(myToken);
        }
      }, 950);
    }

    function startMemorize() {
      if (!("speechSynthesis" in window)) {
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }
      unlockAudioContext();
      clearTimers();
      state.sessionToken += 1;
      const myToken = state.sessionToken;
      state.playing = true;
      state.paused = false;
      state.curRepeat = 1;

      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        try { window.speechSynthesis.cancel(); } catch {}
        state.delayTimer = setTimeout(() => {
          if (state.sessionToken === myToken) speakCurrentRepeat(myToken);
        }, 50);
      } else {
        speakCurrentRepeat(myToken);
      }
      acquireWakeLock();
      renderControls();
    }

    function pauseMemorize() {
      if (!state.playing || state.paused) return;
      clearTimers();
      state.sessionToken += 1;
      state.paused = true;
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      releaseWakeLock();
      renderAll();
    }

    function resumeMemorize() {
      if (!state.playing || !state.paused) return;
      unlockAudioContext();
      state.paused = false;
      const myToken = ++state.sessionToken;
      acquireWakeLock();
      renderAll();
      speakCurrentRepeat(myToken);
    }

    function jumpRandomNext() {
      unlockAudioContext();
      clearTimers();
      state.sessionToken += 1;
      const myToken = state.sessionToken;
      advanceToRandomNext();
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      if (state.playing && !state.paused) {
        renderAll();
        state.delayTimer = setTimeout(() => {
          if (state.sessionToken === myToken) speakCurrentRepeat(myToken);
        }, 60);
      } else {
        state.playing = true;
        state.paused = false;
        acquireWakeLock();
        renderAll();
        speakCurrentRepeat(myToken);
      }
    }

    function jumpPrev() {
      if (!state.history.length) {
        showToast("이전 문장이 없습니다.");
        return;
      }
      unlockAudioContext();
      clearTimers();
      const prevItem = state.history.pop();
      const idx = state.deck.findIndex(x => x.rank === prevItem.rank);
      if (idx >= 0) {
        state.deckPos = idx;
      } else {
        state.deck.splice(state.deckPos, 0, prevItem);
      }
      state.curRepeat = 1;
      state.sessionToken += 1;
      const myToken = state.sessionToken;
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      if (state.playing && !state.paused) {
        renderAll();
        state.delayTimer = setTimeout(() => {
          if (state.sessionToken === myToken) speakCurrentRepeat(myToken);
        }, 60);
      } else {
        renderAll();
      }
    }

    function jumpToRank(rank) {
      unlockAudioContext();
      const pool = getActivePool();
      const target = pool.find(x => x.rank === rank);
      if (!target) return;

      const cur = getCurrentItem();
      if (cur && cur.rank !== rank) {
        state.history.push(cur);
        if (state.history.length > 50) state.history.shift();
      }

      const idx = state.deck.findIndex(x => x.rank === rank);
      if (idx >= 0) state.deckPos = idx;
      else {
        resetDeck(rank);
      }
      state.curRepeat = 1;
      clearTimers();
      state.sessionToken += 1;
      const myToken = state.sessionToken;
      state.playing = true;
      state.paused = false;
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      acquireWakeLock();
      renderAll();
      state.delayTimer = setTimeout(() => {
        if (state.sessionToken === myToken) speakCurrentRepeat(myToken);
      }, 60);
    }

    function renderSettings() {
      const pool = getActivePool();
      document.getElementById("poolBadge").textContent = `${pool.length}문장 (${state.scopePct}%)`;
      document.querySelectorAll("#scopeRow .seg-btn").forEach(btn => {
        btn.classList.toggle("is-active", Number(btn.dataset.scope) === state.scopePct);
      });
      document.querySelectorAll("#repeatRow .seg-btn").forEach(btn => {
        btn.classList.toggle("is-active", Number(btn.dataset.repeat) === state.repeatCount);
      });
      document.getElementById("btnRate").textContent = `${state.rate.toFixed(state.rate === 1 ? 1 : 2).replace(/\.00$/, ".0")}x`;
    }

    function renderCard() {
      const item = getCurrentItem();
      const pool = getActivePool();
      if (!item) return;

      const fc = document.getElementById("flashcard");
      fc.classList.toggle("is-speaking", state.playing && !state.paused);

      document.getElementById("cardTag").textContent = item.tag;
      const starChip = document.getElementById("cardStarChip");
      if (item.stars > 0) {
        starChip.style.display = "inline-block";
        starChip.textContent = "★".repeat(item.stars);
      } else {
        starChip.style.display = "inline-block";
        starChip.textContent = "선택주제";
      }
      document.getElementById("cardRank").textContent = `빈출 #${item.rank} · 범위 ${pool.length}`;
      document.getElementById("cardScriptTitle").textContent = `#${String(item.itemId).padStart(2, "0")} ${item.script}`;

      document.getElementById("repeatStatusText").textContent = `반복 ${state.curRepeat} / ${state.repeatCount}`;
      const dots = [];
      for (let i = 1; i <= state.repeatCount; i++) {
        let cls = "r-dot";
        if (i < state.curRepeat) cls += " is-done";
        else if (i === state.curRepeat) cls += " is-current";
        dots.push(`<span class="${cls}"></span>`);
      }
      document.getElementById("repeatDots").innerHTML = dots.join("");

      document.getElementById("sentenceEn").textContent = item.en;
      document.getElementById("sentenceKo").textContent = item.ko;
    }

    function renderControls() {
      const btnMain = document.getElementById("btnMainPlay");
      const btnPP = document.getElementById("btnPlayPause");
      if (state.playing && !state.paused) {
        btnMain.className = "act-btn is-playing";
        btnMain.textContent = "⏸ 일시정지";
        btnPP.textContent = "⏸";
      } else if (state.playing && state.paused) {
        btnMain.className = "act-btn is-primary";
        btnMain.textContent = "▶ 이어서 암기";
        btnPP.textContent = "▶";
      } else {
        btnMain.className = "act-btn is-primary";
        btnMain.textContent = "▶ 랜덤 암기 시작";
        btnPP.textContent = "▶";
      }
      updateStatusLine();
    }

    function updateStatusLine() {
      const el = document.getElementById("playerNow");
      const item = getCurrentItem();
      if (!state.playing || !item) {
        el.textContent = "대기 중";
        return;
      }
      const status = state.paused ? "일시정지" : `${state.curRepeat}/${state.repeatCount}회`;
      el.textContent = `🎲 #${String(item.itemId).padStart(2, "0")} (${status})`;
    }

    function renderList() {
      const pool = getActivePool();
      const cur = getCurrentItem();
      document.getElementById("listTitle").textContent = `📋 현재 범위 문장 (${pool.length}개 · ${state.scopePct}%)`;
      document.getElementById("sentList").innerHTML = pool.map(it => {
        const isAct = cur && cur.rank === it.rank ? "is-active" : "";
        const starStr = it.stars > 0 ? "★".repeat(it.stars) : "선택주제";
        return `
          <div class="sent-row ${isAct}" data-rank="${it.rank}">
            <div class="sent-row-top">
              <span>#${it.rank} · ${escapeHtml(it.tag)}</span>
              <span>#${String(it.itemId).padStart(2, "0")} (${starStr})</span>
            </div>
            <div class="sent-row-en">${escapeHtml(it.en)}</div>
            <div class="sent-row-ko">${escapeHtml(it.ko)}</div>
          </div>
        `;
      }).join("");
    }

    function renderListHighlight() {
      const cur = getCurrentItem();
      document.querySelectorAll(".sent-row").forEach(row => {
        const active = cur && Number(row.dataset.rank) === cur.rank;
        row.classList.toggle("is-active", Boolean(active));
      });
    }

    function renderAll() {
      renderSettings();
      renderCard();
      renderControls();
      renderList();
    }

    function bindEvents() {
      document.getElementById("scopeRow").addEventListener("click", e => {
        const btn = e.target.closest(".seg-btn");
        if (!btn) return;
        const pct = Number(btn.dataset.scope);
        if (pct === state.scopePct) return;
        state.scopePct = pct;
        savePrefs();
        resetDeck();
        if (state.playing && !state.paused) {
          startMemorize();
        } else {
          renderAll();
        }
        showToast(`빈출 범위 ${pct}% (${getActivePool().length}문장) 선택`);
      });

      document.getElementById("repeatRow").addEventListener("click", e => {
        const btn = e.target.closest(".seg-btn");
        if (!btn) return;
        state.repeatCount = Number(btn.dataset.repeat);
        if (state.curRepeat > state.repeatCount) state.curRepeat = state.repeatCount;
        savePrefs();
        renderAll();
        showToast(`문장당 ${state.repeatCount}회 반복`);
      });

      document.getElementById("btnRate").addEventListener("click", () => {
        const idx = RATES.indexOf(state.rate);
        state.rate = RATES[(idx + 1) % RATES.length];
        savePrefs();
        renderSettings();
        showToast(`재생 속도 ${state.rate}x`);
      });

      document.getElementById("voiceSelect").addEventListener("change", e => {
        state.voiceName = e.target.value;
        savePrefs();
        showToast("음성이 변경되었습니다.");
      });

      document.getElementById("btnMainPlay").addEventListener("click", () => {
        if (!state.playing) startMemorize();
        else if (state.paused) resumeMemorize();
        else pauseMemorize();
      });

      document.getElementById("btnPlayPause").addEventListener("click", () => {
        if (!state.playing) startMemorize();
        else if (state.paused) resumeMemorize();
        else pauseMemorize();
      });

      document.getElementById("btnNextRandom").addEventListener("click", jumpRandomNext);
      document.getElementById("btnNext").addEventListener("click", jumpRandomNext);
      document.getElementById("btnPrev").addEventListener("click", jumpPrev);
      document.getElementById("btnStop").addEventListener("click", () => stopMemorize());

      document.getElementById("sentList").addEventListener("click", e => {
        const row = e.target.closest(".sent-row");
        if (row) jumpToRank(Number(row.dataset.rank));
      });
    }

    function init() {
      loadPrefs();
      resetDeck();
      renderAll();
      bindEvents();
      loadVoices();
      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    init();
  </script>
</body>
</html>
