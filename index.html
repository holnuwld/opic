<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OPIc 포켓 스터디 (2026)</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --accent: #0d9488;
      --accent-soft: #f0fdfa;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-player: 0 -6px 24px rgba(15, 23, 42, 0.14);
      --radius-card: 16px;
      --radius-inner: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      padding-bottom: calc(64px + var(--safe-bottom));
      position: relative;
    }

    /* Header & Utility Bar */
    .top-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 10px 12px 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .survey-link-btn,
    .memorize-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #fef3c7;
      color: #78350f;
      border: 1px solid #f59e0b;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.14);
      transition: transform 0.1s;
    }

    .memorize-link-btn {
      background: #ede9fe;
      color: #4c1d95;
      border-color: #c4b5fd;
    }

    .survey-link-btn:active,
    .memorize-link-btn:active {
      transform: scale(0.95);
    }

    .progress-pill {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .utility-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: nowrap;
    }

    .util-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 30px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .util-btn:active {
      transform: scale(0.96);
    }

    .util-btn.is-active {
      background: #ffffff;
      color: #1e3a8a;
      border-color: #ffffff;
    }

    .util-btn.filler-btn {
      background: #fbbf24;
      color: #451a03;
      border-color: #f59e0b;
    }

    .voice-select-top {
      flex: 1;
      min-width: 0;
      height: 30px;
      background: rgba(15, 23, 42, 0.35);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .voice-select-top option {
      background: #0f172a;
      color: #ffffff;
    }

    /* Sticky Topic Tabs */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(243, 245, 249, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .tab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 7px 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s;
    }

    .tab-pill .tab-count {
      font-size: 10.5px;
      font-weight: 700;
      background: var(--bg);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 999px;
    }

    .tab-pill.is-active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-pill.is-active .tab-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .star-filter-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding: 0 12px 7px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .star-filter-bar::-webkit-scrollbar {
      display: none;
    }

    .star-pill {
      appearance: none;
      border: 1px solid #fde68a;
      background: #fffbeb;
      color: #92400e;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }

    .star-pill .star-cnt {
      font-size: 10px;
      opacity: 0.8;
    }

    .star-pill.is-active {
      background: #f59e0b;
      color: #ffffff;
      border-color: #d97706;
    }

    .star-pill.is-active .star-cnt {
      opacity: 1;
      color: #ffffff;
    }

    /* Tab Top Controls */
    .tab-controls {
      padding: 7px 12px 2px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .play-all-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play-all,
    .btn-play-random {
      flex: 1;
      appearance: none;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      padding: 9px 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 40px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.22);
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-play-random {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.22);
    }

    .btn-play-all:active,
    .btn-play-random:active {
      transform: scale(0.98);
    }

    .btn-play-all.is-playing,
    .btn-play-random.is-playing {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
    }

    .btn-play-all:disabled,
    .btn-play-random:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .mode-btn {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 4px;
      border-radius: 7px;
      cursor: pointer;
      min-height: 30px;
      transition: all 0.15s;
    }

    .mode-btn.is-active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Card List */
    .card-list {
      padding: 8px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-card);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 6px;
    }

    .q-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .q-card.is-active-card {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15), var(--shadow-md);
    }

    .q-card.is-done {
      border-color: #bbf7d0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px 6px;
      border-bottom: 1px solid #f1f5f9;
      background: #fafbfd;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .item-num {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .type-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .badge-rp { background: #ede9fe; color: #6d28d9; }
    .badge-exp { background: #dbeafe; color: #1d4ed8; }
    .badge-desc { background: #ccfbf1; color: #0f766e; }
    .badge-link { background: #fef3c7; color: #b45309; }
    .badge-proc { background: #fce7f3; color: #be185d; }

    .star-rating-pill {
      font-size: 10px;
      font-weight: 800;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 1px 5px;
      border-radius: 5px;
      letter-spacing: -0.04em;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-toggle {
      appearance: none;
      border: none;
      background: transparent;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.42;
      transition: opacity 0.15s, background 0.15s, transform 0.1s;
    }

    .icon-toggle:active {
      transform: scale(0.92);
    }

    .icon-toggle.is-on {
      opacity: 1;
      background: #f1f5f9;
    }

    /* Accordion Row (Question & Answer) */
    .qa-block {
      border-bottom: 1px solid #f1f5f9;
    }

    .qa-block:last-child {
      border-bottom: none;
    }

    .qa-block.is-playing-block > .qa-row {
      background: #eff6ff;
    }

    .qa-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .qa-row:active {
      background: #f8fafc;
    }

    .btn-play-item {
      appearance: none;
      border: 1.5px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .btn-play-item:active {
      transform: scale(0.93);
    }

    .btn-play-item.is-answer {
      border-color: #99f6e4;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-play-item.is-playing {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      animation: pulseRing 1.4s infinite;
    }

    .btn-play-item.is-answer.is-playing {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35); }
      70% { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .qa-summary-area {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qa-tag {
      font-size: 10.5px;
      font-weight: 900;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qa-tag.tag-q {
      background: #dbeafe;
      color: #1e40af;
    }

    .qa-tag.tag-a {
      background: #ccfbf1;
      color: #115e59;
    }

    .qa-keywords {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }

    .open-arrow {
      font-size: 14px;
      color: var(--text-muted);
      flex-shrink: 0;
      padding: 2px;
    }

    .step-mini {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
      vertical-align: 1px;
      letter-spacing: 0.01em;
    }

    .step-intro { background: #e0e7ff; color: #3730a3; }
    .step-body { background: #cffafe; color: #155e75; }
    .step-outro { background: #dcfce7; color: #166534; }

    /* Full-Screen Script Popup */
    .popup-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: calc(44px + var(--safe-bottom));
      background: rgba(15, 23, 42, 0.55);
      z-index: 45;
      display: none;
      justify-content: center;
    }

    .popup-backdrop.is-open {
      display: flex;
    }

    .script-popup {
      --popup-font-size: 16px;
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }

    .popup-toolbar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .popup-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .popup-title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .popup-num {
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .popup-num.is-answer {
      background: var(--accent);
    }

    .popup-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pop-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      white-space: nowrap;
    }

    .pop-btn:active {
      transform: scale(0.96);
    }

    .pop-btn.is-active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .pop-btn.pop-play {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .pop-btn.pop-play.is-playing {
      background: var(--danger);
      border-color: var(--danger);
    }

    .pop-switch-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      font-size: 11.5px;
      font-weight: 700;
      height: 28px;
      padding: 0 8px;
      border-radius: 7px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .popup-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 20px;
      cursor: pointer;
    }

    .script-popup.is-editing .popup-body {
      cursor: default;
    }

    .popup-kw-line {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 12px;
    }

    .popup-para-block {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .popup-para-block:last-of-type {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .popup-en-script {
      font-size: var(--popup-font-size);
      line-height: 1.54;
      color: var(--text);
      margin: 0;
      word-break: break-word;
    }

    .popup-ko-para {
      margin: 5px 0 0;
      font-size: max(11px, calc(var(--popup-font-size) * 0.74));
      line-height: 1.45;
      color: var(--text-muted);
    }

    body.hide-ko .popup-ko-para {
      display: none;
    }

    .popup-tap-hint {
      margin-top: 16px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* Popup Edit Form */
    .popup-edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .edit-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--primary);
    }

    .edit-input,
    .edit-textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text);
      background: var(--surface);
      resize: vertical;
    }

    .edit-input:focus,
    .edit-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .edit-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .edit-save-btn {
      flex: 2;
      appearance: none;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
    }

    .edit-cancel-btn,
    .edit-reset-btn {
      flex: 1;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 700;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
    }

    .edit-reset-btn {
      color: var(--danger);
    }

    .edit-auto-btn {

    function unlockAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;

          audioCtx = new AudioCtx();
        } catch {

      }
      return audioCtx;

    function playTransitionChime() {
      const ctx = unlockAudioContext();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const notes = [
          { freq: 783.99, delay: 0, dur: 0.16, peak: 0.07 },
          { freq: 1046.5, delay: 0.09, dur: 0.24, peak: 0.085 }
        ];
        notes.forEach(({ freq, delay, dur, peak }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(0.0001, now + delay);
          gain.gain.linearRampToValueAtTime(peak, now + delay + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur + 0.02);
        });
      } catch {}
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function unescapeHtml(str) {
      return str
        .replace(/&quot;/g, "\"")
        .replace(/&gt;/g, ">")
        .replace(/&lt;/g, "<")
        .replace(/&amp;/g, "&");
    }

    function stripHtmlToPlain(html) {
      return unescapeHtml(html.replace(/<[^>]+>/g, "")).replace(/\s+/g, " ").trim();
    }

    function splitSentences(text) {
      const protectedText = text
        .replace(/\b([pPaA])\.[mM]\.(?=\s+[a-z0-9,])/g, "$1__m__dot__")
        .replace(/\b([pPaA])\.[mM]\./g, "$1__m.")
        .replace(/\.\.\./g, "__ELLIPSIS__");
      const rawMatches = protectedText.match(/[^.!?]+(?:[.!?]+["']?|\s*$)/g) || [protectedText];
      return rawMatches
        .map(s => s
          .replace(/([pPaA])__m__dot__/g, "$1.m.")
          .replace(/([pPaA])__m\./g, "$1.m.")
          .replace(/__ELLIPSIS__/g, "...")
          .trim()
        )
        .filter(Boolean);
    }

    function splitHtmlBySentences(html, itemId, part, startIdx) {
      // Protect p.m./a.m. followed by lowercase and ellipses without altering tags
      const placeholderMap = [];
      let safeHtml = html.replace(/<[^>]+>/g, tag => {
        const key = `__TAG_${placeholderMap.length}__`;
        placeholderMap.push(tag);
        return key;
      });

      safeHtml = safeHtml
        .replace(/\b([pPaA])\.[mM]\.(?=\s+[a-z0-9,])/g, "$1__m__dot__")
        .replace(/\b([pPaA])\.[mM]\./g, "$1__m.")
        .replace(/\.\.\./g, "__ELLIPSIS__");

      const parts = safeHtml.match(/[^.!?]+(?:[.!?]+["']?(?:__TAG_\d+__)*|\s*$)/g) || [safeHtml];
      let idx = startIdx;
      const wrapped = parts
        .map(chunk => {
          const trimmed = chunk.trim();
          if (!trimmed) return "";
          let restored = trimmed
            .replace(/([pPaA])__m__dot__/g, "$1.m.")
            .replace(/([pPaA])__m\./g, "$1.m.")
            .replace(/__ELLIPSIS__/g, "...");
          restored = restored.replace(/__TAG_(\d+)__/g, (_, n) => placeholderMap[Number(n)]);
          const curIdx = idx++;
          return `<span class="tts-sentence" data-item-id="${itemId}" data-part="${part}" data-sidx="${curIdx}">${restored}</span>`;
        })
        .filter(Boolean)
        .join(" ");

      return { html: wrapped, nextIdx: idx };
    }

    function matchesStarFilter(item, filterId) {
      const s = Number(item.stars || 0);
      if (filterId === "all") return true;
      if (filterId === "any") return s >= 1;
      if (filterId === "gte4") return s >= 4;
      if (filterId === "eq5") return s === 5;
      if (filterId === "eq4") return s === 4;
      if (filterId === "eq3") return s === 3;
      if (filterId === "eq2") return s === 2;
      if (filterId === "eq1") return s === 1;
      return true;
    }

    function getItemsForTab(tabId, ignoreStarFilter = false) {

      if (ignoreStarFilter) return base;
      return base.filter(item => matchesStarFilter(item, state.starFilter));

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {

      }

    // --- Web Speech API Voices (Female Preferred) ---
    function scoreVoice(v) {
      const lang = (v.lang || "").toLowerCase();
      const name = (v.name || "").toLowerCase();
      let score = 0;
      if (lang === "en-us" || lang === "en_us") score += 100;
      else if (lang.startsWith("en-")) score += 40;
      else return -1;

      const maleKeywords = [
        /\bmale\b/, /\bdavid\b/, /\bmark\b/, /\bguy\b/, /\bandrew\b/,
        /\bbrian\b/, /\bchristopher\b/, /\beric\b/, /\broger\b/, /\bsteffan\b/,
        /\bdaniel\b/, /\balex\b/, /\bfred\b/, /\bjames\b/, /\brichard\b/,
        /\bgeorge\b/, /\bpaul\b/, /\bryan\b/, /\bthomas\b/, /\boliver\b/,
        /\barthur\b/, /iom/, /tpd/, /sfb/
      ];
      for (const rx of maleKeywords) {
        if (rx.test(name)) {
          score -= 500;
          break;
        }
      }

      const femalePriorities = [
        ["female", 200],
        ["ava", 160],
        ["aria", 155],
        ["jenny", 150],
        ["zira", 148],
        ["samantha", 145],
        ["google us english", 140],
        ["tpf", 135],
        ["sfg", 135],
        ["iob", 135],
        ["victoria", 132],
        ["karen", 130],
        ["moira", 130],
        ["tessa", 130],
        ["allison", 130],
        ["susan", 130],
        ["siri", 130],
        ["nicky", 128],
        ["emma", 125],
        ["sonia", 125],
        ["libby", 125],
        ["natural", 30],
        ["enhanced", 25],
        ["premium", 22],
        ["online", 15]
      ];
      for (const [kw, pts] of femalePriorities) {
        if (name.includes(kw)) score += pts;
      }
      if (v.localService) score += 4;
      return score;
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) {
        const sel = document.getElementById("voiceSelect");
        sel.innerHTML = `<option value="">TTS 미지원</option>`;
        return;
      }
      const all = window.speechSynthesis.getVoices() || [];
      const englishVoices = all
        .map(v => ({ voice: v, score: scoreVoice(v) }))
        .filter(x => x.score >= 0)
        .sort((a, b) => b.score - a.score)
        .map(x => x.voice);

      state.voices = englishVoices;
      const sel = document.getElementById("voiceSelect");
      if (englishVoices.length === 0) {
        sel.innerHTML = `<option value="">여성 기본 (en-US)</option>`;
        return;
      }

      if (!state.prefs.voiceName || !englishVoices.some(v => v.name === state.prefs.voiceName)) {
        state.prefs.voiceName = englishVoices[0].name;
      }

      sel.innerHTML = englishVoices
        .map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`)
        .join("");
      sel.value = state.prefs.voiceName;
    }

    function getSelectedVoice() {
      if (!state.voices.length) return null;
      return state.voices.find(v => v.name === state.prefs.voiceName) || state.voices[0];
    }

    // --- TTS & Audio File Engine ---
    function sanitizeAudioFilename(name) {
      return String(name || "")
        .replace(/[\\/:*?"<>|]/g, "_")
        .trim()
        .replace(/\s+/g, "_");
    }

    function getTtsAudioUrl(itemId, part) {
      const defItem = DEFAULT_OPIC_DATA.find(x => x.id === itemId);
      if (!defItem) return null;

      const numStr = String(defItem.id).padStart(2, "0");
      const safeTitle = sanitizeAudioFilename(defItem.title);
      const fileName = part === "Q" ? `${numStr}_Q_${safeTitle}.mp3` : `${numStr}_${safeTitle}.mp3`;
      return `tts/${encodeURIComponent(fileName)}`;
    }

    function clearDelayTimer() {
      if (state.playback.delayTimer) {
        clearTimeout(state.playback.delayTimer);
        state.playback.delayTimer = null;
      }
      if (state.playback.chimeTimer) {
        clearTimeout(state.playback.chimeTimer);
        state.playback.chimeTimer = null;
      }
    }

    function stopAudioElement(resetSrc = true) {
      if (!audioPlayer) return;
      audioPlayer.ontimeupdate = null;
      audioPlayer.onended = null;
      audioPlayer.onerror = null;
      try {
        audioPlayer.pause();
      } catch {}
      if (resetSrc) {
        try {
          audioPlayer.currentTime = 0;
        } catch {}
        try {
          audioPlayer.removeAttribute("src");
          audioPlayer.load();
        } catch {}
      }
    }

    function stopPlayback(silent = false) {
      clearDelayTimer();
      state.playback.sessionToken += 1;
      state.playback.active = false;
      state.playback.paused = false;
      state.playback.usingAudioFile = false;
      state.playback.queue = [];
      state.playback.queueIndex = 0;
      state.playback.sentIndex = 0;
      window._activeUtterance = null;
      stopAudioElement(true);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch {}
      }
      releaseWakeLock();
      updatePlaybackUI();
      if (!silent) {
        document.getElementById("playerNow").textContent = "대기 중";
      }
    }

    function startQueue(queue, scope, initialSentIdx = 0) {
      const hasWebTts = "speechSynthesis" in window;
      if (state.prefs.audioSource === "web" && !hasWebTts) {
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }
      if (!audioPlayer && !hasWebTts) {
        showToast("오디오 재생이 지원되지 않는 브라우저입니다.");
        return;
      }
      if (!queue.length) {
        showToast("재생할 문항이 없습니다.");
        return;
      }

      const wasActive = state.playback.active;
      const webSpeaking = hasWebTts && (window.speechSynthesis.speaking || window.speechSynthesis.pending);
      clearDelayTimer();
      unlockAudioContext();
      state.playback.sessionToken += 1;
      const myToken = state.playback.sessionToken;

      state.playback.active = true;
      state.playback.paused = false;
      state.playback.scope = scope;
      state.playback.queue = queue;
      state.playback.queueIndex = 0;
      state.playback.sentIndex = initialSentIdx;

      stopAudioElement(true);
      if (webSpeaking || (wasActive && state.prefs.audioSource === "web")) {
        if (hasWebTts) {
          try { window.speechSynthesis.cancel(); } catch {}
        }
        state.playback.delayTimer = setTimeout(() => {
          if (state.playback.sessionToken === myToken) {
            playCurrentBlock(myToken);
          }
        }, 50);
      } else {
        // Trigger synchronously inside user gesture for mobile audio unlock
        playCurrentBlock(myToken);
      }

      acquireWakeLock();
      syncPopupWithPlayback();
      updatePlaybackUI();
      scrollToActiveBlock();
    }

    function syncPopupWithPlayback() {
      const pb = state.playback;
      if (!pb.active || (pb.scope !== "tab" && pb.scope !== "random")) return;
      if (state.popup.isEditing) return;
      const block = pb.queue[pb.queueIndex];
      if (!block) return;
      if (!state.popup.isOpen || state.popup.itemId !== block.itemId || state.popup.part !== block.part) {
        openScriptPopup(block.itemId, block.part, { isEditing: false });
      }
    }

    function playCurrentBlock(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;

      const block = pb.queue[pb.queueIndex];
      if (!block) {
        stopPlayback();
        return;
      }

      const audioUrl =
        state.prefs.audioSource === "file" && pb.scope !== "sentence"
          ? getTtsAudioUrl(block.itemId, block.part)
          : null;

      if (audioUrl && audioPlayer) {
        pb.usingAudioFile = true;
        if ("speechSynthesis" in window) {
          try { window.speechSynthesis.cancel(); } catch {}
        }
        stopAudioElement(false);

        const lengths = block.sentences.map(s => Math.max(1, s.length));
        const totalLen = lengths.reduce((a, b) => a + b, 0) || 1;
        const cumEndRatios = [];
        let acc = 0;
        for (const len of lengths) {
          acc += len;
          cumEndRatios.push(acc / totalLen);
        }

        const fallbackToWebTts = () => {
          if (state.playback.sessionToken !== myToken || state.playback.paused) return;
          pb.usingAudioFile = false;
          stopAudioElement(true);
          if ("speechSynthesis" in window) {
            speakCurrentSentence(myToken);
          } else {
            advanceToNextBlock(myToken);
          }
        };

        audioPlayer.ontimeupdate = () => {
          if (state.playback.sessionToken !== myToken || state.playback.paused) return;
          if (!audioPlayer.duration || !isFinite(audioPlayer.duration) || audioPlayer.duration <= 0) return;
          const progress = audioPlayer.currentTime / audioPlayer.duration;
          let nextIdx = cumEndRatios.length - 1;
          for (let i = 0; i < cumEndRatios.length; i++) {
            if (progress < cumEndRatios[i]) {
              nextIdx = i;
              break;
            }
          }
          if (nextIdx !== pb.sentIndex) {
            pb.sentIndex = nextIdx;
            updatePlaybackUI();
          }
        };

        audioPlayer.onended = () => {
          if (state.playback.sessionToken !== myToken || state.playback.paused) return;
          pb.sentIndex = Math.max(0, block.sentences.length - 1);
          advanceToNextBlock(myToken);
        };

        audioPlayer.onerror = () => {
          fallbackToWebTts();
        };

        audioPlayer.src = audioUrl;
        audioPlayer.playbackRate = state.prefs.rate;
        try {
          audioPlayer.currentTime = 0;
        } catch {}
        updatePlaybackUI();

        const playPromise = audioPlayer.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {
            fallbackToWebTts();
          });
        }
        return;
      }

      pb.usingAudioFile = false;
      speakCurrentSentence(myToken);
    }

    function speakCurrentSentence(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;
      if (!("speechSynthesis" in window)) {
        stopPlayback();
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }

      const block = pb.queue[pb.queueIndex];
      if (!block) {
        stopPlayback();
        return;
      }
      const text = block.sentences[pb.sentIndex];
      if (!text) {
        advanceToNextBlock(myToken);
        return;
      }

      const utt = new SpeechSynthesisUtterance(text);
      window._activeUtterance = utt; // Prevent GC on mobile browsers

      const voice = getSelectedVoice();
      if (voice) {
        utt.voice = voice;
        utt.lang = voice.lang;
      } else {
        utt.lang = "en-US";
      }
      utt.rate = state.prefs.rate;
      utt.pitch = block.part === "Q" ? 1.05 : 1.08;

      utt.onend = () => {
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        advanceSentence(myToken);
      };

      utt.onerror = (ev) => {
        if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        advanceSentence(myToken);
      };

      updatePlaybackUI();
      try {
        window.speechSynthesis.speak(utt);
      } catch {
        stopPlayback();
        showToast("음성 재생 중 오류가 발생했습니다.");
      }
    }

    function advanceSentence(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;
      const block = pb.queue[pb.queueIndex];
      if (!block) {
        stopPlayback();
        return;
      }

      if (pb.sentIndex + 1 < block.sentences.length) {
        pb.sentIndex += 1;
        speakCurrentSentence(myToken);
        return;
      }

      advanceToNextBlock(myToken);
    }

    function findItemStartQueueIndex(itemId) {
      const pb = state.playback;
      for (let i = 0; i < pb.queue.length; i++) {
        if (pb.queue[i].itemId === itemId) return i;
      }
      return 0;
    }

    function advanceToNextBlock(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;

      const curBlock = pb.queue[pb.queueIndex];
      const nextIdx = pb.queueIndex + 1;
      const nextBlock = pb.queue[nextIdx];

      // Handle 1-item repeat
      if (pb.repeatOne && pb.scope !== "sentence") {
        const sameItemNext = nextBlock && curBlock && nextBlock.itemId === curBlock.itemId;
        if (!sameItemNext) {
          pb.queueIndex = findItemStartQueueIndex(curBlock.itemId);
          pb.sentIndex = 0;
          document.getElementById("playerNow").textContent = "🔁 현재 문항 반복...";
          pb.delayTimer = setTimeout(() => {
            if (pb.sessionToken === myToken && !pb.paused) {
              syncPopupWithPlayback();
              scrollToActiveBlock();
              playCurrentBlock(myToken);
            }
          }, 700);
          return;
        }
      }

      if (nextIdx >= pb.queue.length) {
        stopPlayback();
        showToast("재생이 완료되었습니다.");
        return;
      }

      const sameItem = curBlock && nextBlock.itemId === curBlock.itemId;
      const shouldChime = !sameItem && (pb.scope === "tab" || pb.scope === "random");
      const pauseMs = sameItem ? 600 : (shouldChime ? 1050 : 800);
      pb.queueIndex = nextIdx;
      pb.sentIndex = 0;

      syncPopupWithPlayback();
      updatePlaybackUI();
      document.getElementById("playerNow").textContent = sameItem
        ? "잠시 후 답변..."
        : "다음 문항 이동...";
      scrollToActiveBlock();

      if (shouldChime) {
        pb.chimeTimer = setTimeout(() => {
          if (state.playback.sessionToken === myToken && !state.playback.paused) {
            playTransitionChime();
          }
        }, 160);
      }

      pb.delayTimer = setTimeout(() => {
        if (pb.sessionToken === myToken && !pb.paused) {
          playCurrentBlock(myToken);
        }
      }, pauseMs);
    }

    function pausePlayback() {
      if (!state.playback.active || state.playback.paused) return;
      clearDelayTimer();
      state.playback.sessionToken += 1;
      state.playback.paused = true;
      if (state.playback.usingAudioFile && audioPlayer) {
        try { audioPlayer.pause(); } catch {}
      } else if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      releaseWakeLock();
      updatePlaybackUI();
    }

    function resumePlayback() {
      const pb = state.playback;
      if (!pb.active || !pb.paused) return;
      unlockAudioContext();
      pb.paused = false;
      const myToken = ++pb.sessionToken;
      acquireWakeLock();
      updatePlaybackUI();

      if (pb.usingAudioFile && state.prefs.audioSource === "file" && audioPlayer && audioPlayer.src) {
        const block = pb.queue[pb.queueIndex];
        audioPlayer.playbackRate = state.prefs.rate;
        audioPlayer.onended = () => {
          if (state.playback.sessionToken !== myToken || state.playback.paused) return;
          if (block) pb.sentIndex = Math.max(0, block.sentences.length - 1);
          advanceToNextBlock(myToken);
        };
        const p = audioPlayer.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => playCurrentBlock(myToken));
        }
        return;
      }

      playCurrentBlock(myToken);
    }

    function jumpQueueItem(direction) {
      const pb = state.playback;
      if (!pb.active || !pb.queue.length) return;
      const curItemId = pb.queue[pb.queueIndex]?.itemId;

      let targetIdx = pb.queueIndex + direction;
      if (direction > 0) {
        while (targetIdx < pb.queue.length && pb.queue[targetIdx].itemId === curItemId) {
          targetIdx++;
        }
        if (targetIdx >= pb.queue.length) targetIdx = 0;
      } else {
        // Move to start of current item if mid-item, else start of previous item
        const curStart = findItemStartQueueIndex(curItemId);
        if (pb.queueIndex > curStart || pb.sentIndex > 0) {
          targetIdx = curStart;
        } else {
          let prevEnd = curStart - 1;
          if (prevEnd < 0) prevEnd = pb.queue.length - 1;
          targetIdx = findItemStartQueueIndex(pb.queue[prevEnd].itemId);
        }
      }

      clearDelayTimer();
      pb.sessionToken += 1;
      const myToken = pb.sessionToken;
      pb.queueIndex = targetIdx;
      pb.sentIndex = 0;
      pb.paused = false;
      stopAudioElement(true);
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      acquireWakeLock();
      syncPopupWithPlayback();
      updatePlaybackUI();
      scrollToActiveBlock();
      if (state.prefs.audioSource === "file") {
        playCurrentBlock(myToken);
      } else {
        pb.delayTimer = setTimeout(() => {
          if (pb.sessionToken === myToken) playCurrentBlock(myToken);
        }, 60);
      }
    }

    function playSinglePart(itemId, part) {
      const pb = state.playback;
      const cur = pb.queue[pb.queueIndex];
      if (pb.active && pb.scope === "single" && cur && cur.itemId === itemId && cur.part === part) {
        stopPlayback();
        return;
      }
      const item = OPIC_DATA.find(x => x.id === itemId);
      if (!item) return;
      const text = part === "Q" ? item.qEn : item.aEnPlain;
      startQueue([{ itemId, part, sentences: splitSentences(text) }], "single", 0);
    }

    function buildQueueFromItems(items) {
      const queue = [];
      for (const item of items) {
        if (state.prefs.playMode === "qa" || state.prefs.playMode === "q") {
          queue.push({ itemId: item.id, part: "Q", sentences: splitSentences(item.qEn) });
        }
        if (state.prefs.playMode === "qa" || state.prefs.playMode === "a") {
          queue.push({ itemId: item.id, part: "A", sentences: splitSentences(item.aEnPlain) });
        }
      }
      return queue;
    }

    function playTabAll() {
      const pb = state.playback;
      if (pb.active && pb.scope === "tab") {
        stopPlayback();
        return;
      }
      const items = getItemsForTab(state.activeTab);
      if (!items.length) {
        showToast("현재 탭에 재생할 문항이 없습니다.");
        return;
      }
      startQueue(buildQueueFromItems(items), "tab", 0);
    }

    function playTabRandom() {
      const pb = state.playback;
      if (pb.active && pb.scope === "random") {
        stopPlayback();
        return;
      }
      const items = getItemsForTab(state.activeTab);
      if (!items.length) {
        showToast("현재 탭에 재생할 문항이 없습니다.");
        return;
      }
      const shuffled = shuffleArray(items);
      startQueue(buildQueueFromItems(shuffled), "random", 0);
      showToast(`🔀 ${shuffled.length}개 문항 랜덤 재생 시작`);
    }

    function playSingleSentence(itemId, part, sidx) {
      const item = OPIC_DATA.find(x => x.id === itemId);
      if (!item) return;
      const sentences = splitSentences(part === "Q" ? item.qEn : item.aEnPlain);
      if (!sentences[sidx]) return;
      // Play only that single sentence cleanly
      const pb = state.playback;
      const wasActive = pb.active;
      clearDelayTimer();
      pb.sessionToken += 1;
      const myToken = pb.sessionToken;
      pb.active = true;
      pb.paused = false;
      pb.usingAudioFile = false;
      pb.scope = "sentence";
      pb.queue = [{ itemId, part, sentences: [sentences[sidx]], displaySentIdx: sidx }];
      pb.queueIndex = 0;
      pb.sentIndex = 0;

      stopAudioElement(true);
      if ("speechSynthesis" in window && (wasActive || window.speechSynthesis.speaking)) {
        window.speechSynthesis.cancel();
        pb.delayTimer = setTimeout(() => {
          if (pb.sessionToken === myToken) speakCurrentSentence(myToken);
        }, 50);
      } else {
        speakCurrentSentence(myToken);
      }
      updatePlaybackUI();
    }

    function speakFillerPhrase(text) {
      if (!("speechSynthesis" in window)) return;
      stopPlayback(true);
      const utt = new SpeechSynthesisUtterance(text);
      window._activeUtterance = utt;
      const voice = getSelectedVoice();
      if (voice) {
        utt.voice = voice;
        utt.lang = voice.lang;
      } else {
        utt.lang = "en-US";
      }
      utt.rate = state.prefs.rate;
      utt.pitch = 1.06;
      window.speechSynthesis.speak(utt);
    }

    function scrollToActiveBlock() {
      const pb = state.playback;
      if (!pb.active) return;
      const block = pb.queue[pb.queueIndex];
      if (!block) return;
      const card = document.querySelector(`.q-card[data-id="${block.itemId}"]`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    // --- UI Updates ---
    function updatePlaybackUI() {
      const pb = state.playback;
      const curBlock = pb.active ? pb.queue[pb.queueIndex] : null;
      const curItem = curBlock ? OPIC_DATA.find(x => x.id === curBlock.itemId) : null;

      // Tab Play All & Random buttons
      const btnTab = document.getElementById("btnPlayTab");
      const btnRandom = document.getElementById("btnPlayRandom");
      const tabItems = getItemsForTab(state.activeTab);
      if (pb.active && pb.scope === "tab") {
        btnTab.classList.add("is-playing");
        btnTab.textContent = `⏹ 전체 정지 (${tabItems.length})`;
      } else {
        btnTab.classList.remove("is-playing");
        btnTab.textContent = `▶ 전체 재생 (${tabItems.length})`;
      }
      btnTab.disabled = tabItems.length === 0;

      if (pb.active && pb.scope === "random") {
        btnRandom.classList.add("is-playing");
        btnRandom.textContent = "⏹ 랜덤 정지";
      } else {
        btnRandom.classList.remove("is-playing");
        btnRandom.textContent = "🔀 랜덤 재생";
      }
      btnRandom.disabled = tabItems.length === 0;

      // Mini player status & buttons (1-line)
      const btnPlayPause = document.getElementById("btnPlayPause");
      btnPlayPause.textContent = !pb.active || pb.paused ? "▶" : "⏸";

      const btnRepeat = document.getElementById("btnRepeat");
      btnRepeat.classList.toggle("is-on", pb.repeatOne);

      if (pb.active && curBlock && curItem) {
        const numStr = String(curItem.id).padStart(2, "0");
        const randPrefix = pb.scope === "random" ? "🔀 " : "";
        const srcPrefix = pb.usingAudioFile ? "🎵 " : "";
        const stateText = pb.paused ? "일시정지" : `${pb.sentIndex + 1}/${curBlock.sentences.length}`;
        document.getElementById("playerNow").textContent =
          `${randPrefix}${srcPrefix}#${numStr} ${curBlock.part} (${stateText})`;
      }

      // Highlight cards, buttons, sentences in DOM
      document.querySelectorAll(".q-card").forEach(card => {
        const id = Number(card.dataset.id);
        card.classList.toggle("is-active-card", Boolean(curBlock && curBlock.itemId === id));
      });

      document.querySelectorAll(".qa-block").forEach(el => {
        const id = Number(el.dataset.id);
        const part = el.dataset.part;
        const isThis = Boolean(curBlock && curBlock.itemId === id && curBlock.part === part);
        el.classList.toggle("is-playing-block", isThis);
        const btn = el.querySelector(".btn-play-item");
        if (btn) {
          btn.classList.toggle("is-playing", isThis && !pb.paused);
          btn.textContent = isThis && !pb.paused ? "⏹" : "▶";
        }
      });

      document.querySelectorAll(".tts-sentence").forEach(span => {
        const id = Number(span.dataset.itemId);
        const part = span.dataset.part;
        const sidx = Number(span.dataset.sidx);
        const targetSidx = curBlock && typeof curBlock.displaySentIdx === "number"
          ? curBlock.displaySentIdx
          : pb.sentIndex;
        const isSpeaking = Boolean(
          pb.active &&
          !pb.paused &&
          curBlock &&
          curBlock.itemId === id &&
          curBlock.part === part &&
          targetSidx === sidx
        );
        span.classList.toggle("is-speaking", isSpeaking);
        if (isSpeaking && state.popup.isOpen && !state.popup.isEditing && span.closest("#popupBody")) {
          try {
            span.scrollIntoView({ behavior: "smooth", block: "nearest" });
          } catch {}
        }
      });

      const btnPopupPlay = document.getElementById("btnPopupPlay");
      if (btnPopupPlay && state.popup.isOpen) {
        const isPopupPlaying = Boolean(
          pb.active &&
          !pb.paused &&
          curBlock &&
          curBlock.itemId === state.popup.itemId &&
          curBlock.part === state.popup.part
        );
        btnPopupPlay.classList.toggle("is-playing", isPopupPlaying);
        btnPopupPlay.textContent = isPopupPlaying ? "⏹ 정지" : "▶ 재생";
      }
    }

    // --- Full-Screen Script Popup ---
    function applyPopupFontSize() {
      const popup = document.getElementById("scriptPopup");
      if (popup) {
        popup.style.setProperty("--popup-font-size", `${state.prefs.popupFontSize}px`);
      }
    }

    function changePopupFontSize(delta) {
      const next = Math.max(13, Math.min(26, state.prefs.popupFontSize + delta));
      if (next === state.prefs.popupFontSize) {
        showToast(delta > 0 ? "최대 글자 크기입니다." : "최소 글자 크기입니다.");
        return;
      }
      state.prefs.popupFontSize = next;
      savePrefs();
      applyPopupFontSize();
      showToast(`글자 크기 ${next}px`);
    }

    function openScriptPopup(itemId, part = "A", options = {}) {
      const item = OPIC_DATA.find(x => x.id === itemId);
      if (!item) return;
      state.popup.isOpen = true;
      state.popup.itemId = itemId;
      state.popup.part = part;
      state.popup.isEditing = Boolean(options.isEditing);

      const backdrop = document.getElementById("scriptPopupBackdrop");
      backdrop.classList.add("is-open");
      backdrop.setAttribute("aria-hidden", "false");
      renderScriptPopup();
      updatePlaybackUI();
    }

    async function translateEnToKo(text) {
      const cleaned = (text || "").replace(/\s+/g, " ").trim();
      if (!cleaned) return "";
      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 4500) : null;
      try {
        const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=" + encodeURIComponent(cleaned);
        const res = await fetch(url, controller ? { signal: controller.signal } : undefined);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!Array.isArray(data) || !Array.isArray(data[0])) throw new Error("Invalid translate response");
        return data[0].map(seg => (seg && seg[0]) ? seg[0] : "").join("").trim();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    function extractKeywordsFromEnglish(plainText, maxWords = 5) {
      let s = (plainText || "").replace(/\s+/g, " ").trim();
      if (!s) return "";

      const leadPatterns = [
        /^(?:well|so|yeah|okay|ok|oh|hi there|hello|hey|excuse me|actually|honestly|overall|all in all|looking back|meanwhile|however|therefore|basically|essentially|obviously|unfortunately|luckily|eventually|finally|in the end|to start|first of all|first|second|third|next|then|after that|as i mentioned|you know|i mean)\b[,:\s]*/i,
        /^(?:let me tell you about|i'd like to talk about|i would like to talk about|i'd like to tell you about|tell me about|can you tell me about|now,?\s*tell me about|could you describe for me|could you think about)\b[,:\s]*/i,
        /^(?:yes,?\s*i had this kind of (?:incident|experience)|the last time i|whenever i|when i)\b[,:\s]*/i
      ];
      for (let pass = 0; pass < 3; pass++) {
        let changed = false;
        for (const rx of leadPatterns) {
          const next = s.replace(rx, "").trim();
          if (next !== s && next.length > 0) {
            s = next;
            changed = true;
          }
        }
        if (!changed) break;
      }

      const firstSent = (s.split(/[.!?]+/)[0] || s).trim();
      const words = firstSent.replace(/[^A-Za-z0-9''\-\s]/g, " ").trim().split(/\s+/).filter(Boolean);
      const stopWords = new Set([
        "i", "me", "my", "mine", "myself", "we", "us", "our", "ours",
        "you", "your", "yours", "he", "him", "his", "she", "her", "hers",
        "it", "its", "they", "them", "their", "theirs",
        "a", "an", "the", "is", "am", "are", "was", "were", "be", "been", "being",
        "have", "has", "had", "do", "does", "did", "will", "would", "can", "could", "should",
        "to", "of", "in", "on", "at", "by", "for", "with", "from", "about", "as", "into",
        "that", "this", "these", "those", "there", "here", "which", "who", "whom", "whose",
        "and", "or", "but", "so", "if", "because", "while", "when", "where", "than",
        "very", "really", "just", "quite", "pretty", "actually", "basically", "some", "any", "such"
      ]);

      const content = words.filter(w => !stopWords.has(w.toLowerCase()));
      const picked = (content.length >= 2 ? content : words).slice(0, maxWords);
      if (!picked.length) return "";
      const joined = picked.join(" ");
      return joined.charAt(0).toUpperCase() + joined.slice(1);
    }

    function buildUpdatedAKeywords(item, defItem) {
      const defBeats = ((defItem && defItem.aKeywords) || "").split("➔").map(s => s.trim());
      const beats = item.aSections.map((sec, i) => {
        const curPlain = stripHtmlToPlain(sec.enHtml);
        const defPlain = defItem && defItem.aSections[i] ? stripHtmlToPlain(defItem.aSections[i].enHtml) : "";
        const defBeat = defBeats[i] || "";
        if (curPlain === defPlain && defBeat) {
          return defBeat;
        }
        const emojiMatch = defBeat.match(/^([^\x00-\x7F]+\s*)/);
        const prefix = emojiMatch ? emojiMatch[1] : "";
        const kw = extractKeywordsFromEnglish(curPlain, 5);
        return kw ? `${prefix}${kw}` : (defBeat || curPlain.slice(0, 32));
      });
      return beats.join(" ➔ ");
    }

    function buildUpdatedQKeywords(item, defItem) {
      const curQ = (item.qEn || "").replace(/\s+/g, " ").trim();
      const defQ = ((defItem && defItem.qEn) || "").replace(/\s+/g, " ").trim();
      if (defItem && curQ === defQ) return defItem.qKeywords;
      const sentences = splitSentences(curQ);
      const parts = sentences.slice(0, 3).map(s => extractKeywordsFromEnglish(s, 4)).filter(Boolean);
      return parts.length ? parts.join(" · ") : (defItem ? defItem.qKeywords : curQ.slice(0, 48));
    }

    async function autoGenerateEditFields() {
      const item = OPIC_DATA.find(x => x.id === state.popup.itemId);
      const defItem = DEFAULT_OPIC_DATA.find(x => x.id === state.popup.itemId);
      if (!item || !defItem) return;

      const autoBtn = document.getElementById("btnAutoTranslateEdit");
      if (autoBtn) {
        autoBtn.disabled = true;
        autoBtn.textContent = "⏳ 영문 기반 번역·키워드 생성 중...";
      }

      let failedTranslate = false;
      try {
        const starSel = document.getElementById("editStars");
        if (starSel) {
          item.stars = Math.max(0, Math.min(5, Number(starSel.value) || 0));
        }
        if (state.popup.part === "Q") {
          const enVal = (document.getElementById("editQEn").value || "").replace(/\s+/g, " ").trim();
          if (!enVal) {
            showToast("영문 질문을 먼저 입력해주세요.");
            return;
          }
          const tempItem = { ...item, qEn: enVal };
          document.getElementById("editQKeywords").value = buildUpdatedQKeywords(tempItem, defItem);
          try {
            const ko = await translateEnToKo(enVal);
            if (ko) document.getElementById("editQKo").value = ko;
          } catch {
            failedTranslate = true;
          }
        } else {
          const plainInputs = item.aSections.map((_, i) =>
            (document.getElementById(`editASecEn_${i}`).value || "").replace(/\s+/g, " ").trim()
          );
          const tempItem = {
            ...item,
            aSections: item.aSections.map((sec, i) => ({
              ...sec,
              enHtml: escapeHtml(plainInputs[i] || stripHtmlToPlain(sec.enHtml))
            }))
          };
          document.getElementById("editAKeywords").value = buildUpdatedAKeywords(tempItem, defItem);

          const anyChanged = plainInputs.some((p, i) => p && p !== stripHtmlToPlain(defItem.aSections[i].enHtml));
          for (let i = 0; i < item.aSections.length; i++) {
            const p = plainInputs[i];
            if (!p) continue;
            const isChangedFromDef = p !== stripHtmlToPlain(defItem.aSections[i].enHtml);
            if (anyChanged && !isChangedFromDef) continue;
            try {
              const ko = await translateEnToKo(p);
              if (ko) document.getElementById(`editASecKo_${i}`).value = ko;
            } catch {
              failedTranslate = true;
            }
          }
        }
        showToast(failedTranslate ? "키워드 생성 완료 (번역은 인터넷 연결 필요)" : "번역과 키워드를 자동 생성했습니다.");
      } finally {
        if (autoBtn) {
          autoBtn.disabled = false;
          autoBtn.textContent = "🪄 영문 기준 번역·키워드 자동생성";
        }
      }
    }

    async function savePopupEdits() {
      const item = OPIC_DATA.find(x => x.id === state.popup.itemId);
      const defItem = DEFAULT_OPIC_DATA.find(x => x.id === state.popup.itemId);
      if (!item || !defItem) return;

      const saveBtn = document.getElementById("btnSaveEdit");
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "⏳ 번역·저장 중...";
      }

      const prevPatch = state.edits[String(item.id)] || {};
      const nextPatchFlags = {
        kwSynced: true,
        qKoSynced: Boolean(prevPatch.qKoSynced),
        aKoSynced_0: Boolean(prevPatch.aKoSynced_0),
        aKoSynced_1: Boolean(prevPatch.aKoSynced_1),
        aKoSynced_2: Boolean(prevPatch.aKoSynced_2)
      };

      try {
        const starSel = document.getElementById("editStars");
        if (starSel) {
          item.stars = Math.max(0, Math.min(5, Number(starSel.value) || 0));
        }
        if (state.popup.part === "Q") {
          const prevQEn = (item.qEn || "").replace(/\s+/g, " ").trim();
          const prevQKo = (item.qKo || "").trim();
          const prevQKw = (item.qKeywords || "").trim();

          const kw = (document.getElementById("editQKeywords").value || "").trim();
          const en = (document.getElementById("editQEn").value || "").replace(/\s+/g, " ").trim();
          let ko = (document.getElementById("editQKo").value || "").trim();
          if (!en) {
            showToast("영문 질문을 입력해주세요.");
            return;
          }

          const enChanged = en !== prevQEn;
          item.qEn = en;
          if (enChanged && kw === prevQKw) {
            item.qKeywords = buildUpdatedQKeywords(item, defItem);
          } else {
            item.qKeywords = kw || item.qKeywords;
          }

          if (enChanged && ko === prevQKo) {
            try {
              const translated = await translateEnToKo(en);
              if (translated) {
                ko = translated;
                nextPatchFlags.qKoSynced = true;
              }
            } catch {
              nextPatchFlags.qKoSynced = false;
            }
          } else if (ko !== prevQKo) {
            nextPatchFlags.qKoSynced = true;
          }
          item.qKo = ko;
        } else {
          const prevAKw = (item.aKeywords || "").trim();
          const kwInput = (document.getElementById("editAKeywords").value || "").trim();

          const oldPlains = item.aSections.map(s => stripHtmlToPlain(s.enHtml));
          const oldKos = item.aSections.map(s => (s.ko || "").trim());
          let anyEnChanged = false;
          const plainParts = [];

          for (let i = 0; i < item.aSections.length; i++) {
            const sec = item.aSections[i];
            const newPlain = (document.getElementById(`editASecEn_${i}`).value || "").replace(/\s+/g, " ").trim();
            let newKo = (document.getElementById(`editASecKo_${i}`).value || "").trim();
            const oldPlain = oldPlains[i];
            const enChanged = Boolean(newPlain && newPlain !== oldPlain);

            if (enChanged) {
              anyEnChanged = true;
              sec.enHtml = escapeHtml(newPlain);
              if (newKo === oldKos[i] || !newKo) {
                try {
                  const translated = await translateEnToKo(newPlain);
                  if (translated) {
                    newKo = translated;
                    nextPatchFlags[`aKoSynced_${i}`] = true;
                  }
                } catch {
                  nextPatchFlags[`aKoSynced_${i}`] = false;
                }
              } else {
                nextPatchFlags[`aKoSynced_${i}`] = true;
              }
            } else if (newKo !== oldKos[i]) {
              nextPatchFlags[`aKoSynced_${i}`] = true;
            }

            plainParts.push(newPlain || oldPlain);
            sec.ko = newKo;
          }

          item.aEnPlain = plainParts.join(" ").trim();
          if (anyEnChanged && kwInput === prevAKw) {
            item.aKeywords = buildUpdatedAKeywords(item, defItem);
          } else {
            item.aKeywords = kwInput || item.aKeywords;
          }
        }

        state.edits[String(item.id)] = {
          stars: item.stars,
          qKeywords: item.qKeywords,
          qEn: item.qEn,
          qKo: item.qKo,
          aKeywords: item.aKeywords,
          aSections: item.aSections.map(s => ({ enHtml: s.enHtml, ko: s.ko })),
          aEnPlain: item.aEnPlain,
          ...nextPatchFlags
        };
        saveEdits();
        state.popup.isEditing = false;
        renderStarFilters();
        renderCards();
        renderScriptPopup();
        updatePlaybackUI();
        showToast("수정 내용·번역·키워드가 저장되었습니다.");
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = "💾 저장";
        }
      }
    }

    async function syncExistingUserEdits() {
      const entries = Object.entries(state.edits || {});
      if (!entries.length) return 0;

      let updatedCount = 0;
      let storeChanged = false;

      for (const [idStr, patch] of entries) {
        const item = OPIC_DATA.find(x => x.id === Number(idStr));
        const defItem = DEFAULT_OPIC_DATA.find(x => x.id === Number(idStr));
        if (!item || !defItem) continue;

        let itemUpdated = false;

        // 1) Question check
        const curQ = (item.qEn || "").replace(/\s+/g, " ").trim();
        const defQ = (defItem.qEn || "").replace(/\s+/g, " ").trim();
        if (curQ !== defQ) {
          if (!patch.kwSynced && item.qKeywords === defItem.qKeywords) {
            item.qKeywords = buildUpdatedQKeywords(item, defItem);
            itemUpdated = true;
          }
          if (!patch.qKoSynced && (item.qKo === defItem.qKo || !item.qKo.trim())) {
            try {
              const ko = await translateEnToKo(curQ);
              if (ko) {
                item.qKo = ko;
                patch.qKoSynced = true;
                itemUpdated = true;
              }
            } catch {}
          }
        }

        // 2) Answer check
        let anySecChanged = false;
        for (let i = 0; i < item.aSections.length; i++) {
          const curPlain = stripHtmlToPlain(item.aSections[i].enHtml);
          const defPlain = stripHtmlToPlain(defItem.aSections[i].enHtml);
          if (curPlain !== defPlain) {
            anySecChanged = true;
            const flag = `aKoSynced_${i}`;
            if (!patch[flag] && (item.aSections[i].ko === defItem.aSections[i].ko || !item.aSections[i].ko.trim())) {
              try {
                const ko = await translateEnToKo(curPlain);
                if (ko) {
                  item.aSections[i].ko = ko;
                  patch[flag] = true;
                  itemUpdated = true;
                }
              } catch {}
            }
          }
        }

        if (anySecChanged && !patch.kwSynced && item.aKeywords === defItem.aKeywords) {
          item.aKeywords = buildUpdatedAKeywords(item, defItem);
          itemUpdated = true;
        }

        if (!patch.kwSynced) {
          patch.kwSynced = true;
          storeChanged = true;
        }

        if (itemUpdated) {
          updatedCount += 1;
          storeChanged = true;
          state.edits[idStr] = {
            ...patch,
            qKeywords: item.qKeywords,
            qEn: item.qEn,
            qKo: item.qKo,
            aKeywords: item.aKeywords,
            aSections: item.aSections.map(s => ({ enHtml: s.enHtml, ko: s.ko })),
            aEnPlain: item.aEnPlain,
            kwSynced: true
          };
        }
      }

      if (storeChanged) {
        saveEdits();
      }
      if (updatedCount > 0) {
        renderCards();
        if (state.popup.isOpen && !state.popup.isEditing) {
          renderScriptPopup();
        }
        updatePlaybackUI();
        showToast(`수정된 스크립트 ${updatedCount}개의 번역·키워드를 자동 반영했습니다.`);
      }
      return updatedCount;
    }
