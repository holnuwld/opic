    // --- Web Speech API Voices (Female Preferred) ---
    function scoreVoice(v) {
      const lang = (v.lang || "").toLowerCase();
      const name = (v.name || "").toLowerCase();
      let score = 0;
      if (lang === "en-us" || lang === "en_us") score += 100;
      else if (lang.startsWith("en-")) score += 40;
      else return -1;

      const maleKeywords = [
        /\bmale\b/, /\bdavid\b/, /\bmark\b/, /\bguy\b/, /\bandrew\b/,
        /\bbrian\b/, /\bchristopher\b/, /\beric\b/, /\broger\b/, /\bsteffan\b/,
        /\bdaniel\b/, /\balex\b/, /\bfred\b/, /\bjames\b/, /\brichard\b/,
        /\bgeorge\b/, /\bpaul\b/, /\bryan\b/, /\bthomas\b/, /\boliver\b/,
        /\barthur\b/, /iom/, /tpd/, /sfb/
      ];
      for (const rx of maleKeywords) {
        if (rx.test(name)) {
          score -= 500;
          break;
        }
      }

      const femalePriorities = [
        ["female", 200],
        ["ava", 160],
        ["aria", 155],
        ["jenny", 150],
        ["zira", 148],
        ["samantha", 145],
        ["google us english", 140],
        ["tpf", 135],
        ["sfg", 135],
        ["iob", 135],
        ["victoria", 132],
        ["karen", 130],
        ["moira", 130],
        ["tessa", 130],
        ["allison", 130],
        ["susan", 130],
        ["siri", 130],
        ["nicky", 128],
        ["emma", 125],
        ["sonia", 125],
        ["libby", 125],
        ["natural", 30],
        ["enhanced", 25],
        ["premium", 22],
        ["online", 15]
      ];
      for (const [kw, pts] of femalePriorities) {
        if (name.includes(kw)) score += pts;
      }
      if (v.localService) score += 4;
      return score;
    }

    function loadVoices() {
      const sel = document.getElementById("voiceSelect");
      if (!("speechSynthesis" in window)) {
        if (sel) sel.innerHTML = `<option value="">TTS 미지원</option>`;
        return;
      }
      const all = window.speechSynthesis.getVoices() || [];
      const englishVoices = all
        .map(v => ({ voice: v, score: scoreVoice(v) }))
        .filter(x => x.score >= 0)
        .sort((a, b) => b.score - a.score)
        .map(x => x.voice);

      state.voices = englishVoices;
      if (!englishVoices.length) {
        if (sel) sel.innerHTML = `<option value="">여성 기본 (en-US)</option>`;
        return;
      }

      if (!state.prefs.voiceName || !englishVoices.some(v => v.name === state.prefs.voiceName)) {
        state.prefs.voiceName = englishVoices[0].name;
      }

      if (!sel) return;
      sel.innerHTML = englishVoices
        .map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`)
        .join("");
      sel.value = state.prefs.voiceName;
    }

    function getSelectedVoice() {
      if (!state.voices.length) return null;
      return state.voices.find(v => v.name === state.prefs.voiceName) || state.voices[0];
    }

    // --- TTS & Audio File Engine ---
    function sanitizeAudioFilename(name) {
      return String(name || "")
        .replace(/[\\/:*?"<>|]/g, "_")
        .trim()
        .replace(/\s+/g, "_");
    }

    function getTtsAudioUrl(itemId, part) {
      const defItem = DEFAULT_OPIC_DATA.find(x => x.id === itemId);
      if (!defItem) return null;

      const numStr = String(defItem.id).padStart(2, "0");
      const safeTitle = sanitizeAudioFilename(defItem.title);
      if (part === "A" && state.prefs.level === "im3") {
        return `tts/im3/${encodeURIComponent(`${numStr}_A_${safeTitle}.mp3`)}`;
      }
      const fileName = part === "Q" ? `${numStr}_Q_${safeTitle}.mp3` : `${numStr}_${safeTitle}.mp3`;
      return `tts/${encodeURIComponent(fileName)}`;
    }

    function clearDelayTimer() {
      if (state.playback.delayTimer) {
        clearTimeout(state.playback.delayTimer);
        state.playback.delayTimer = null;
      }
      if (state.playback.chimeTimer) {
        clearTimeout(state.playback.chimeTimer);
        state.playback.chimeTimer = null;
      }
      if (state.playback.rafId && typeof cancelAnimationFrame === "function") {
        cancelAnimationFrame(state.playback.rafId);
        state.playback.rafId = null;
      }
    }

    function stopAudioElement(resetSrc = true) {
      if (!audioPlayer) return;
      audioPlayer.onloadedmetadata = null;
      audioPlayer.ontimeupdate = null;
      audioPlayer.onended = null;
      audioPlayer.onerror = null;
      try {
        audioPlayer.pause();
      } catch {}
      if (resetSrc) {
        try {
          audioPlayer.currentTime = 0;
        } catch {}
        try {
          audioPlayer.removeAttribute("src");
          audioPlayer.load();
        } catch {}
      }
    }

    function stopPlayback(silent = false) {
      clearDelayTimer();
      state.playback.sessionToken += 1;
      state.playback.active = false;
      state.playback.paused = false;
      state.playback.usingAudioFile = false;
      state.playback.stopAfterSentIdx = null;
      state.playback.pausedFromSingleTap = false;
      state.playback.advanceOnResume = false;
      state.playback.queue = [];
      state.playback.queueIndex = 0;
      state.playback.sentIndex = 0;
      window._activeUtterance = null;
      stopAudioElement(true);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch {}
      }
      releaseWakeLock();
      updatePlaybackUI();
      if (!silent) {
        document.getElementById("playerNow").textContent = "대기 중";
      }
    }

    function startQueue(queue, scope, initialSentIdx = 0) {
      const hasWebTts = "speechSynthesis" in window;
      if (state.prefs.audioSource === "web" && !hasWebTts) {
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }
      if (!audioPlayer && !hasWebTts) {
        showToast("오디오 재생이 지원되지 않는 브라우저입니다.");
        return;
      }
      if (!queue.length) {
        showToast("재생할 문항이 없습니다.");
        return;
      }

      const wasActive = state.playback.active;
      const webSpeaking = hasWebTts && (window.speechSynthesis.speaking || window.speechSynthesis.pending);
      clearDelayTimer();
      unlockAudioContext();
      state.playback.sessionToken += 1;
      const myToken = state.playback.sessionToken;

      state.playback.active = true;
      state.playback.paused = false;
      state.playback.scope = scope;
      state.playback.stopAfterSentIdx = null;
      state.playback.pausedFromSingleTap = false;
      state.playback.advanceOnResume = false;
      state.playback.queue = queue;
      state.playback.queueIndex = 0;
      state.playback.sentIndex = initialSentIdx;

      stopAudioElement(true);
      if (webSpeaking || (wasActive && state.prefs.audioSource === "web")) {
        if (hasWebTts) {
          try { window.speechSynthesis.cancel(); } catch {}
        }
        state.playback.delayTimer = setTimeout(() => {
          if (state.playback.sessionToken === myToken) {
            playCurrentBlock(myToken);
          }
        }, 50);
      } else {
        // Trigger synchronously inside user gesture for mobile audio unlock
        playCurrentBlock(myToken);
      }

      acquireWakeLock();
      syncPopupWithPlayback();
      updatePlaybackUI();
      scrollToActiveBlock();
    }

    function syncPopupWithPlayback() {
      const pb = state.playback;
      if (!pb.active || (pb.scope !== "tab" && pb.scope !== "random")) return;
      if (state.popup.isEditing) return;
      const block = pb.queue[pb.queueIndex];
      if (!block) return;
      if (!state.popup.isOpen || state.popup.itemId !== block.itemId || state.popup.part !== block.part) {
        openScriptPopup(block.itemId, block.part, { isEditing: false });
      }
    }

    function buildCumEndRatios(sentences) {
      const lengths = sentences.map(s => Math.max(1, s.length));
      const totalLen = lengths.reduce((a, b) => a + b, 0) || 1;
      const cumEndRatios = [];
      let acc = 0;
      for (const len of lengths) {
        acc += len;
        cumEndRatios.push(acc / totalLen);
      }
      return cumEndRatios;
    }

    function getExactTimingsForBlock(block) {
      if (!block) return null;
      const isIm3A = block.part === "A" && state.prefs.level === "im3";
      if (isIm3A) {
        const im3 = IM3_DATA_MAP[block.itemId];
        const defIm3 = DEFAULT_IM3_MAP[block.itemId];
        if (im3 && defIm3) {
          const curText = (im3.aEnPlain || "").replace(/\s+/g, " ").trim();
          const defText = (defIm3.aEnPlain || "").replace(/\s+/g, " ").trim();
          if (curText !== defText) return null;
        }
        const timings = IM3_TIMINGS[`${block.itemId}_A`];
        if (!Array.isArray(timings) || timings.length !== block.sentences.length) return null;
        return timings;
      }
      const item = OPIC_DATA.find(x => x.id === block.itemId);
      const defItem = DEFAULT_OPIC_DATA.find(x => x.id === block.itemId);
      if (item && defItem) {
        const curText = (block.part === "Q" ? item.qEn : item.aEnPlain || "").replace(/\s+/g, " ").trim();
        const defText = (block.part === "Q" ? defItem.qEn : defItem.aEnPlain || "").replace(/\s+/g, " ").trim();
        if (curText !== defText) return null;
      }
      const key = `${block.itemId}_${block.part}`;
      const timings = SENTENCE_TIMINGS[key];
      if (!Array.isArray(timings) || timings.length !== block.sentences.length) return null;
      return timings;
    }

    function getSentenceStartSec(block, sidx, duration) {
      if (!block || sidx <= 0) return 0;
      const clampedIdx = Math.max(0, Math.min(sidx, block.sentences.length - 1));
      const exact = getExactTimingsForBlock(block);
      if (exact && typeof exact[clampedIdx] === "number") {
        return Math.max(0, exact[clampedIdx] - 0.05);
      }
      if (!duration || !isFinite(duration) || duration <= 0) return 0;
      const ratios = buildCumEndRatios(block.sentences);
      const prevEnd = clampedIdx > 0 ? ratios[clampedIdx - 1] : 0;
      return Math.max(0, Math.min(duration - 0.1, prevEnd * duration));
    }

    function getSentenceEndSec(block, sidx, duration) {
      if (!block || sidx < 0 || sidx + 1 >= block.sentences.length) return null;
      const exact = getExactTimingsForBlock(block);
      if (exact && typeof exact[sidx + 1] === "number") {
        const startCur = typeof exact[sidx] === "number" ? exact[sidx] : 0;
        return Math.max(startCur + 0.15, exact[sidx + 1] - 0.06);
      }
      if (!duration || !isFinite(duration) || duration <= 0) return null;
      const ratios = buildCumEndRatios(block.sentences);
      return Math.max(0.1, Math.min(duration - 0.05, ratios[sidx] * duration));
    }

    function finishSingleTappedSentence(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.sessionToken !== myToken) return;
      clearDelayTimer();
      pb.sessionToken += 1;
      pb.paused = true;
      pb.pausedFromSingleTap = true;
      const stoppedIdx = pb.stopAfterSentIdx;
      pb.stopAfterSentIdx = null;

      if (pb.usingAudioFile && audioPlayer) {
        try { audioPlayer.pause(); } catch {}
      } else if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }

      const block = pb.queue[pb.queueIndex];
      if (block && typeof stoppedIdx === "number") {
        if (stoppedIdx + 1 < block.sentences.length) {
          pb.sentIndex = stoppedIdx + 1;
          pb.advanceOnResume = false;
          if (pb.usingAudioFile && audioPlayer && audioPlayer.readyState >= 1) {
            const nextSec = getSentenceStartSec(block, pb.sentIndex, audioPlayer.duration);
            try { audioPlayer.currentTime = nextSec; } catch {}
          }
        } else if (pb.queueIndex + 1 < pb.queue.length) {
          pb.sentIndex = stoppedIdx;
          pb.advanceOnResume = true;
        } else {
          pb.sentIndex = 0;
          pb.advanceOnResume = false;
          if (pb.usingAudioFile && audioPlayer && audioPlayer.readyState >= 1) {
            try { audioPlayer.currentTime = 0; } catch {}
          }
        }
      }

      releaseWakeLock();
      updatePlaybackUI();
    }

    function bindFileAudioTracking(block, myToken, initialSeekIdx = 0) {
      const pb = state.playback;
      const exact = getExactTimingsForBlock(block);
      const cumEndRatios = exact ? null : buildCumEndRatios(block.sentences);
      let pendingSeekIdx = initialSeekIdx > 0
        ? Math.min(initialSeekIdx, Math.max(0, block.sentences.length - 1))
        : -1;

      const fallbackToWebTts = () => {
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        pb.usingAudioFile = false;
        stopAudioElement(true);
        if ("speechSynthesis" in window) {
          speakCurrentSentence(myToken);
        } else {
          advanceToNextBlock(myToken);
        }
      };

      const applyPendingSeek = () => {
        if (pendingSeekIdx < 0) return;
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        if (audioPlayer.readyState < 1) return;
        const targetSec = getSentenceStartSec(block, pendingSeekIdx, audioPlayer.duration);
        pendingSeekIdx = -1;
        try {
          audioPlayer.currentTime = targetSec;
        } catch {}
      };

      const checkStopBoundary = () => {
        if (state.playback.sessionToken !== myToken || state.playback.paused) return false;
        if (pendingSeekIdx >= 0 || audioPlayer.seeking) return false;
        if (typeof pb.stopAfterSentIdx === "number") {
          const stopSec = getSentenceEndSec(block, pb.stopAfterSentIdx, audioPlayer.duration);
          if (stopSec !== null && audioPlayer.currentTime >= stopSec) {
            finishSingleTappedSentence(myToken);
            return true;
          }
        }
        return false;
      };

      if (pb.rafId && typeof cancelAnimationFrame === "function") {
        cancelAnimationFrame(pb.rafId);
        pb.rafId = null;
      }

      if (typeof pb.stopAfterSentIdx === "number" && typeof window.requestAnimationFrame === "function") {
        const tickStopMonitor = () => {
          pb.rafId = null;
          if (state.playback.sessionToken !== myToken || state.playback.paused || typeof pb.stopAfterSentIdx !== "number") {
            return;
          }
          if (checkStopBoundary()) return;
          pb.rafId = window.requestAnimationFrame(tickStopMonitor);
        };
        pb.rafId = window.requestAnimationFrame(tickStopMonitor);
      }

      audioPlayer.onloadedmetadata = applyPendingSeek;

      audioPlayer.ontimeupdate = () => {
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        if (pendingSeekIdx >= 0) {
          if (audioPlayer.readyState >= 1) applyPendingSeek();
          return;
        }
        if (audioPlayer.seeking) return;

        if (checkStopBoundary()) return;

        if (typeof pb.stopAfterSentIdx === "number") {
          if (pb.sentIndex !== pb.stopAfterSentIdx) {
            pb.sentIndex = pb.stopAfterSentIdx;
            updatePlaybackUI();
          }
          return;
        }

        let nextIdx = pb.sentIndex;
        if (exact) {
          const curT = audioPlayer.currentTime + 0.08;
          nextIdx = 0;
          for (let i = 0; i < exact.length; i++) {
            if (curT >= exact[i]) nextIdx = i;
            else break;
          }
        } else {
          if (!audioPlayer.duration || !isFinite(audioPlayer.duration) || audioPlayer.duration <= 0) return;
          const progress = audioPlayer.currentTime / audioPlayer.duration;
          nextIdx = cumEndRatios.length - 1;
          for (let i = 0; i < cumEndRatios.length; i++) {
            if (progress < cumEndRatios[i]) {
              nextIdx = i;
              break;
            }
          }
        }
        if (nextIdx !== pb.sentIndex) {
          pb.sentIndex = nextIdx;
          updatePlaybackUI();
        }
      };

      audioPlayer.onended = () => {
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        if (typeof pb.stopAfterSentIdx === "number") {
          finishSingleTappedSentence(myToken);
          return;
        }
        pb.sentIndex = Math.max(0, block.sentences.length - 1);
        advanceToNextBlock(myToken);
      };

      audioPlayer.onerror = () => {
        fallbackToWebTts();
      };

      return { fallbackToWebTts, applyPendingSeek };
    }

    function playCurrentBlock(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;

      const block = pb.queue[pb.queueIndex];
      if (!block) {
        stopPlayback();
        return;
      }

      const audioUrl =
        state.prefs.audioSource === "file" && pb.scope !== "sentence"
          ? getTtsAudioUrl(block.itemId, block.part)
          : null;

      if (audioUrl && audioPlayer) {
        pb.usingAudioFile = true;
        if ("speechSynthesis" in window) {
          try { window.speechSynthesis.cancel(); } catch {}
        }
        const initialSeekIdx = Math.max(0, Math.min(pb.sentIndex || 0, Math.max(0, block.sentences.length - 1)));
        pb.sentIndex = initialSeekIdx;
        stopAudioElement(false);

        const { fallbackToWebTts, applyPendingSeek } = bindFileAudioTracking(block, myToken, initialSeekIdx);

        audioPlayer.src = audioUrl;
        audioPlayer.playbackRate = state.prefs.rate;
        if (initialSeekIdx === 0) {
          try {
            audioPlayer.currentTime = 0;
          } catch {}
        } else if (audioPlayer.readyState >= 1) {
          applyPendingSeek();
        }
        updatePlaybackUI();

        const playPromise = audioPlayer.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {
            fallbackToWebTts();
          });
        }
        return;
      }

      pb.usingAudioFile = false;
      speakCurrentSentence(myToken);
    }

    function speakCurrentSentence(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;
      if (!("speechSynthesis" in window)) {
        stopPlayback();
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }

      const block = pb.queue[pb.queueIndex];
      if (!block) {
        stopPlayback();
        return;
      }
      const text = block.sentences[pb.sentIndex];
      if (!text) {
        advanceToNextBlock(myToken);
        return;
      }

      const utt = new SpeechSynthesisUtterance(text);
      window._activeUtterance = utt; // Prevent GC on mobile browsers

      const voice = getSelectedVoice();
      if (voice) {
        utt.voice = voice;
        utt.lang = voice.lang;
      } else {
        utt.lang = "en-US";
      }
      utt.rate = state.prefs.rate;
      utt.pitch = block.part === "Q" ? 1.05 : 1.08;

      utt.onend = () => {
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        advanceSentence(myToken);
      };

      utt.onerror = (ev) => {
        if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
        if (state.playback.sessionToken !== myToken || state.playback.paused) return;
        advanceSentence(myToken);
      };

      updatePlaybackUI();
      try {
        window.speechSynthesis.speak(utt);
      } catch {
        stopPlayback();
        showToast("음성 재생 중 오류가 발생했습니다.");
      }
    }

    function advanceSentence(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;
      if (typeof pb.stopAfterSentIdx === "number") {
        finishSingleTappedSentence(myToken);
        return;
      }
      const block = pb.queue[pb.queueIndex];
      if (!block) {
        stopPlayback();
        return;
      }

      if (pb.sentIndex + 1 < block.sentences.length) {
        pb.sentIndex += 1;
        speakCurrentSentence(myToken);
        return;
      }

      advanceToNextBlock(myToken);
    }

    function findItemStartQueueIndex(itemId) {
      const pb = state.playback;
      for (let i = 0; i < pb.queue.length; i++) {
        if (pb.queue[i].itemId === itemId) return i;
      }
      return 0;
    }

    function advanceToNextBlock(myToken) {
      const pb = state.playback;
      if (!pb.active || pb.paused || pb.sessionToken !== myToken) return;

      const curBlock = pb.queue[pb.queueIndex];
      const nextIdx = pb.queueIndex + 1;
      const nextBlock = pb.queue[nextIdx];

      // Handle 1-item repeat
      if (pb.repeatOne && pb.scope !== "sentence") {
        const sameItemNext = nextBlock && curBlock && nextBlock.itemId === curBlock.itemId;
        if (!sameItemNext) {
          pb.queueIndex = findItemStartQueueIndex(curBlock.itemId);
          pb.sentIndex = 0;
          document.getElementById("playerNow").textContent = "🔁 현재 문항 반복...";
          pb.delayTimer = setTimeout(() => {
            if (pb.sessionToken === myToken && !pb.paused) {
              syncPopupWithPlayback();
              scrollToActiveBlock();
              playCurrentBlock(myToken);
            }
          }, 700);
          return;
        }
      }

      if (nextIdx >= pb.queue.length) {
        stopPlayback();
        showToast("재생이 완료되었습니다.");
        return;
      }

      const sameItem = curBlock && nextBlock.itemId === curBlock.itemId;
      const shouldChime = !sameItem && (pb.scope === "tab" || pb.scope === "random");
      const pauseMs = sameItem ? 600 : (shouldChime ? 1050 : 800);
      pb.queueIndex = nextIdx;
      pb.sentIndex = 0;

      syncPopupWithPlayback();
      updatePlaybackUI();
      document.getElementById("playerNow").textContent = sameItem
        ? "잠시 후 답변..."
        : "다음 문항 이동...";
      scrollToActiveBlock();

      if (shouldChime) {
        pb.chimeTimer = setTimeout(() => {
          if (state.playback.sessionToken === myToken && !state.playback.paused) {
            playTransitionChime();
          }
        }, 160);
      }

      pb.delayTimer = setTimeout(() => {
        if (pb.sessionToken === myToken && !pb.paused) {
          playCurrentBlock(myToken);
        }
      }, pauseMs);
    }

    function pausePlayback() {
      if (!state.playback.active || state.playback.paused) return;
      clearDelayTimer();
      state.playback.sessionToken += 1;
      state.playback.paused = true;
      state.playback.stopAfterSentIdx = null;
      state.playback.pausedFromSingleTap = false;
      if (state.playback.usingAudioFile && audioPlayer) {
        try { audioPlayer.pause(); } catch {}
      } else if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      releaseWakeLock();
      updatePlaybackUI();
    }

    function resumePlayback() {
      const pb = state.playback;
      if (!pb.active || !pb.paused) return;
      unlockAudioContext();
      const wasSingleTapPause = pb.pausedFromSingleTap;
      pb.paused = false;
      pb.pausedFromSingleTap = false;
      pb.stopAfterSentIdx = null;
      const myToken = ++pb.sessionToken;
      acquireWakeLock();

      if (pb.advanceOnResume) {
        pb.advanceOnResume = false;
        advanceToNextBlock(myToken);
        return;
      }

      updatePlaybackUI();

      if (pb.usingAudioFile && state.prefs.audioSource === "file" && audioPlayer && audioPlayer.src && audioPlayer.readyState >= 1) {
        const block = pb.queue[pb.queueIndex];
        if (wasSingleTapPause && block) {
          const targetSec = getSentenceStartSec(block, pb.sentIndex, audioPlayer.duration);
          try {
            audioPlayer.currentTime = targetSec;
          } catch {}
        }
        if (block) {
          bindFileAudioTracking(block, myToken, 0);
        }
        audioPlayer.playbackRate = state.prefs.rate;
        const p = audioPlayer.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => playCurrentBlock(myToken));
        }
        return;
      }

      playCurrentBlock(myToken);
    }

    function jumpQueueItem(direction) {
      const pb = state.playback;
      if (!pb.active || !pb.queue.length) return;
      const curItemId = pb.queue[pb.queueIndex]?.itemId;

      let targetIdx = pb.queueIndex + direction;
      if (direction > 0) {
        while (targetIdx < pb.queue.length && pb.queue[targetIdx].itemId === curItemId) {
          targetIdx++;
        }
        if (targetIdx >= pb.queue.length) targetIdx = 0;
      } else {
        // Move to start of current item if mid-item, else start of previous item
        const curStart = findItemStartQueueIndex(curItemId);
        if (pb.queueIndex > curStart || pb.sentIndex > 0) {
          targetIdx = curStart;
        } else {
          let prevEnd = curStart - 1;
          if (prevEnd < 0) prevEnd = pb.queue.length - 1;
          targetIdx = findItemStartQueueIndex(pb.queue[prevEnd].itemId);
        }
      }

      clearDelayTimer();
      pb.sessionToken += 1;
      const myToken = pb.sessionToken;
      pb.queueIndex = targetIdx;
      pb.sentIndex = 0;
      pb.paused = false;
      pb.stopAfterSentIdx = null;
      pb.pausedFromSingleTap = false;
      pb.advanceOnResume = false;
      stopAudioElement(true);
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      acquireWakeLock();
      syncPopupWithPlayback();
      updatePlaybackUI();
      scrollToActiveBlock();
      if (state.prefs.audioSource === "file") {
        playCurrentBlock(myToken);
      } else {
        pb.delayTimer = setTimeout(() => {
          if (pb.sessionToken === myToken) playCurrentBlock(myToken);
        }, 60);
      }
    }

    function playSinglePart(itemId, part) {
      const pb = state.playback;
      const cur = pb.queue[pb.queueIndex];
      if (pb.active && !pb.paused && pb.stopAfterSentIdx === null && pb.scope === "single" && cur && cur.itemId === itemId && cur.part === part) {
        stopPlayback();
        return;
      }
      const baseItem = OPIC_DATA.find(x => x.id === itemId);
      const item = getEffectiveItem(baseItem);
      if (!item) return;
      const text = part === "Q" ? item.qEn : item.aEnPlain;
      startQueue([{ itemId, part, sentences: splitSentences(text) }], "single", 0);
    }

    function buildQueueFromItems(items) {
      const queue = [];
      for (const baseItem of items) {
        const item = getEffectiveItem(baseItem);
        if (state.prefs.playMode === "qa" || state.prefs.playMode === "q") {
          queue.push({ itemId: item.id, part: "Q", sentences: splitSentences(item.qEn) });
        }
        if (state.prefs.playMode === "qa" || state.prefs.playMode === "a") {
          queue.push({ itemId: item.id, part: "A", sentences: splitSentences(item.aEnPlain) });
        }
      }
      return queue;
    }

    function playTabAll() {
      const pb = state.playback;
      if (pb.active && !pb.paused && pb.stopAfterSentIdx === null && pb.scope === "tab") {
        stopPlayback();
        return;
      }
      const items = getItemsForTab(state.activeTab);
      if (!items.length) {
        showToast("현재 탭에 재생할 문항이 없습니다.");
        return;
      }
      startQueue(buildQueueFromItems(items), "tab", 0);
    }

    function playTabRandom() {
      const pb = state.playback;
      if (pb.active && !pb.paused && pb.stopAfterSentIdx === null && pb.scope === "random") {
        stopPlayback();
        return;
      }
      const items = getItemsForTab(state.activeTab);
      if (!items.length) {
        showToast("현재 탭에 재생할 문항이 없습니다.");
        return;
      }
      const shuffled = shuffleArray(items);
      startQueue(buildQueueFromItems(shuffled), "random", 0);
      showToast(`🔀 ${shuffled.length}개 문항 랜덤 재생 시작`);
    }

    function playSingleSentence(itemId, part, sidx) {
      const item = getEffectiveItem(OPIC_DATA.find(x => x.id === itemId));
      if (!item) return;
      const sentences = splitSentences(part === "Q" ? item.qEn : item.aEnPlain);
      if (!sentences[sidx]) return;
      // Play only that single sentence cleanly
      const pb = state.playback;
      const wasActive = pb.active;
      clearDelayTimer();
      pb.sessionToken += 1;
      const myToken = pb.sessionToken;
      pb.active = true;
      pb.paused = false;
      pb.usingAudioFile = false;
      pb.scope = "sentence";
      pb.queue = [{ itemId, part, sentences: [sentences[sidx]], displaySentIdx: sidx }];
      pb.queueIndex = 0;
      pb.sentIndex = 0;

      stopAudioElement(true);
      if ("speechSynthesis" in window && (wasActive || window.speechSynthesis.speaking)) {
        window.speechSynthesis.cancel();
        pb.delayTimer = setTimeout(() => {
          if (pb.sessionToken === myToken) speakCurrentSentence(myToken);
        }, 50);
      } else {
        speakCurrentSentence(myToken);
      }
      updatePlaybackUI();
    }

    function playFromPopupSentence(itemId, part, sidx) {
      const item = getEffectiveItem(OPIC_DATA.find(x => x.id === itemId));
      if (!item) return;
      const sentences = splitSentences(part === "Q" ? item.qEn : item.aEnPlain);
      if (!sentences.length) return;
      const safeIdx = Math.max(0, Math.min(sidx, sentences.length - 1));

      const hasWebTts = "speechSynthesis" in window;
      const audioUrl = state.prefs.audioSource === "file" ? getTtsAudioUrl(itemId, part) : null;
      if (state.prefs.audioSource === "web" && !hasWebTts) {
        showToast("이 브라우저는 내장 음성(TTS)을 지원하지 않습니다.");
        return;
      }
      if (!audioPlayer && !hasWebTts) {
        showToast("오디오 재생이 지원되지 않는 브라우저입니다.");
        return;
      }

      const pb = state.playback;
      const cur = pb.queue[pb.queueIndex];
      const sameActiveBlock = Boolean(
        pb.active && pb.scope !== "sentence" && cur && cur.itemId === itemId && cur.part === part
      );

      clearDelayTimer();
      unlockAudioContext();
      pb.sessionToken += 1;
      const myToken = pb.sessionToken;

      if (!sameActiveBlock) {
        pb.active = true;
        pb.scope = "single";
        pb.queue = [{ itemId, part, sentences }];
        pb.queueIndex = 0;
      } else {
        cur.sentences = sentences;
      }

      pb.paused = false;
      pb.sentIndex = safeIdx;
      pb.stopAfterSentIdx = safeIdx;
      pb.pausedFromSingleTap = false;
      pb.advanceOnResume = false;

      if (sameActiveBlock && audioUrl && audioPlayer && pb.usingAudioFile && audioPlayer.src && audioPlayer.readyState >= 1) {
        const targetSec = getSentenceStartSec(cur, safeIdx, audioPlayer.duration);
        try {
          audioPlayer.currentTime = targetSec;
        } catch {}
        const { fallbackToWebTts } = bindFileAudioTracking(cur, myToken, 0);
        audioPlayer.playbackRate = state.prefs.rate;
        acquireWakeLock();
        updatePlaybackUI();
        const playPromise = audioPlayer.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => fallbackToWebTts());
        }
        return;
      }

      stopAudioElement(true);
      if (hasWebTts) {
        try { window.speechSynthesis.cancel(); } catch {}
      }
      acquireWakeLock();
      updatePlaybackUI();
      if (state.prefs.audioSource === "file" && audioUrl) {
        playCurrentBlock(myToken);
      } else {
        pb.delayTimer = setTimeout(() => {
          if (pb.sessionToken === myToken) playCurrentBlock(myToken);
        }, 50);
      }
    }

    function speakFillerPhrase(text) {
      if (!("speechSynthesis" in window)) return;
      stopPlayback(true);
      const utt = new SpeechSynthesisUtterance(text);
      window._activeUtterance = utt;
      const voice = getSelectedVoice();
      if (voice) {
        utt.voice = voice;
        utt.lang = voice.lang;
      } else {
        utt.lang = "en-US";
      }
      utt.rate = state.prefs.rate;
      utt.pitch = 1.06;
      window.speechSynthesis.speak(utt);
    }

    function scrollToActiveBlock() {
      const pb = state.playback;
      if (!pb.active) return;
      const block = pb.queue[pb.queueIndex];
      if (!block) return;
      const card = document.querySelector(`.q-card[data-id="${block.itemId}"]`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    // --- UI Updates ---
    function updatePlaybackUI() {
      const pb = state.playback;
      const curBlock = pb.active ? pb.queue[pb.queueIndex] : null;
      const curItem = curBlock ? OPIC_DATA.find(x => x.id === curBlock.itemId) : null;

      // Tab Play All & Random buttons
      const btnTab = document.getElementById("btnPlayTab");
      const btnRandom = document.getElementById("btnPlayRandom");
      const tabItems = getItemsForTab(state.activeTab);
      if (pb.active && !pb.paused && pb.stopAfterSentIdx === null && pb.scope === "tab") {
        btnTab.classList.add("is-playing");
        btnTab.textContent = `⏹ 전체 정지 (${tabItems.length})`;
      } else {

    async function translateEnToKo(text) {
      const cleaned = (text || "").replace(/\s+/g, " ").trim();
      if (!cleaned) return "";
      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 4500) : null;
      try {
        const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=" + encodeURIComponent(cleaned);
        const res = await fetch(url, controller ? { signal: controller.signal } : undefined);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!Array.isArray(data) || !Array.isArray(data[0])) throw new Error("Invalid translate response");
        return data[0].map(seg => (seg && seg[0]) ? seg[0] : "").join("").trim();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    function extractKeywordsFromEnglish(plainText, maxWords = 5) {
      let s = (plainText || "").replace(/\s+/g, " ").trim();
      if (!s) return "";

      const leadPatterns = [
        /^(?:well|so|yeah|okay|ok|oh|hi there|hello|hey|excuse me|actually|honestly|overall|all in all|looking back|meanwhile|however|therefore|basically|essentially|obviously|unfortunately|luckily|eventually|finally|in the end|to start|first of all|first|second|third|next|then|after that|as i mentioned|you know|i mean)\b[,:\s]*/i,
        /^(?:let me tell you about|i'd like to talk about|i would like to talk about|i'd like to tell you about|tell me about|can you tell me about|now,?\s*tell me about|could you describe for me|could you think about)\b[,:\s]*/i,
        /^(?:yes,?\s*i had this kind of (?:incident|experience)|the last time i|whenever i|when i)\b[,:\s]*/i
      ];
      for (let pass = 0; pass < 3; pass++) {
        let changed = false;
        for (const rx of leadPatterns) {
          const next = s.replace(rx, "").trim();
          if (next !== s && next.length > 0) {
            s = next;
            changed = true;
          }
        }
        if (!changed) break;
      }

      const firstSent = (s.split(/[.!?]+/)[0] || s).trim();
      const words = firstSent.replace(/[^A-Za-z0-9''\-\s]/g, " ").trim().split(/\s+/).filter(Boolean);
      const stopWords = new Set([
        "i", "me", "my", "mine", "myself", "we", "us", "our", "ours",
        "you", "your", "yours", "he", "him", "his", "she", "her", "hers",
        "it", "its", "they", "them", "their", "theirs",
        "a", "an", "the", "is", "am", "are", "was", "were", "be", "been", "being",
        "have", "has", "had", "do", "does", "did", "will", "would", "can", "could", "should",
        "to", "of", "in", "on", "at", "by", "for", "with", "from", "about", "as", "into",
        "that", "this", "these", "those", "there", "here", "which", "who", "whom", "whose",
        "and", "or", "but", "so", "if", "because", "while", "when", "where", "than",
        "very", "really", "just", "quite", "pretty", "actually", "basically", "some", "any", "such"
      ]);

      const content = words.filter(w => !stopWords.has(w.toLowerCase()));
      const picked = (content.length >= 2 ? content : words).slice(0, maxWords);
      if (!picked.length) return "";
      const joined = picked.join(" ");
      return joined.charAt(0).toUpperCase() + joined.slice(1);
    }

    function buildUpdatedAKeywords(item, defItem) {
      const defPlains = defItem && Array.isArray(defItem.aSections)
        ? defItem.aSections.map(s => stripHtmlToPlain(s.enHtml))
        : [];
      const curPlains = item.aSections.map(s => stripHtmlToPlain(s.enHtml));
      if (defItem && defPlains.length === curPlains.length && curPlains.every((p, i) => p === defPlains[i])) {
        return defItem.aKeywords;
      }

      const defBeats = ((defItem && defItem.aKeywords) || "").split("➔").map(s => s.trim());
      const sectionEmoji = ["🎬", "⚡", "✨"];
      const beats = [];
      item.aSections.forEach((sec, i) => {
        const curPlain = curPlains[i];
        const defBeat = defBeats[i] || "";
        const emojiMatch = defBeat.match(/^([^\x00-\x7F]+\s*)/);
        const prefix = emojiMatch ? emojiMatch[1] : `${sectionEmoji[i] || "📌"} `;
        const sents = splitSentences(curPlain);
        const picked = sents.slice(0, 2).map(s => extractKeywordsFromEnglish(s, 6)).filter(Boolean);
        if (picked.length) {
          picked.forEach((kw, j) => {
            beats.push(j === 0 ? `${prefix}${kw}` : kw);
          });
        } else if (defBeat) {
          beats.push(defBeat);
        } else {
          beats.push(`${prefix}${curPlain.slice(0, 32)}`);
        }
      });
      return beats.join(" ➔ ");
    }

    function buildUpdatedQKeywords(item, defItem) {
      const curQ = (item.qEn || "").replace(/\s+/g, " ").trim();
      const defQ = ((defItem && defItem.qEn) || "").replace(/\s+/g, " ").trim();
      if (defItem && curQ === defQ) return defItem.qKeywords;
      const sentences = splitSentences(curQ);
      const parts = sentences.slice(0, 3).map(s => extractKeywordsFromEnglish(s, 4)).filter(Boolean);
      return parts.length ? parts.join(" · ") : (defItem ? defItem.qKeywords : curQ.slice(0, 48));
    }

    async function autoGenerateEditFields() {
      const baseItem = OPIC_DATA.find(x => x.id === state.popup.itemId);
      const baseDef = DEFAULT_OPIC_DATA.find(x => x.id === state.popup.itemId);
      if (!baseItem || !baseDef) return;
      const isIm3A = state.popup.part === "A" && state.prefs.level === "im3" && IM3_DATA_MAP[baseItem.id];
      const item = isIm3A ? { ...baseItem, ...IM3_DATA_MAP[baseItem.id] } : baseItem;
      const defItem = isIm3A ? { ...baseDef, ...DEFAULT_IM3_MAP[baseItem.id] } : baseDef;

      const autoBtn = document.getElementById("btnAutoTranslateEdit");
      if (autoBtn) {
        autoBtn.disabled = true;
        autoBtn.textContent = "⏳ 영문 기반 번역·키워드 생성 중...";
      }

      let failedTranslate = false;
      try {
        const starSel = document.getElementById("editStars");
        if (starSel) {
          item.stars = Math.max(0, Math.min(5, Number(starSel.value) || 0));
        }
        if (state.popup.part === "Q") {
          const enVal = (document.getElementById("editQEn").value || "").replace(/\s+/g, " ").trim();
          if (!enVal) {
            showToast("영문 질문을 먼저 입력해주세요.");
            return;
          }
          const tempItem = { ...item, qEn: enVal };
          document.getElementById("editQKeywords").value = buildUpdatedQKeywords(tempItem, defItem);
          try {
            const ko = await translateEnToKo(enVal);
            if (ko) document.getElementById("editQKo").value = ko;
          } catch {
            failedTranslate = true;
          }
        } else {
          const plainInputs = item.aSections.map((_, i) =>
            (document.getElementById(`editASecEn_${i}`).value || "").replace(/\s+/g, " ").trim()
          );
          const tempItem = {
            ...item,
            aSections: item.aSections.map((sec, i) => ({
              ...sec,
              enHtml: escapeHtml(plainInputs[i] || stripHtmlToPlain(sec.enHtml))
            }))
          };
          document.getElementById("editAKeywords").value = buildUpdatedAKeywords(tempItem, defItem);

          const anyChanged = plainInputs.some((p, i) => p && p !== stripHtmlToPlain(defItem.aSections[i].enHtml));
          for (let i = 0; i < item.aSections.length; i++) {
            const p = plainInputs[i];
            if (!p) continue;
            const isChangedFromDef = p !== stripHtmlToPlain(defItem.aSections[i].enHtml);
            if (anyChanged && !isChangedFromDef) continue;
            try {
              const ko = await translateEnToKo(p);
              if (ko) document.getElementById(`editASecKo_${i}`).value = ko;
            } catch {
              failedTranslate = true;
            }
          }
        }
        showToast(failedTranslate ? "키워드 생성 완료 (번역은 인터넷 연결 필요)" : "번역과 키워드를 자동 생성했습니다.");
      } finally {
        if (autoBtn) {
          autoBtn.disabled = false;
          autoBtn.textContent = "🪄 영문 기준 번역·키워드 자동생성";
        }
      }
    }

    async function savePopupEdits() {
      const baseItem = OPIC_DATA.find(x => x.id === state.popup.itemId);
      const baseDef = DEFAULT_OPIC_DATA.find(x => x.id === state.popup.itemId);
      if (!baseItem || !baseDef) return;
      const isIm3A = state.popup.part === "A" && state.prefs.level === "im3" && IM3_DATA_MAP[baseItem.id];
      const item = isIm3A ? IM3_DATA_MAP[baseItem.id] : baseItem;
      const defItem = isIm3A ? DEFAULT_IM3_MAP[baseItem.id] : baseDef;

      const saveBtn = document.getElementById("btnSaveEdit");
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "⏳ 번역·저장 중...";
      }

      const prevPatch = (isIm3A ? state.im3Edits : state.edits)[String(baseItem.id)] || {};
      const nextPatchFlags = {
        kwSynced: true,
        qKoSynced: Boolean(prevPatch.qKoSynced),
        aKoSynced_0: Boolean(prevPatch.aKoSynced_0),
        aKoSynced_1: Boolean(prevPatch.aKoSynced_1),
        aKoSynced_2: Boolean(prevPatch.aKoSynced_2)
      };

      try {
        const starSel = document.getElementById("editStars");
        if (starSel) {
          baseItem.stars = Math.max(0, Math.min(5, Number(starSel.value) || 0));
        }
        if (state.popup.part === "Q") {
          const prevQEn = (baseItem.qEn || "").replace(/\s+/g, " ").trim();
          const prevQKo = (baseItem.qKo || "").trim();
          const prevQKw = (baseItem.qKeywords || "").trim();

          const kw = (document.getElementById("editQKeywords").value || "").trim();
          const en = (document.getElementById("editQEn").value || "").replace(/\s+/g, " ").trim();
          let ko = (document.getElementById("editQKo").value || "").trim();
          if (!en) {
            showToast("영문 질문을 입력해주세요.");
            return;
          }

          const enChanged = en !== prevQEn;
          baseItem.qEn = en;
          if (enChanged && kw === prevQKw) {
            baseItem.qKeywords = buildUpdatedQKeywords(baseItem, baseDef);
          } else {
            baseItem.qKeywords = kw || baseItem.qKeywords;
          }

          if (enChanged && ko === prevQKo) {
            try {
              const translated = await translateEnToKo(en);
              if (translated) {
                ko = translated;
                nextPatchFlags.qKoSynced = true;
              }
            } catch {
              nextPatchFlags.qKoSynced = false;
            }
          } else if (ko !== prevQKo) {
            nextPatchFlags.qKoSynced = true;
          }
          baseItem.qKo = ko;
        } else {
          const prevAKw = (item.aKeywords || "").trim();
          const kwInput = (document.getElementById("editAKeywords").value || "").trim();

          const oldPlains = item.aSections.map(s => stripHtmlToPlain(s.enHtml));
          const oldKos = item.aSections.map(s => (s.ko || "").trim());
          let anyEnChanged = false;
          const plainParts = [];

          for (let i = 0; i < item.aSections.length; i++) {
            const sec = item.aSections[i];
            const newPlain = (document.getElementById(`editASecEn_${i}`).value || "").replace(/\s+/g, " ").trim();
            let newKo = (document.getElementById(`editASecKo_${i}`).value || "").trim();
            const oldPlain = oldPlains[i];
            const enChanged = Boolean(newPlain && newPlain !== oldPlain);

            if (enChanged) {
              anyEnChanged = true;
              sec.enHtml = escapeHtml(newPlain);
              if (newKo === oldKos[i] || !newKo) {
                try {
                  const translated = await translateEnToKo(newPlain);
                  if (translated) {
                    newKo = translated;
                    nextPatchFlags[`aKoSynced_${i}`] = true;
                  }
                } catch {
                  nextPatchFlags[`aKoSynced_${i}`] = false;
                }
              } else {
                nextPatchFlags[`aKoSynced_${i}`] = true;
              }
            } else if (newKo !== oldKos[i]) {
              nextPatchFlags[`aKoSynced_${i}`] = true;
            }

            plainParts.push(newPlain || oldPlain);
            sec.ko = newKo;
          }

          item.aEnPlain = plainParts.join(" ").trim();
          if (anyEnChanged && kwInput === prevAKw) {
            item.aKeywords = buildUpdatedAKeywords(item, defItem);
          } else {
            item.aKeywords = kwInput || item.aKeywords;
          }
        }

        if (isIm3A) {
          state.im3Edits[String(baseItem.id)] = {
            aKeywords: item.aKeywords,
            aSections: item.aSections.map(s => ({ enHtml: s.enHtml, ko: s.ko })),
            aEnPlain: item.aEnPlain,
            ...nextPatchFlags
          };
          saveIm3Edits();
        }
        state.edits[String(baseItem.id)] = {
          ...(state.edits[String(baseItem.id)] || {}),
          stars: baseItem.stars,
          qKeywords: baseItem.qKeywords,
          qEn: baseItem.qEn,
          qKo: baseItem.qKo,
          aKeywords: baseItem.aKeywords,
          aSections: baseItem.aSections.map(s => ({ enHtml: s.enHtml, ko: s.ko })),
          aEnPlain: baseItem.aEnPlain,
          ...(isIm3A ? {} : nextPatchFlags)
        };
        saveEdits();
        state.popup.isEditing = false;
        renderStarFilters();
        renderCards();
        renderScriptPopup();
        updatePlaybackUI();
        showToast("수정 내용·번역·키워드가 저장되었습니다.");
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = "💾 저장";
        }
      }
    }

    async function syncExistingUserEdits() {
      const entries = Object.entries(state.edits || {});
      if (!entries.length) return 0;

      let updatedCount = 0;
      let storeChanged = false;

      for (const [idStr, patch] of entries) {
        const item = OPIC_DATA.find(x => x.id === Number(idStr));
        const defItem = DEFAULT_OPIC_DATA.find(x => x.id === Number(idStr));
        if (!item || !defItem) continue;

        let itemUpdated = false;

        // 1) Question check
        const curQ = (item.qEn || "").replace(/\s+/g, " ").trim();
        const defQ = (defItem.qEn || "").replace(/\s+/g, " ").trim();
        if (curQ !== defQ) {
          if (!patch.kwSynced && item.qKeywords === defItem.qKeywords) {
            item.qKeywords = buildUpdatedQKeywords(item, defItem);
            itemUpdated = true;
          }
          if (!patch.qKoSynced && (item.qKo === defItem.qKo || !item.qKo.trim())) {
            try {
              const ko = await translateEnToKo(curQ);
              if (ko) {
                item.qKo = ko;
                patch.qKoSynced = true;
                itemUpdated = true;
              }
            } catch {}
          }
        }

        // 2) Answer check
        let anySecChanged = false;
        for (let i = 0; i < item.aSections.length; i++) {
          const curPlain = stripHtmlToPlain(item.aSections[i].enHtml);
          const defPlain = stripHtmlToPlain(defItem.aSections[i].enHtml);
          if (curPlain !== defPlain) {
            anySecChanged = true;
            const flag = `aKoSynced_${i}`;
            if (!patch[flag] && (item.aSections[i].ko === defItem.aSections[i].ko || !item.aSections[i].ko.trim())) {
              try {
                const ko = await translateEnToKo(curPlain);
                if (ko) {
                  item.aSections[i].ko = ko;
                  patch[flag] = true;
                  itemUpdated = true;
                }
              } catch {}
            }
          }
        }

        if (anySecChanged && !patch.kwSynced && item.aKeywords === defItem.aKeywords) {
          item.aKeywords = buildUpdatedAKeywords(item, defItem);
          itemUpdated = true;
        }

        if (!patch.kwSynced) {
          patch.kwSynced = true;
          storeChanged = true;
        }

        if (itemUpdated) {
          updatedCount += 1;
          storeChanged = true;
          state.edits[idStr] = {
            ...patch,
            qKeywords: item.qKeywords,
            qEn: item.qEn,
            qKo: item.qKo,
            aKeywords: item.aKeywords,
            aSections: item.aSections.map(s => ({ enHtml: s.enHtml, ko: s.ko })),
            aEnPlain: item.aEnPlain,
            kwSynced: true
          };
        }
      }

      if (storeChanged) {
        saveEdits();
      }
      if (updatedCount > 0) {
        renderCards();
        if (state.popup.isOpen && !state.popup.isEditing) {
          renderScriptPopup();
        }
        updatePlaybackUI();
        showToast(`수정된 스크립트 ${updatedCount}개의 번역·키워드를 자동 반영했습니다.`);
      }
      return updatedCount;
    }

    function resetPopupItem() {
      const item = OPIC_DATA.find(x => x.id === state.popup.itemId);
      const def = DEFAULT_OPIC_DATA.find(x => x.id === state.popup.itemId);
      if (!item || !def) return;

      if (state.prefs.level === "im3" && state.popup.part === "A" && IM3_DATA_MAP[item.id] && DEFAULT_IM3_MAP[item.id]) {
        applyItemPatch(IM3_DATA_MAP[item.id], JSON.parse(JSON.stringify(DEFAULT_IM3_MAP[item.id])));
        delete state.im3Edits[String(item.id)];
        saveIm3Edits();
      } else {
        applyItemPatch(item, JSON.parse(JSON.stringify(def)));
        item.stars = def.stars || 0;
        delete state.edits[String(item.id)];
        saveEdits();
      }
      state.popup.isEditing = false;
      renderStarFilters();
      renderCards();
      renderScriptPopup();
      updatePlaybackUI();
      showToast("기본 스크립트로 복원되었습니다.");
    }

    function renderCards() {
      const container = document.getElementById("cardList");
      const items = getItemsForTab(state.activeTab);

      if (!items.length) {
        const hasSearch = Boolean(state.searchQuery && state.searchQuery.trim());
        const emptyTitle = hasSearch
          ? "🔍 검색 결과가 없습니다"
          : (state.starFilter !== "all"
            ? "해당 별표 조건의 문항이 없습니다"
            : "⭐ 복습노트가 비어 있습니다");
        const emptyDesc = hasSearch
          ? "다른 검색어를 입력하거나 상단 탭·별표 필터를 '전체'로 변경해 보세요."
          : (state.starFilter !== "all"
            ? "상단 별표 필터를 '별표: 전체'로 바꾸어 보세요."
            : "문항 오른쪽 상단의 ☆ 버튼을 눌러<br />헷갈리거나 집중 복습할 문항을 모아보세요!");

                <button type="button" class="icon-toggle ${isDone ? "is-on" : ""}" data-action="done" data-id="${item.id}" aria-label="암기 완료 체크">${isDone ? "✅" : "☑️"}</button>

                <div class="qa-summary-area">
                  <span class="qa-tag tag-q">Q</span>
                  <span class="qa-keywords">${escapeHtml(item.qKeywords)}</span>
                </div>
                <span class="open-arrow" aria-hidden="true">›</span>
              </div>
            </div>

            <!-- Answer Row -->
            <div class="qa-block" data-id="${item.id}" data-part="A">
              <div class="qa-row" data-action="open-popup" data-id="${item.id}" data-part="A">
                <button type="button" class="btn-play-item is-answer" data-action="play-part" data-id="${item.id}" data-part="A" aria-label="답변 재생">▶</button>

    // --- Event Bindings ---
    function bindEvents() {
      // Utility Bar
      document.getElementById("btnToggleKo").addEventListener("click", () => {
        state.prefs.showKo = !state.prefs.showKo;
        savePrefs();
        renderPrefsUI();
      });

      document.getElementById("btnToggleBlind").addEventListener("click", () => {
        state.prefs.blindMode = !state.prefs.blindMode;
        if (!state.prefs.blindMode) {
          document.querySelectorAll(".hl-expr.is-revealed").forEach(el => el.classList.remove("is-revealed"));
        }
        savePrefs();
        renderPrefsUI();
        showToast(state.prefs.blindMode ? "블라인드 ON: 가려진 표현을 터치하면 보입니다." : "블라인드 OFF");
      });

      // Filler Modal
      const modal = document.getElementById("fillerModal");
      document.getElementById("btnOpenFillers").addEventListener("click", () => {
        modal.classList.add("is-open");
      });
      document.getElementById("btnCloseFillers").addEventListener("click", () => {
        modal.classList.remove("is-open");
      });
      modal.addEventListener("click", e => {
        if (e.target === modal) modal.classList.remove("is-open");
      });
      document.getElementById("fillerSheetBody").addEventListener("click", e => {
        const chip = e.target.closest(".filler-chip");
        if (chip) speakFillerPhrase(chip.dataset.speak);
      });

      // Script Popup
      const popupBackdrop = document.getElementById("scriptPopupBackdrop");
      document.querySelector(".popup-toolbar").addEventListener("click", e => {
        e.stopPropagation();
      });

      function setStudyLevel(nextLevel) {
        if (nextLevel !== "al" && nextLevel !== "im3") return;
        if (state.prefs.level === nextLevel) return;
        if (state.playback.active) stopPlayback();
        state.prefs.level = nextLevel;
        savePrefs();
        renderPrefsUI();
        renderCards();
        if (state.popup.isOpen && !state.popup.isEditing) {
          renderScriptPopup();
        }
        updatePlaybackUI();
        showToast(nextLevel === "im3" ? "🌱 IM3 (쉽고 짧은 버전)으로 전환했습니다." : "🎯 AL (고득점 원문)으로 전환했습니다.");
      }

      const btnPopupLevel = document.getElementById("btnPopupLevel");
      if (btnPopupLevel) {
        btnPopupLevel.addEventListener("click", () => {
          if (!state.popup.isOpen) return;
          clearPopupTapTimer();
          state.popup.isEditing = false;
          setStudyLevel(state.prefs.level === "im3" ? "al" : "im3");
        });
      }

      document.getElementById("btnPopupSwitchPart").addEventListener("click", () => {
        if (!state.popup.isOpen) return;
        clearPopupTapTimer();
        state.popup.isEditing = false;
        state.popup.part = state.popup.part === "Q" ? "A" : "Q";
        renderScriptPopup();
        updatePlaybackUI();
      });

      document.getElementById("btnFontDown").addEventListener("click", () => changePopupFontSize(-2));
      document.getElementById("btnFontUp").addEventListener("click", () => changePopupFontSize(2));

      document.getElementById("btnPopupTranslate").addEventListener("click", () => {
        state.prefs.showKo = !state.prefs.showKo;
        savePrefs();
        renderPrefsUI();
      });

      document.getElementById("btnPopupEdit").addEventListener("click", () => {
        if (!state.popup.isOpen) return;
        clearPopupTapTimer();
        state.popup.isEditing = !state.popup.isEditing;
        renderScriptPopup();
      });

      document.getElementById("btnPopupPlay").addEventListener("click", () => {
        if (!state.popup.isOpen) return;
        playSinglePart(state.popup.itemId, state.popup.part);
      });

      document.getElementById("popupBody").addEventListener("click", e => {
        if (state.popup.isEditing) {
          if (e.target.closest("#btnAutoTranslateEdit")) {
            autoGenerateEditFields();
          } else if (e.target.closest("#btnSaveEdit")) {
            savePopupEdits();
          } else if (e.target.closest("#btnCancelEdit")) {
            state.popup.isEditing = false;
            renderScriptPopup();
          } else if (e.target.closest("#btnResetEdit")) {
            resetPopupItem();
          }
          return;
        }

        if (state.prefs.blindMode) {
          const expr = e.target.closest(".hl-expr:not(.is-revealed)");
          if (expr) {
            e.stopPropagation();
            clearPopupTapTimer();
            expr.classList.add("is-revealed");
            return;
          }
        }

        const now = Date.now();
        const isDoubleTap = state.popup.lastTapTime > 0 && (now - state.popup.lastTapTime) <= 300;
        if (isDoubleTap) {
          clearPopupTapTimer();
          closeScriptPopup();
          return;
        }

        clearPopupTapTimer();
        state.popup.lastTapTime = now;

        const sentEl = e.target.closest(".tts-sentence");
        if (sentEl && sentEl.dataset.sidx !== undefined) {
          const itemId = state.popup.itemId;
          const part = state.popup.part;
          const sidx = Number(sentEl.dataset.sidx);
          unlockAudioContext();
          state.popup.tapTimer = setTimeout(() => {
            state.popup.tapTimer = null;
            state.popup.lastTapTime = 0;
            playFromPopupSentence(itemId, part, sidx);
          }, 240);
        }
      });

      popupBackdrop.addEventListener("click", e => {
        if (e.target === popupBackdrop && !state.popup.isEditing) {
          const now = Date.now();
          if (state.popup.lastTapTime > 0 && (now - state.popup.lastTapTime) <= 300) {
            clearPopupTapTimer();
            closeScriptPopup();
          } else {
            clearPopupTapTimer();
            state.popup.lastTapTime = now;
          }
        }
      });

      // Tabs & Star Filter
      document.getElementById("tabBar").addEventListener("click", e => {
        const btn = e.target.closest(".tab-pill");
        if (!btn) return;
        state.activeTab = btn.dataset.tab;
        renderTabs();
        renderStarFilters();
        renderCards();
      });

      document.getElementById("starFilterBar").addEventListener("click", e => {
        const btn = e.target.closest(".star-pill");
        if (!btn) return;
        state.starFilter = btn.dataset.star;
        renderStarFilters();
        renderCards();
      });

      // Tab Controls
      const levelRow = document.querySelector(".level-row");
      if (levelRow) {
        levelRow.addEventListener("click", e => {
          const btn = e.target.closest(".level-btn");
          if (!btn) return;
          setStudyLevel(btn.dataset.level);
        });
      }

      document.getElementById("btnPlayTab").addEventListener("click", playTabAll);
      document.getElementById("btnPlayRandom").addEventListener("click", playTabRandom);

      document.querySelector(".mode-row").addEventListener("click", e => {
        const btn = e.target.closest(".mode-btn");
        if (!btn) return;
        state.prefs.playMode = btn.dataset.mode;
        savePrefs();
        renderPrefsUI();
      });

      // Cards Delegation
      document.getElementById("cardList").addEventListener("click", e => {
        // 1. Play button inside Q/A row
        const playBtn = e.target.closest('[data-action="play-part"]');
        if (playBtn) {
          e.stopPropagation();
          playSinglePart(Number(playBtn.dataset.id), playBtn.dataset.part);
          return;
        }

        // 2. Star / Done buttons
        const starBtn = e.target.closest('[data-action="star"]');
        if (starBtn) {
          const id = Number(starBtn.dataset.id);
          if (state.starredIds.has(id)) state.starredIds.delete(id);
          else state.starredIds.add(id);
          saveStarred();
          renderTabs();
          renderCards();
          return;
        }

        const doneBtn = e.target.closest('[data-action="done"]');
        if (doneBtn) {
          const id = Number(doneBtn.dataset.id);
          if (state.doneIds.has(id)) state.doneIds.delete(id);
          else state.doneIds.add(id);
          saveDone();
          renderProgress();
          renderCards();
          return;
        }

        // 3. Open Full-Screen Script Popup
        const row = e.target.closest('[data-action="open-popup"]');
        if (row) {
          openScriptPopup(Number(row.dataset.id), row.dataset.part);
        }
      });

      // Mini Player Controls
      document.getElementById("btnAudioSource").addEventListener("click", () => {
        unlockAudioContext();
        state.prefs.audioSource = state.prefs.audioSource === "file" ? "web" : "file";
        savePrefs();
        renderPrefsUI();
        const isFile = state.prefs.audioSource === "file";
        showToast(isFile ? "🎵 TTS 음성파일(MP3) 재생으로 전환되었습니다." : "📱 기기 내장 TTS 재생으로 전환되었습니다.");

        const pb = state.playback;
        if (pb.active && pb.scope !== "sentence") {
          clearDelayTimer();
          stopAudioElement(true);
          if ("speechSynthesis" in window) {
            try { window.speechSynthesis.cancel(); } catch {}
          }
          pb.sessionToken += 1;
          const myToken = pb.sessionToken;
          pb.usingAudioFile = isFile;
          pb.sentIndex = 0;
          if (!pb.paused) {
            playCurrentBlock(myToken);
          } else {
            updatePlaybackUI();
          }
        }
      });

      document.getElementById("btnPlayPause").addEventListener("click", () => {
        if (!state.playback.active) {
          if (state.popup.isOpen) {
            playSinglePart(state.popup.itemId, state.popup.part);
          } else {
            playTabAll();
          }
        } else if (state.playback.paused) {
          resumePlayback();
        } else {
          pausePlayback();
        }
      });

      document.getElementById("btnStop").addEventListener("click", () => stopPlayback());
      document.getElementById("btnPrev").addEventListener("click", () => jumpQueueItem(-1));
      document.getElementById("btnNext").addEventListener("click", () => jumpQueueItem(1));

      document.getElementById("btnRepeat").addEventListener("click", () => {
        state.playback.repeatOne = !state.playback.repeatOne;
        updatePlaybackUI();
        showToast(state.playback.repeatOne ? "1문항 반복 재생 ON" : "1문항 반복 재생 OFF");
      });

      document.getElementById("btnRate").addEventListener("click", () => {
        const curIdx = RATES.indexOf(state.prefs.rate);
        state.prefs.rate = RATES[(curIdx + 1) % RATES.length];
        savePrefs();
        renderPrefsUI();
        if (state.playback.active && !state.playback.paused) {
          const pb = state.playback;
          if (pb.usingAudioFile && audioPlayer) {
            audioPlayer.playbackRate = state.prefs.rate;
            showToast(`재생 속도 ${state.prefs.rate}x`);
            return;
          }
          // Apply new speed immediately on current sentence (Web Speech API)
          clearDelayTimer();
          pb.sessionToken += 1;
          const myToken = pb.sessionToken;
          if ("speechSynthesis" in window) {
            try { window.speechSynthesis.cancel(); } catch {}
          }
          pb.delayTimer = setTimeout(() => {
            if (pb.sessionToken === myToken) playCurrentBlock(myToken);
          }, 50);
        }
      });

      const searchInput = document.getElementById("searchInput");
      const btnClearSearch = document.getElementById("btnClearSearch");
      if (searchInput) {
        const applySearch = (val) => {
          state.searchQuery = val || "";
          if (btnClearSearch) {
            btnClearSearch.hidden = !state.searchQuery.trim();
          }
          renderTabs();
          renderStarFilters();
          renderCards();
        };
        searchInput.addEventListener("input", e => {
          applySearch(e.target.value);
        });
        searchInput.addEventListener("keydown", e => {
          if (e.key === "Escape") {
            searchInput.value = "";
            applySearch("");
          } else if (e.key === "Enter") {
            searchInput.blur();
          }
        });
        if (btnClearSearch) {
          btnClearSearch.addEventListener("click", () => {
            searchInput.value = "";
            applySearch("");
            searchInput.focus();
          });
        }
      }
    }

    // --- Init ---
    function init() {
      loadState();
      renderProgress();
      renderPrefsUI();
      renderTabs();
      renderStarFilters();
      renderCards();
      renderFillerModal();
      bindEvents();

      loadVoices();
      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      syncExistingUserEdits();
    }

    init();
  </script>
</body>
</html>
