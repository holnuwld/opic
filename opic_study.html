pan class=\"hl-expr\">take care of her</span>.","ko":"오늘 아침에 아내가 코로나19에 걸렸어. 열이 많이 나고 기침도 심해. 쉬어야 해서 내가 돌봐줘야 해."},{"step":"결론","summary":"다음 주말로 일정 변경 제안 및 연락 요청","enHtml":"<span class=\"hl-filler\">So,</span> can we <span class=\"hl-expr\">meet next weekend</span> instead? If you are busy then, please tell me a good day. Call me back when you get this. Bye.","ko":"그래서 대신 다음 주말에 만날 수 있을까? 그때 바쁘면 괜찮은 날을 알려줘. 이 메시지 확인하면 전화 줘. 안녕."}],"aEnPlain":"Hi Lia, it's me, Sam. I'm calling about dinner tonight. I'm really sorry, but we can't go tonight. My wife got COVID-19 this morning. She has a high fever and a bad cough. She needs to rest, so I have to take care of her. So, can we meet next weekend instead? If you are busy then, please tell me a good day. Call me back when you get this. Bye."},"4":{"id":4,"aKeywords":"👫 Honey, invite Lia's couple? ➔ 📅 Free this Sunday (okay?) ➔ 🕖 7 p.m. good time? ➔ 🍽️ What food to cook? (ask them)","aSections":[{"step":"도입","summary":"아내에게 리아 부부 초대 및 일요일 일정 문의","enHtml":"Honey, do you remember Lia? I want to <span class=\"hl-expr\">invite her couple</span> for dinner. Is that okay? Great! They are free this Sunday. <span class=\"hl-expr\">Does Sunday work for you?</span>","ko":"여보, 리아 기억나? 리아 부부를 저녁 식사에 초대하고 싶어. 괜찮을까? 좋아! 이번 주 일요일에 시간 된대. 당신도 일요일 괜찮아?"},{"step":"전개","summary":"저녁 7시 시간 조율","enHtml":"Then, what time is good? <span class=\"hl-expr\">Is 7 p.m. okay?</span> I think 7 is not too early and not too late.","ko":"그럼 몇 시가 좋을까? 저녁 7시 어때? 7시면 너무 이르지도 늦지도 않고 딱 좋은 것 같아."},{"step":"결론","summary":"저녁 메뉴 상의 및 확정","enHtml":"<span class=\"hl-filler\">Also,</span> what food should we cook? If we aren't sure, I can ask Lia what they like. <span class=\"hl-expr\">Sounds good,</span> let's do that.","ko":"그리고 저녁으로 무슨 요리를 할까? 잘 모르겠으면 리아한테 좋아하는 음식을 물어볼게. 좋아, 그렇게 하자."}],"aEnPlain":"Honey, do you remember Lia? I want to invite her couple for dinner. Is that okay? Great! They are free this Sunday. Does Sunday work for you? Then, what time is good? Is 7 p.m. okay? I think 7 is not too early and not too late. Also, what food should we cook? If we aren't sure, I can ask Lia what they like. Sounds good, let's do that."},"5":{"id":5,"aKeywords":"📞 Hi Jake, it's Sam (broke MP3) ➔ 💥 Dropped on floor by mistake ➔ 📱 Screen cracked, won't turn on ➔ 🛠️ Fix at center or buy new one","aSections":[{"step":"도입","summary":"제이크에게 MP3 파손 사실 사과","enHtml":"Hi Jake, <span class=\"hl-expr\">it's Sam</span>. I'm calling about your MP3 player. I'm so sorry, but I <span class=\"hl-expr\">think I broke it</span>.","ko":"안녕 제이크, 나 샘이야. 네 MP3 플레이어 때문에 전화했어. 정말 미안한데, 내가 망가뜨린 것 같아."},{"step":"전개","summary":"실수로 떨어뜨려 화면이 깨지고 작동 불가","enHtml":"I <span class=\"hl-expr\">dropped it by mistake</span> yesterday. It hit the floor hard. Now the screen is cracked, and it <span class=\"hl-expr\">won't turn on</span>.","ko":"어제 실수로 떨어뜨렸어. 바닥에 세게 부딪혔거든. 지금 화면에 금이 가고 전원이 켜지지 않아."},{"step":"결론","summary":"수리 또는 새 제품 구매 제안","enHtml":"<span class=\"hl-filler\">So,</span> I can <span class=\"hl-expr\">take it to a repair shop</span> right away. Or, I can <span class=\"hl-expr\">buy you a new one</span> with the same model. Let me know what you want. I'm really sorry again.","ko":"그래서 바로 수리점에 가져가서 고칠게. 아니면 똑같은 모델로 새 걸 사줄 수도 있어. 원하는 걸 알려줘. 다시 한번 정말 미안해."}],"aEnPlain":"Hi Jake, it's Sam. I'm calling about your MP3 player. I'm so sorry, but I think I broke it. I dropped it by mistake yesterday. It hit the floor hard. Now the screen is cracked, and it won't turn on. So, I can take it to a repair shop right away. Or, I can buy you a new one with the same model. Let me know what you want. I'm really sorry again."},"6":{"id":6,"aKeywords":"🎬 Megabox? 2 tickets tomorrow 7 p.m. ➔ 📋 Any good movies? 'The Odyssey'? ➔ 💰 Price for 2 tickets? ➔ 🎟️ Any discounts available?","aSections":[{"step":"도입","summary":"메가박스에 내일 저녁 7시 표 2장 문의","enHtml":"Hello, is this Megabox? I want to <span class=\"hl-expr\">book two movie tickets</span> for tomorrow. If possible, I want a show <span class=\"hl-expr\">around 7 p.m.</span>","ko":"안녕하세요, 메가박스인가요? 내일 영화 티켓 2장을 예매하고 싶습니다. 가능하면 저녁 7시쯤 상영하는 걸 원해요."},{"step":"전개","summary":"상영작 및 인기 영화 '오디세이' 추천 문의","enHtml":"What movies can I watch tomorrow? Can you <span class=\"hl-expr\">recommend a good movie</span>? I heard \"The Odyssey\" is very popular. Do you think it is good?","ko":"내일 어떤 영화를 볼 수 있나요? 좋은 영화 하나 추천해 주실 수 있나요? \"오디세이\"가 아주 인기 있다고 들었는데, 괜찮은가요?"},{"step":"결론","summary":"가격 및 할인 혜택 확인 후 인사","enHtml":"<span class=\"hl-filler\">Also,</span> how much are two tickets for that movie? Are there <span class=\"hl-expr\">any discounts</span> I can use? Thank you for your help. Bye.","ko":"그리고 그 영화 2장 가격은 얼마인가요? 제가 받을 수 있는 할인이 있나요? 도와주셔서 감사합니다. 안녕히 계세요."}],"aEnPlain":"Hello, is this Megabox? I want to book two movie tickets for tomorrow. If possible, I want a show around 7 p.m. What movies can I watch tomorrow? Can you recommend a good movie? I heard \"The Odyssey\" is very popular. Do you think it is good? Also, how much are two tickets for that movie? Are there any discounts I can use? Thank you for your help. Bye."},"7":{"id":7,"aKeywords":"🎟️ Booked 7 p.m. online, got 9 p.m. ➔ 🔄 Can I change to 7 p.m.? ➔ 💸 Sold out → cancel & get refund? ➔ 🙏 Thank you","aSections":[{"step":"도입","summary":"7시 예매했는데 9시 표가 나온 상황 설명","enHtml":"Excuse me, there is a <span class=\"hl-expr\">problem with my tickets</span>. I booked the 7 p.m. movie online 3 hours ago. But these tickets say <span class=\"hl-expr\">9 p.m.</span>","ko":"실례합니다, 제 티켓에 문제가 있습니다. 3시간 전에 온라인으로 7시 영화를 예매했어요. 그런데 이 표에는 9시라고 적혀 있네요."},{"step":"전개","summary":"7시 표로 교환 가능 여부 질문","enHtml":"<span class=\"hl-filler\">So,</span> can I <span class=\"hl-expr\">change them</span> to the 7 p.m. movie? Are there any seats left for 7 p.m.?","ko":"그래서 7시 영화로 바꿀 수 있을까요? 7시 영화 좌석이 남아 있나요?"},{"step":"결론","summary":"매진 시 취소 및 환불 요청","enHtml":"Oh, no seats left? Then, can I <span class=\"hl-expr\">cancel them and get a refund</span>? My friend and I have other plans tonight, so we cannot watch it. Thank you for helping me.","ko":"아, 자리가 없나요? 그럼 표를 취소하고 환불받을 수 있을까요? 친구와 저 둘 다 오늘 밤에 다른 약속이 있어서 볼 수가 없어요. 도와주셔서 감사합니다."}],"aEnPlain":"Excuse me, there is a problem with my tickets. I booked the 7 p.m. movie online 3 hours ago. But these tickets say 9 p.m. So, can I change them to the 7 p.m. movie? Are there any seats left for 7 p.m.? Oh, no seats left? Then, can I cancel them and get a refund? My friend and I have other plans tonight, so we cannot watch it. Thank you for helping me."},"8":{"id":8,"aKeywords":"📞 Hi Jake, it's Sam (MP3 broke) ➔ 🔥 Popular models? Recommend Samsung M2? ➔ 💰 Price of Samsung M2? ➔ 🏷️ Any deals or discounts?","aSections":[{"step":"도입","summary":"제이크에게 새 MP3 구매 상담 요청","enHtml":"Hi Jake, <span class=\"hl-expr\">this is Sam</span>. My MP3 player broke, so I want to <span class=\"hl-expr\">buy a new one</span>. I heard you know a lot about MP3 players.","ko":"안녕 제이크, 나 샘이야. 내 MP3 플레이어가 고장 나서 새 걸 하나 사고 싶어. 네가 MP3 플레이어에 대해 잘 안다고 들었거든."},{"step":"전개","summary":"인기 제품과 삼성 M2 추천 여부 질문","enHtml":"Which MP3 player is <span class=\"hl-expr\">popular these days</span>? Can you <span class=\"hl-expr\">recommend one</span>? I heard Samsung M2 is really good. Do you like it too?","ko":"요즘 어떤 MP3 플레이어가 인기 있어? 하나 추천해 줄 수 있어? 삼성 M2가 정말 좋다고 들었는데, 너도 그거 괜찮다고 생각해?"},{"step":"결론","summary":"가격 및 할인 팁 질문 후 마무리","enHtml":"<span class=\"hl-filler\">Also,</span> do you know how much it is? Are there <span class=\"hl-expr\">any good discounts</span>? Thanks for the help. Bye!","ko":"그리고 가격이 얼마인지 알아? 좋은 할인 혜택이 있을까? 도와줘서 고마워. 안녕!"}],"aEnPlain":"Hi Jake, this is Sam. My MP3 player broke, so I want to buy a new one. I heard you know a lot about MP3 players. Which MP3 player is popular these days? Can you recommend one? I heard Samsung M2 is really good. Do you like it too? Also, do you know how much it is? Are there any good discounts? Thanks for the help. Bye!"},"9":{"id":9,"aKeywords":"📱 Years ago bought new phone (face lock) ➔ 😤 Didn't work well & very slow ➔ 🔧 Visited service center (camera issue) ➔ 💡 Now always go right away","aSections":[{"step":"도입","summary":"몇 년 전 안면인식 기능이 있는 새 폰 구매","enHtml":"Yes, this happened to me a few years ago. I bought a new phone with <span class=\"hl-expr\">face unlock</span>. At first, I was <span class=\"hl-expr\">very excited</span> to use it.","ko":"네, 몇 년 전에 이런 일이 있었습니다. 얼굴 인식 잠금 해제가 되는 새 휴대폰을 샀어요. 처음에는 쓰는 게 정말 신났습니다."},{"step":"전개","summary":"얼굴 인식 반복 실패로 인한 불편함","enHtml":"<span class=\"hl-filler\">However,</span> it didn't work well. It often <span class=\"hl-expr\">failed to unlock</span> or was very slow. It was <span class=\"hl-expr\">really frustrating</span>.","ko":"하지만 잘 작동하지 않았습니다. 잠금 해제에 자주 실패하거나 너무 느렸어요. 정말 답답했습니다."},{"step":"결론","summary":"서비스센터 방문으로 카메라 센서 수리","enHtml":"I tried to fix it myself, but I couldn't. So I went to the <span class=\"hl-expr\">service center</span>. They said there was a <span class=\"hl-expr\">small camera problem</span> and fixed it. Now I always go to the center right away when my phone breaks.","ko":"혼자 고쳐보려 했지만 안 됐습니다. 그래서 서비스센터에 갔어요. 거기서 카메라에 작은 문제가 있다고 해서 고쳐주었습니다. 이제는 휴대폰이 고장 나면 항상 바로 센터에 갑니다."}],"aEnPlain":"Yes, this happened to me a few years ago. I bought a new phone with face unlock. At first, I was very excited to use it. However, it didn't work well. It often failed to unlock or was very slow. It was really frustrating. I tried to fix it myself, but I couldn't. So I went to the service center. They said there was a small camera problem and fixed it. Now I always go to the center right away when my phone breaks."},"10":{"id":10,"aKeywords":"📅 Check free time (prefer weekdays) ➔ 💻 Book online (fast) or call ➔ 🔔 Get reminder text ➔ ⏰ Arrive early on appointment day","aSections":[{"step":"도입","summary":"여유 시간 확인 및 평일 예약 선호","enHtml":"Making an appointment is <span class=\"hl-expr\">pretty simple</span> for me. First, I check my schedule and pick a free time. I <span class=\"hl-expr\">prefer weekdays</span> because weekends are too busy.","ko":"저에게 예약을 잡는 과정은 꽤 간단합니다. 먼저 제 일정을 확인하고 비는 시간을 고릅니다. 주말은 너무 붐벼서 평일을 선호합니다."},{"step":"전개","summary":"온라인 예약 또는 전화로 확인 문자 받기","enHtml":"Then, I call the place or <span class=\"hl-expr\">book online</span>. I like online booking because it is <span class=\"hl-expr\">easy and fast</span>. After I book, they usually send me a <span class=\"hl-expr\">reminder text</span>.","ko":"그다음 전화를 하거나 온라인으로 예약합니다. 온라인 예약은 쉽고 빨라서 좋아합니다. 예약하고 나면 보통 알림 문자를 보내줍니다."},{"step":"결론","summary":"당일 조금 일찍 도착해서 여유롭게 준비","enHtml":"On that day, I try to <span class=\"hl-expr\">arrive a little early</span>. Sometimes I can start early if it is not busy. <span class=\"hl-filler\">So,</span> that is how I make appointments.","ko":"당일에는 조금 일찍 도착하려고 노력합니다. 한가하면 일찍 시작할 수도 있습니다. 이것이 제가 예약하는 방법입니다."}],"aEnPlain":"Making an appointment is pretty simple for me. First, I check my schedule and pick a free time. I prefer weekdays because weekends are too busy. Then, I call the place or book online. I like online booking because it is easy and fast. After I book, they usually send me a reminder text. On that day, I try to arrive a little early. Sometimes I can start early if it is not busy. So, that is how I make appointments."},"11":{"id":11,"aKeywords":"⛰️ Kid: weekend hiking at Seoraksan w/ family ➔ 🌲 Tall trees, birds & great top view ➔ 🍲 Ate hot chicken soup after ➔ 💖 Best childhood memory","aSections":[{"step":"도입","summary":"어릴 적 가족과 주말마다 갔던 설악산 등산","enHtml":"When I was a kid, I often went hiking with my family on weekends. We usually went to <span class=\"hl-expr\">Seoraksan Mountain</span>. My sister and I were always <span class=\"hl-expr\">very excited</span>.","ko":"어릴 적 주말마다 가족과 함께 등산을 자주 갔습니다. 보통 설악산에 갔습니다. 여동생과 저는 항상 무척 신이 났습니다."},{"step":"전개","summary":"자연 풍경 감상과 정상에서의 멋진 경치","enHtml":"We walked in the fresh air and saw many <span class=\"hl-expr\">tall trees</span>. I could also hear birds singing. The hill was steep, <span class=\"hl-expr\">but the view at the top was amazing</span>.","ko":"상쾌한 공기를 마시며 걸었고 큰 나무들을 많이 보았습니다. 새 소리도 들을 수 있었습니다. 언덕이 가팔랐지만 정상에서 본 풍경은 정말 멋졌습니다."},{"step":"결론","summary":"하산 후 닭백숙 식사와 소중한 추억","enHtml":"After hiking, we ate hot <span class=\"hl-expr\">chicken soup</span> near the entrance. It was so delicious! <span class=\"hl-filler\">Looking back,</span> those trips are my <span class=\"hl-expr\">best childhood memories</span>.","ko":"등산 후에는 입구 근처에서 따뜻한 닭백숙을 먹었습니다. 정말 맛있었습니다! 돌이켜보면 그 여행들이 어린 시절 최고의 추억입니다."}],"aEnPlain":"When I was a kid, I often went hiking with my family on weekends. We usually went to Seoraksan Mountain. My sister and I were always very excited. We walked in the fresh air and saw many tall trees. I could also hear birds singing. The hill was steep, but the view at the top was amazing. After hiking, we ate hot chicken soup near the entrance. It was so delicious! Looking back, those trips are my best childhood memories."},"12":{"id":12,"aKeywords":"🗺️ Pick place & search food/hotels ➔ 💻 Book hotels & flights online ➔ 🎒 Pack clothes & toothbrush day before ➔ ✅ Ready for trip","aSections":[{"step":"도입","summary":"여행지 선택 및 정보 검색","enHtml":"When I prepare for a trip, I follow <span class=\"hl-expr\">a few simple steps</span>. First, I choose where to go and when to go. Then, I <span class=\"hl-expr\">search online</span> for good restaurants and famous places.","ko":"여행을 준비할 때 저는 몇 가지 간단한 순서를 따릅니다. 먼저 어디로 언제 갈지 정합니다. 그다음 온라인으로 맛집과 유명 명소를 검색합니다."},{"step":"전개","summary":"온라인으로 숙소와 교통편 예약","enHtml":"Next, I book my <span class=\"hl-expr\">hotel and tickets</span> online. I like online booking because it is <span class=\"hl-expr\">fast and easy</span> to check.","ko":"그다음 온라인으로 호텔과 표를 예약합니다. 온라인 예약은 빠르고 확인하기 쉬워서 좋아합니다."},{"step":"결론","summary":"출발 전날 의류와 세면도구 챙기기","enHtml":"The day before I leave, I <span class=\"hl-expr\">pack my bag</span>. I bring clothes, an umbrella, and some snacks. I also never forget my <span class=\"hl-expr\">toothbrush and toothpaste</span> so I don't waste money. That is how I prepare for a trip.","ko":"출발 전날 가방을 쌉니다. 옷, 우산, 간식을 챙깁니다. 돈을 아끼기 위해 칫솔과 치약도 절대 잊지 않습니다. 이것이 제 여행 준비 방법입니다."}],"aEnPlain":"When I prepare for a trip, I follow a few simple steps. First, I choose where to go and when to go. Then, I search online for good restaurants and famous places. Next, I book my hotel and tickets online. I like online booking because it is fast and easy to check. The day before I leave, I pack my bag. I bring clothes, an umbrella, and some snacks. I also never forget my toothbrush and toothpaste so I don't waste money. That is how I prepare for a trip."},"13":{"id":13,"aKeywords":"🎬 Few months ago 'Odyssey' at CGV w/ family ➔ ☕ Bought tickets & coffee, 3-hr great movie ➔ 🍽️ Dinner & talked after ➔ 😊 Happy & relaxing day","aSections":[{"step":"도입","summary":"몇 달 전 가족과 시내 CGV 영화관 방문","enHtml":"The last time I went to the movies was a few months ago. My family and I went to <span class=\"hl-expr\">CGV theater</span> to watch \"Odyssey\". It was a weekday, but the theater was <span class=\"hl-expr\">very crowded</span>.","ko":"마지막으로 영화관에 간 것은 몇 달 전입니다. 가족과 함께 \"오디세이\"를 보러 CGV 극장에 갔습니다. 평일이었지만 극장이 아주 붐볐습니다."},{"step":"전개","summary":"커피 마시며 기다린 후 멋진 3시간 영화 관람","enHtml":"First, we bought tickets and coffee. We talked while waiting for the movie. Then we watched the 3-hour movie. The <span class=\"hl-expr\">story and pictures were amazing</span>!","ko":"먼저 티켓과 커피를 샀습니다. 영화를 기다리며 이야기를 나눴습니다. 그러고 나서 3시간짜리 영화를 보았습니다. 이야기와 영상이 정말 멋졌습니다!"},{"step":"결론","summary":"저녁 식사하며 감상 나누고 재충전","enHtml":"After the movie, we had dinner at a <span class=\"hl-expr\">nearby restaurant</span> and talked about the movie. It helped me <span class=\"hl-expr\">relax and feel close</span> to my family. <span class=\"hl-filler\">Overall,</span> it was a really fun day.","ko":"영화가 끝난 후 근처 식당에서 저녁을 먹으며 영화 이야기를 나눴습니다. 긴장을 풀고 가족과 더 가까워지는 기분이 들었습니다. 전반적으로 정말 즐거운 날이었습니다."}],"aEnPlain":"The last time I went to the movies was a few months ago. My family and I went to CGV theater to watch \"Odyssey\". It was a weekday, but the theater was very crowded. First, we bought tickets and coffee. We talked while waiting for the movie. Then we watched the 3-hour movie. The story and pictures were amazing! After the movie, we had dinner at a nearby restaurant and talked about the movie. It helped me relax and feel close to my family. Overall, it was a really fun day."},"14":{"id":14,"aKeywords":"✈️ 10 yrs ago Jeju trip w/ friends ➔ 🚨 Morning: younger sister's work emergency ➔ 👶 Babysat her kid, canceled trip ➔ ❤️ Disappointed, but family first","aSections":[{"step":"도입","summary":"10년 전 친구들과 계획했던 제주도 여행","enHtml":"Yes, this happened about 10 years ago. My friends and I planned a trip to <span class=\"hl-expr\">Jeju Island</span>. We booked our flight tickets and were <span class=\"hl-expr\">very excited</span>.","ko":"네, 10년 전쯤 이런 일이 있었습니다. 친구들과 제주도 여행을 계획했습니다. 비행기 표도 예매했고 무척 신나 있었습니다."},{"step":"전개","summary":"당일 아침 여동생 부부의 급한 일로 조카 돌보기","enHtml":"<span class=\"hl-filler\">However,</span> on that morning, my younger sister and her husband had a <span class=\"hl-expr\">sudden work problem</span>. Nobody could watch their young child. So I <span class=\"hl-expr\">babysat the kid</span> all day instead of going to the airport.","ko":"하지만 그날 아침, 여동생과 매제에게 갑자기 회사에 급한 일이 생겼습니다. 어린 아이를 봐줄 사람이 아무도 없었어요. 그래서 공항에 가는 대신 하루 종일 조카를 돌보았습니다."},{"step":"결론","summary":"여행 취소로 아쉬웠지만 가족을 도와 후회 없음","enHtml":"I tried to change the flight, but it was too hard. I had to <span class=\"hl-expr\">cancel the trip</span>, and I felt sad. <span class=\"hl-filler\">Still,</span> I don't regret it because <span class=\"hl-expr\">family comes first</span>.","ko":"비행기 일정을 바꾸려 했지만 너무 어려웠습니다. 여행을 취소해야 했고 속상했습니다. 그래도 가족이 최우선이니까 후회하지 않습니다."}],"aEnPlain":"Yes, this happened about 10 years ago. My friends and I planned a trip to Jeju Island. We booked our flight tickets and were very excited. However, on that morning, my younger sister and her husband had a sudden work problem. Nobody could watch their young child. So I babysat the kid all day instead of going to the airport. I tried to change the flight, but it was too hard. I had to cancel the trip, and I felt sad. Still, I don't regret it because family comes first."},"15":{"id":15,"aKeywords":"🍜 Vacation at home, ready to eat ➔ 🎵 Heard favorite band in park next door ➔ 🏃 Ran out to surprise concert & sang along ➔ 🤩 Best live show ever","aSections":[{"step":"도입","summary":"집에서 휴가 중 옆 공원에서 들린 라이브 음악","enHtml":"This happened a few years ago during my vacation at home. I was very hungry, so I cooked some food. Just before I ate, I heard <span class=\"hl-expr\">live music</span> from the <span class=\"hl-expr\">park next to my home</span>.","ko":"몇 년 전 집에서 휴가를 보낼 때 일입니다. 배가 너무 고파서 음식을 좀 만들었습니다. 막 먹으려던 참에 집 옆 공원에서 라이브 음악이 들렸습니다."},{"step":"전개","summary":"최애 밴드의 깜짝 콘서트 현장으로 달려가 열창","enHtml":"It was a song by my <span class=\"hl-expr\">favorite band</span>! I ran straight to the park without eating. They were doing a <span class=\"hl-expr\">surprise concert</span>! Many people were jumping, and I <span class=\"hl-expr\">sang along loudly</span>.","ko":"제가 가장 좋아하는 밴드의 노래였습니다! 밥도 안 먹고 곧장 공원으로 달려갔습니다. 그들이 깜짝 콘서트를 하고 있었어요! 많은 사람들이 뛰고 있었고 저도 크게 따라 불렀습니다."},{"step":"결론","summary":"배고픔도 잊은 최고의 공연 추억","enHtml":"Their show was full of energy. I stayed hungry for a bit, <span class=\"hl-expr\">but it was the best concert ever</span>. Every time I visit that park, I remember that day.","ko":"그들의 공연은 에너지가 넘쳤습니다. 잠깐 배는 고팠지만 역대 최고의 콘서트였습니다. 그 공원에 갈 때마다 그날이 떠오릅니다."}],"aEnPlain":"This happened a few years ago during my vacation at home. I was very hungry, so I cooked some food. Just before I ate, I heard live music from the park next to my home. It was a song by my favorite band! I ran straight to the park without eating. They were doing a surprise concert! Many people were jumping, and I sang along loudly. Their show was full of energy. I stayed hungry for a bit, but it was the best concert ever. Every time I visit that park, I remember that day."},"16":{"id":16,"aKeywords":"🍽️ 2 yrs ago Jeju restaurant w/ wife ➔ ✨ Saw Cha Eun-woo sitting in corner! ➔ 😱 Very handsome, couldn't believe it ➔ 😳 Wife stared at him (funny memory)","aSections":[{"step":"도입","summary":"2년 전 아내와 제주도 유명 식당 방문","enHtml":"About 2 years ago, I went to <span class=\"hl-expr\">Jeju Island with my wife</span>. For lunch, we went to a famous restaurant. When we sat down, the place was a little <span class=\"hl-expr\">noisy and busy</span>, so I looked around.","ko":"약 2년 전 아내와 함께 제주도에 갔습니다. 점심으로 유명한 식당에 들어갔습니다. 자리에 앉았을 때 식당이 조금 시끄럽고 어수선해서 둘러보았습니다."},{"step":"전개","summary":"식당 한쪽 구석에서 만난 차은우 실물","enHtml":"<span class=\"hl-filler\">Suddenly,</span> I saw <span class=\"hl-expr\">Cha Eun-woo</span> in the corner! He is a very famous and handsome Korean actor. I was <span class=\"hl-expr\">so shocked</span> because he looked amazing in real life.","ko":"갑자기 구석에서 차은우 씨를 보았습니다! 아주 유명하고 잘생긴 한국 배우죠. 실물이 너무 멋져서 정말 깜짝 놀랐습니다."},{"step":"결론","summary":"넋을 잃은 아내를 보며 느낀 유쾌한 추억","enHtml":"Then I looked at my wife, and she <span class=\"hl-expr\">couldn't stop staring</span> at him! I felt a little sorry for her because she looks at me every day. It was <span class=\"hl-expr\">so funny</span>, and I will never forget that trip.","ko":"그다음 아내를 보았는데 차은우 씨에게서 눈을 떼지 못하고 있더군요! 매일 저를 보고 살아야 하는 아내에게 살짝 미안해졌습니다. 너무 웃겼고 그 여행을 절대 잊지 못할 겁니다."}],"aEnPlain":"About 2 years ago, I went to Jeju Island with my wife. For lunch, we went to a famous restaurant. When we sat down, the place was a little noisy and busy, so I looked around. Suddenly, I saw Cha Eun-woo in the corner! He is a very famous and handsome Korean actor. I was so shocked because he looked amazing in real life. Then I looked at my wife, and she couldn't stop staring at him! I felt a little sorry for her because she looks at me every day. It was so funny, and I will never forget that trip."},"17":{"id":17,"aKeywords":"🎬 10 yrs ago booked popular movie w/ wife ➔ ❌ Arrived at theater: wrong date! ➔ 🚫 All seats sold out (missed movie) ➔ ✅ Now always double-check","aSections":[{"step":"도입","summary":"10년 전 아내와 인기 영화 온라인 예매","enHtml":"Yes, this happened about 10 years ago. My wife and I wanted to watch a <span class=\"hl-expr\">popular movie</span>, so I booked tickets online. We were very excited to see it.","ko":"네, 10년 전쯤 이런 일이 있었습니다. 아내와 인기 있는 영화를 보고 싶어서 온라인으로 표를 예매했습니다. 보러 갈 생각에 무척 들떠 있었습니다."},{"step":"전개","summary":"극장 도착 후 내 실수로 날짜를 잘못 예약한 것 발견","enHtml":"<span class=\"hl-filler\">However,</span> at the theater, we found a problem. The <span class=\"hl-expr\">date on the tickets was wrong</span>. It was <span class=\"hl-expr\">my mistake</span>! I picked the wrong day online.","ko":"하지만 극장에서 문제가 발견되었습니다. 티켓의 날짜가 잘못되어 있었습니다. 제 실수였습니다! 온라인에서 날짜를 잘못 골랐던 겁니다."},{"step":"결론","summary":"매진으로 관람 실패, 이후 두 번 확인하는 습관","enHtml":"We tried to buy new tickets, <span class=\"hl-expr\">but all seats were sold out</span>. We couldn't watch the movie, and I felt bad. <span class=\"hl-expr\">Since then,</span> I always check twice when I book tickets.","ko":"새 표를 사려고 했지만 모든 좌석이 매진이었습니다. 영화를 보지 못해 속상했습니다. 그 이후로 표를 예매할 때는 항상 두 번 확인합니다."}],"aEnPlain":"Yes, this happened about 10 years ago. My wife and I wanted to watch a popular movie, so I booked tickets online. We were very excited to see it. However, at the theater, we found a problem. The date on the tickets was wrong. It was my mistake! I picked the wrong day online. We tried to buy new tickets, but all seats were sold out. We couldn't watch the movie, and I felt bad. Since then, I always check twice when I book tickets."},"18":{"id":18,"aKeywords":"🥾 Hike mountain trails (exercise & views) ➔ 🌊 Beach swimming & ocean relax ➔ 🍜 Try local food & go shopping ➔ 😊 Best way to travel","aSections":[{"step":"도입","summary":"해외여행 시 자연 속 산책과 등산 즐기기","enHtml":"When I travel to other countries, I love doing <span class=\"hl-expr\">outdoor activities</span>. First, I like to <span class=\"hl-expr\">go hiking</span>. Many countries have nice mountains and safe trails. It is good exercise, and the views are great.","ko":"다른 나라로 여행을 갈 때 저는 야외 활동을 하는 것을 좋아합니다. 먼저 등산을 좋아합니다. 많은 나라에 좋은 산과 안전한 등산로가 있습니다. 좋은 운동이 되고 경치도 멋집니다."},{"step":"전개","summary":"해변에서 수영하며 바닷바람 즐기기","enHtml":"<span class=\"hl-filler\">Also,</span> I enjoy <span class=\"hl-expr\">going to the beach</span>. I can swim, take a boat, or just rest by the sea. The <span class=\"hl-expr\">cool wind and waves</span> help me relax.","ko":"또한 해변에 가는 것도 즐깁니다. 수영을 하거나 배를 타고, 바다 옆에서 그냥 쉬기도 합니다. 시원한 바람과 파도가 휴식에 도움을 줍니다."},{"step":"결론","summary":"현지 음식 맛보기와 쇼핑 마무리","enHtml":"<span class=\"hl-filler\">Finally,</span> I always <span class=\"hl-expr\">try local food</span> and do some shopping. Eating local food is the best part of any trip. <span class=\"hl-filler\">So,</span> that is what I usually do abroad.","ko":"마지막으로 항상 현지 음식을 먹어보고 쇼핑도 합니다. 현지 음식을 먹는 것은 모든 여행에서 최고의 즐거움입니다. 이것이 제가 해외에서 주로 하는 일들입니다."}],"aEnPlain":"When I travel to other countries, I love doing outdoor activities. First, I like to go hiking. Many countries have nice mountains and safe trails. It is good exercise, and the views are great. Also, I enjoy going to the beach. I can swim, take a boat, or just rest by the sea. The cool wind and waves help me relax. Finally, I always try local food and do some shopping. Eating local food is the best part of any trip. So, that is what I usually do abroad."},"19":{"id":19,"aKeywords":"🏢 3-bed apt in Yongin (quiet & cozy) ➔ 🛋️ Favorite room: bright living room & big sofa ➔ 🌆 Modern & great to relax ➔ ❤️ Love my home","aSections":[{"step":"도입","summary":"조용한 용인의 방 3개짜리 아파트 구조 소개","enHtml":"I live in a <span class=\"hl-expr\">three-bedroom apartment</span> in Yongin. It has a living room, a kitchen, two bathrooms, and a balcony. It is not very big, <span class=\"hl-expr\">but it is comfortable</span>. The neighborhood is very quiet and peaceful.","ko":"저는 용인에 있는 방 3개짜리 아파트에 삽니다. 거실, 주방, 욕실 2개, 발코니가 있습니다. 아주 크진 않지만 편안합니다. 동네가 매우 조용하고 평화롭습니다."},{"step":"전개","summary":"가장 좋아하는 밝은 거실과 큰 소파 묘사","enHtml":"My <span class=\"hl-expr\">favorite room</span> is the living room. It is bright and has a big window and a <span class=\"hl-expr\">big, soft sofa</span>. The walls are white, and it looks clean and modern. I spend most of my free time there.","ko":"가장 좋아하는 방은 거실입니다. 밝고 큰 창문과 크고 푹신한 소파가 있습니다. 벽이 하얗고 깔끔하고 모던해 보입니다. 여가 시간 대부분을 거기서 보냅니다."},{"step":"결론","summary":"집에 대한 만족감과 애정","enHtml":"<span class=\"hl-filler\">Overall,</span> I really love my home. It is the <span class=\"hl-expr\">best place to relax</span> after work.","ko":"전반적으로 저는 제 집을 정말 사랑합니다. 퇴근 후 쉬기에 가장 좋은 곳입니다."}],"aEnPlain":"I live in a three-bedroom apartment in Yongin. It has a living room, a kitchen, two bathrooms, and a balcony. It is not very big, but it is comfortable. The neighborhood is very quiet and peaceful. My favorite room is the living room. It is bright and has a big window and a big, soft sofa. The walls are white, and it looks clean and modern. I spend most of my free time there. Overall, I really love my home. It is the best place to relax after work."},"20":{"id":20,"aKeywords":"👫 Live with wife (weekdays both busy) ➔ 🧹 Weekends share chores (kitchen vs living room) ➔ 📺 Read or watch Netflix after ➔ 😊 Nice family time","aSections":[{"step":"도입","summary":"아내와 함께 살며 둘 다 바쁜 평일 일상","enHtml":"I live with <span class=\"hl-expr\">my wife</span>. On weekdays, we are both <span class=\"hl-expr\">very busy with work</span>. So we only talk a little during dinner or before sleep.","ko":"저는 아내와 함께 살고 있습니다. 평일에는 둘 다 일 때문에 아주 바쁩니다. 그래서 저녁 식사 때나 자기 전에 잠깐 이야기를 나눕니다."},{"step":"전개","summary":"주말에 역할을 나누어 함께하는 집안일","enHtml":"On weekends, we <span class=\"hl-expr\">do housework together</span>. My wife cooks and cleans the kitchen. I clean the living room and <span class=\"hl-expr\">take out the trash</span>. Doing chores is a bit tiring, but it feels good.","ko":"주말에는 함께 집안일을 합니다. 아내는 요리를 하고 주방을 치웁니다. 저는 거실을 청소하고 쓰레기를 버립니다. 집안일이 조금 피곤하지만 기분이 좋습니다."},{"step":"결론","summary":"청소 후 독서나 넷플릭스로 휴식","enHtml":"After we finish, we read books or <span class=\"hl-expr\">watch Netflix together</span>. It is a great way to <span class=\"hl-expr\">relax and enjoy</span> our weekend.","ko":"일을 마친 후에는 함께 책을 읽거나 넷플릭스를 봅니다. 휴식을 취하고 주말을 즐기는 좋은 방법입니다."}],"aEnPlain":"I live with my wife. On weekdays, we are both very busy with work. So we only talk a little during dinner or before sleep. On weekends, we do housework together. My wife cooks and cleans the kitchen. I clean the living room and take out the trash. Doing chores is a bit tiring, but it feels good. After we finish, we read books or watch Netflix together. It is a great way to relax and enjoy our weekend."},"21":{"id":21,"aKeywords":"🏚️ Grew up in small old apt ➔ 🪵 Simple dark wood furniture (warm & safe) ➔ 🚚 Moved out long ago, never went back ➔ 💭 Still miss it","aSections":[{"step":"도입","summary":"작고 낡았지만 따뜻했던 어린 시절 아파트","enHtml":"When I was a child, I lived in an <span class=\"hl-expr\">old apartment</span>. It was small and simple, <span class=\"hl-expr\">but it felt warm</span>. I have many happy memories there with my family.","ko":"어릴 적 저는 오래된 아파트에 살았습니다. 작고 소박했지만 따뜻하게 느껴졌습니다. 그곳에서 가족들과 행복한 추억을 많이 쌓았습니다."},{"step":"전개","summary":"소박한 원목 가구와 아늑하고 안전했던 느낌","enHtml":"We had simple <span class=\"hl-expr\">dark wood furniture</span>. The walls and floors were old, but the house felt <span class=\"hl-expr\">safe and cozy</span>.","ko":"집에는 소박한 짙은 나무 가구가 있었습니다. 벽과 바닥은 낡았지만 집은 안전하고 아늑했습니다."},{"step":"결론","summary":"이사 후 변했을 모습 상상과 그리움","enHtml":"After we moved, I <span class=\"hl-expr\">never went back</span> there. Many years passed, so maybe the buildings look modern now. <span class=\"hl-filler\">Still,</span> in my memory, it is the same, and I <span class=\"hl-expr\">sometimes miss it</span>.","ko":"이사한 후 그곳에 다시 가보진 않았습니다. 오랜 세월이 흘러서 지금은 건물들이 현대적으로 바뀌었을지도 모릅니다. 그래도 제 기억 속에서는 그대로이고 가끔 그립습니다."}],"aEnPlain":"When I was a child, I lived in an old apartment. It was small and simple, but it felt warm. I have many happy memories there with my family. We had simple dark wood furniture. The walls and floors were old, but the house felt safe and cozy. After we moved, I never went back there. Many years passed, so maybe the buildings look modern now. Still, in my memory, it is the same, and I sometimes miss it."},"22":{"id":22,"aKeywords":"🎂 Age 11: secret birthday cake for mom ➔ 😴 Put it off & fell asleep ➔ 😅 Dad upset, mom happy I tried ➔ 👨‍👩‍👦 Made cake together (happy memory)","aSections":[{"step":"도입","summary":"11살 때 엄마 생신 케이크 만들기 비밀 계획","enHtml":"When I was 11, I wanted to make a <span class=\"hl-expr\">birthday cake</span> for my mom. My dad and I had a secret plan. My job was to put cream and fruit on a cake after they went out.","ko":"11살 때 엄마를 위해 생일 케이크를 만들고 싶었습니다. 아빠와 저는 비밀 계획을 세웠습니다. 부모님이 나가신 후 케이크에 크림과 과일을 올리는 게 제 역할이었습니다."},{"step":"전개","summary":"계속 미루다 잠들어버린 실수와 부모님의 반응","enHtml":"<span class=\"hl-filler\">However,</span> I kept waiting and <span class=\"hl-expr\">fell asleep</span>! When they came back, nothing was ready. My dad was upset, and I felt <span class=\"hl-expr\">very sorry</span>. But my mom was still happy that I tried.","ko":"하지만 계속 미루다가 그만 잠이 들고 말았습니다! 부모님이 돌아오셨을 때 아무것도 준비되지 않았어요. 아빠는 화가 나셨고 저는 정말 죄송했습니다. 그래도 엄마는 제가 시도했다는 것에 기뻐하셨습니다."},{"step":"결론","summary":"함께 케이크를 만들며 행복한 추억으로 마무리","enHtml":"In the end, we <span class=\"hl-expr\">made the cake together</span>. We laughed a lot, and it became a <span class=\"hl-expr\">great family memory</span>.","ko":"결국 우리 모두 함께 케이크를 만들었습니다. 많이 웃었고 멋진 가족의 추억이 되었습니다."}],"aEnPlain":"When I was 11, I wanted to make a birthday cake for my mom. My dad and I had a secret plan. My job was to put cream and fruit on a cake after they went out. However, I kept waiting and fell asleep! When they came back, nothing was ready. My dad was upset, and I felt very sorry. But my mom was still happy that I tried. In the end, we made the cake together. We laughed a lot, and it became a great family memory."},"23":{"id":23,"aKeywords":"♻️ My job: trash & recycling ➔ 🗑️ Sort paper, plastic, glass at home ➔ 🏢 Carry to apt trash area (check spots) ➔ 🌍 Good for environment","aSections":[{"step":"도입","summary":"집에서 맡은 쓰레기 분리수거 역할과 실내 분류","enHtml":"At home, my job is <span class=\"hl-expr\">recycling and trash</span>. First, I sort the trash in the kitchen. We have <span class=\"hl-expr\">different bins</span> for paper, plastic, glass, and food waste. I also wash dirty bottles or cans.","ko":"집에서 제 역할은 재활용과 쓰레기 버리기입니다. 먼저 주방에서 쓰레기를 분류합니다. 종이, 플라스틱, 유리, 음식물 쓰레기 통이 따로 있습니다. 더러운 병이나 캔은 씻기도 합니다."},{"step":"전개","summary":"아파트 분리수거장 배출 및 올바른 칸 확인","enHtml":"Second, I carry the trash outside to the <span class=\"hl-expr\">apartment trash area</span>. Then, I make sure I put everything in the <span class=\"hl-expr\">right bin</span>.","ko":"둘째로 아파트 쓰레기장으로 쓰레기를 가지고 나갑니다. 그다음 모든 것을 알맞은 통에 넣었는지 확인합니다."},{"step":"결론","summary":"조금 번거롭지만 환경 보호를 위한 중요한 일","enHtml":"Sometimes it takes time and feels a bit <span class=\"hl-expr\">annoying</span>. <span class=\"hl-filler\">Still,</span> it is important to <span class=\"hl-expr\">protect the environment</span>.","ko":"가끔은 시간이 걸리고 조금 귀찮기도 합니다. 그래도 환경을 보호하기 위해 중요한 일입니다."}],"aEnPlain":"At home, my job is recycling and trash. First, I sort the trash in the kitchen. We have different bins for paper, plastic, glass, and food waste. I also wash dirty bottles or cans. Second, I carry the trash outside to the apartment trash area. Then, I make sure I put everything in the right bin. Sometimes it takes time and feels a bit annoying. Still, it is important to protect the environment."},"24":{"id":24,"aKeywords":"🧹 Kid chores: cleaned my room every weekend ➔ 👧 Looked after younger sister (homework/play) ➔ 🌟 Learned to be responsible & helpful","aSections":[{"step":"도입","summary":"어릴 적 매주 주말 내 방 청소 담당","enHtml":"When I was a child, I didn't have many chores. But I had to <span class=\"hl-expr\">clean my room</span> every weekend. I swept the floor and cleaned my desk. My parents wanted me to keep my room <span class=\"hl-expr\">clean and neat</span>.","ko":"어릴 적에는 집안일이 많지 않았습니다. 하지만 주말마다 제 방을 청소해야 했습니다. 바닥을 쓸고 책상을 닦았습니다. 부모님은 제 방을 깨끗하고 단정하게 유지하길 원하셨습니다."},{"step":"전개","summary":"바쁜 부모님 대신 여동생 돌보기","enHtml":"<span class=\"hl-filler\">Also,</span> I had to <span class=\"hl-expr\">take care of my younger sister</span> when my parents were busy. I played with her and <span class=\"hl-expr\">helped with her homework</span>.","ko":"또한 부모님이 바쁘실 때는 여동생을 돌봐야 했습니다. 같이 놀아주고 숙제도 도와주었습니다."},{"step":"결론","summary":"어린 시절 역할을 통해 배운 책임감","enHtml":"I felt proud because my parents trusted me. <span class=\"hl-filler\">Looking back,</span> those jobs helped me become <span class=\"hl-expr\">more responsible</span>.","ko":"부모님이 저를 믿어주셔서 뿌듯했습니다. 돌이켜보면 그 일들이 저를 더 책임감 있는 사람으로 만들어 주었습니다."}],"aEnPlain":"When I was a child, I didn't have many chores. But I had to clean my room every weekend. I swept the floor and cleaned my desk. My parents wanted me to keep my room clean and neat. Also, I had to take care of my younger sister when my parents were busy. I played with her and helped with her homework. I felt proud because my parents trusted me. Looking back, those jobs helped me become more responsible."},"25":{"id":25,"aKeywords":"🎻 Love classical music (calm & timeless) ➔ 🎤 Also like trot music (fun & energetic) ➔ 🎧 No single favorite singer (like good songs)","aSections":[{"step":"도입","summary":"차분하고 질리지 않는 클래식 음악 선호","enHtml":"I listen to many kinds of music, <span class=\"hl-expr\">but my favorite is classical music</span>. It never gets old, so I never get tired of it. It sounds <span class=\"hl-expr\">calm and soft</span>, and it helps me relax after work.","ko":"저는 여러 종류의 음악을 듣지만 가장 좋아하는 것은 클래식 음악입니다. 유행을 타지 않아서 질리지 않습니다. 소리가 차분하고 부드러워서 퇴근 후 휴식에 도움이 됩니다."},{"step":"전개","summary":"요즘 자주 듣는 신나는 트로트 음악","enHtml":"<span class=\"hl-filler\">Also,</span> I listen to a lot of <span class=\"hl-expr\">trot music</span> these days. It is fun, <span class=\"hl-expr\">energetic</span>, and easy to sing along to. It always makes me feel happy.","ko":"또한 요즘에는 트로트 음악도 많이 듣습니다. 재미있고 에너지가 넘치며 따라 부르기 쉽습니다. 들으면 언제나 기분이 좋아집니다."},{"step":"결론","summary":"특정 가수보다 좋은 곡 위주의 감상","enHtml":"<span class=\"hl-filler\">Well,</span> I don't have just one favorite singer. If I <span class=\"hl-expr\">find a good song</span>, I listen to more songs by that singer.","ko":"딱히 좋아하는 가수 한 명만 있진 않습니다. 좋은 노래를 찾으면 그 가수의 다른 노래들도 더 들어보는 편입니다."}],"aEnPlain":"I listen to many kinds of music, but my favorite is classical music. It never gets old, so I never get tired of it. It sounds calm and soft, and it helps me relax after work. Also, I listen to a lot of trot music these days. It is fun, energetic, and easy to sing along to. It always makes me feel happy. Well, I don't have just one favorite singer. If I find a good song, I listen to more songs by that singer."},"26":{"id":26,"aKeywords":"📱 Stream music on smartphone app ➔ 💾 No storage limit, listen anywhere ➔ 🚗 Play in car to work (relaxing daily habit)","aSections":[{"step":"도입","summary":"스마트폰 음악 앱으로 스트리밍 청취","enHtml":"I usually use a <span class=\"hl-expr\">music app</span> on my smartphone. I just need the Internet. With the app, I can listen to <span class=\"hl-expr\">thousands of songs</span> anytime.","ko":"저는 주로 스마트폰에서 음악 앱을 사용합니다. 인터넷만 있으면 됩니다. 앱으로 언제든 수천 곡의 노래를 들을 수 있습니다."},{"step":"전개","summary":"저장 공간을 차지하지 않는 스트리밍 장점","enHtml":"I like streaming because I don't need to download files. It <span class=\"hl-expr\">saves space</span> on my phone, which is <span class=\"hl-expr\">very convenient</span>.","ko":"파일을 내려받지 않아도 돼서 스트리밍을 좋아합니다. 휴대폰 용량을 아낄 수 있어서 아주 편리합니다."},{"step":"결론","summary":"출퇴근 운전 중 음악 감상으로 피로 해소","enHtml":"I often <span class=\"hl-expr\">play music in my car</span> when I go to work. It makes driving much more fun and relaxing. Music is now a <span class=\"hl-expr\">big part of my daily life</span>.","ko":"출근할 때 차 안에서 음악을 자주 틉니다. 운전이 훨씬 재미있고 편안해집니다. 이제 음악은 제 일상의 큰 부분입니다."}],"aEnPlain":"I usually use a music app on my smartphone. I just need the Internet. With the app, I can listen to thousands of songs anytime. I like streaming because I don't need to download files. It saves space on my phone, which is very convenient. I often play music in my car when I go to work. It makes driving much more fun and relaxing. Music is now a big part of my daily life."},"27":{"id":27,"aKeywords":"🏫 Middle school: friend introduced K-pop ➔ 🌍 Grew older: enjoyed English pop songs ➔ 🎼 Now classical & trot depending on mood","aSections":[{"step":"도입","summary":"중학교 때 친구 추천으로 시작한 K-pop","enHtml":"I first started liking music in <span class=\"hl-expr\">middle school</span>. My friend showed me a K-pop group. I loved their songs and listened to them <span class=\"hl-expr\">every day</span>. I played the same songs again and again.","ko":"저는 중학교 때 처음 음악을 좋아하기 시작했습니다. 친구가 K-pop 그룹을 알려주었습니다. 노래가 너무 좋아서 매일 들었습니다. 같은 노래를 몇 번이고 반복해서 들었습니다."},{"step":"전개","summary":"성장하며 영어 팝송으로 관심 확장","enHtml":"When I grew up, I tried <span class=\"hl-expr\">different kinds of music</span>. I really liked <span class=\"hl-expr\">English pop songs</span> because the melodies were fun and easy to sing.","ko":"나이가 들면서 다양한 음악을 들어보았습니다. 멜로디가 재미있고 부르기 쉬워서 영어 팝송을 정말 좋아했습니다."},{"step":"결론","summary":"기분에 따라 클래식과 트로트를 즐기는 현재","enHtml":"Now, I listen to different music <span class=\"hl-expr\">depending on my mood</span>. Sometimes I listen to classical music, and sometimes I enjoy trot music.","ko":"지금은 기분에 따라 다른 음악을 듣습니다. 어떨 때는 클래식 음악을 듣고, 어떨 때는 트로트 음악을 즐깁니다."}],"aEnPlain":"I first started liking music in middle school. My friend showed me a K-pop group. I loved their songs and listened to them every day. I played the same songs again and again. When I grew up, I tried different kinds of music. I really liked English pop songs because the melodies were fun and easy to sing. Now, I listen to different music depending on my mood. Sometimes I listen to classical music, and sometimes I enjoy trot music."},"28":{"id":28,"aKeywords":"🏠 At home: comedy & action (relaxing) ➔ 🎥 At theater: fantasy & sci-fi (big screen/sound) ➔ 🎬 Different movies for different places","aSections":[{"step":"도입","summary":"집에서 편하게 보기 좋은 코미디·액션 영화","enHtml":"I like many kinds of movies. When I am <span class=\"hl-expr\">at home</span>, I usually watch <span class=\"hl-expr\">comedies or action movies</span>. They are fun and easy to watch, so they help me <span class=\"hl-expr\">relax</span>.","ko":"저는 여러 종류의 영화를 좋아합니다. 집에 있을 때는 주로 코미디나 액션 영화를 봅니다. 재미있고 편하게 볼 수 있어서 긴장을 푸는 데 좋습니다."},{"step":"전개","summary":"영화관에서는 큰 화면과 사운드를 살리는 판타지·SF","enHtml":"<span class=\"hl-filler\">However,</span> when I go to the <span class=\"hl-expr\">movie theater</span>, I choose <span class=\"hl-expr\">fantasy or sci-fi movies</span>. They have cool special effects. The <span class=\"hl-expr\">big screen and great sound</span> make it very exciting.","ko":"하지만 영화관에 갈 때는 판타지나 SF 영화를 고릅니다. 멋진 특수효과가 있거든요. 큰 화면과 좋은 사운드 덕분에 아주 신납니다."},{"step":"결론","summary":"장소와 상황에 맞는 장르 선택 요약","enHtml":"<span class=\"hl-filler\">So,</span> I enjoy different movies <span class=\"hl-expr\">depending on where I am</span>.","ko":"그래서 어디에 있느냐에 따라 다른 종류의 영화를 즐깁니다."}],"aEnPlain":"I like many kinds of movies. When I am at home, I usually watch comedies or action movies. They are fun and easy to watch, so they help me relax. However, when I go to the movie theater, I choose fantasy or sci-fi movies. They have cool special effects. The big screen and great sound make it very exciting. So, I enjoy different movies depending on where I am."},"29":{"id":29,"aKeywords":"🎭 Favorite actor Yoo Hae-jin (natural acting) ➔ 📰 News: history debate on his new movie ➔ 🏠 Protesters outside his home ➔ 😟 Felt bad, blaming actor is unfair","aSections":[{"step":"도입","summary":"자연스러운 연기로 유명한 배우 유해진 소개","enHtml":"Recently, I saw news about my <span class=\"hl-expr\">favorite actor, Yoo Hae-jin</span>. He is very famous in Korea because his acting is <span class=\"hl-expr\">so natural</span>.","ko":"최근에 제가 가장 좋아하는 배우 유해진 씨에 관한 뉴스를 보았습니다. 연기가 아주 자연스러워서 한국에서 매우 유명합니다."},{"step":"전개","summary":"신작 영화의 역사 논쟁과 집 앞 시위 사건","enHtml":"The news was about his new movie. People argued about the <span class=\"hl-expr\">history in the movie</span>. Because he was the main actor, he had a <span class=\"hl-expr\">hard time</span>. Some people even protested outside his house.","ko":"뉴스는 그의 새 영화에 관한 것이었습니다. 사람들이 영화 속 역사에 대해 논쟁을 벌였습니다. 그가 주연 배우였기 때문에 힘든 시간을 겪었습니다. 일부 사람들은 그의 집 밖에서 시위까지 했습니다."},{"step":"결론","summary":"배우를 비난하는 건 불공평하다는 생각","enHtml":"Many people <span class=\"hl-expr\">felt sorry for him</span> and thought the protest was too much. I also think <span class=\"hl-expr\">blaming an actor</span> for the movie's story is not fair.","ko":"많은 사람들이 그를 안타까워했고 시위가 너무 심하다고 생각했습니다. 저 역시 영화 이야기 때문에 배우를 비난하는 것은 옳지 않다고 생각합니다."}],"aEnPlain":"Recently, I saw news about my favorite actor, Yoo Hae-jin. He is very famous in Korea because his acting is so natural. The news was about his new movie. People argued about the history in the movie. Because he was the main actor, he had a hard time. Some people even protested outside his house. Many people felt sorry for him and thought the protest was too much. I also think blaming an actor for the movie's story is not fair."},"30":{"id":30,"aKeywords":"🏡 Stay home vacation w/ wife ➔ 💼 Weekdays too busy with work ➔ 💬 Talk, laugh & get closer on vacation ➔ ❤️ Focus on wife as much as possible","aSections":[{"step":"도입","summary":"집에서 휴가 보낼 때 함께하는 아내","enHtml":"When I have a vacation at home, I like to <span class=\"hl-expr\">spend time with my wife</span>. On weekdays, we are both <span class=\"hl-expr\">very busy with work</span>, so we don't have much time together.","ko":"집에서 휴가를 보낼 때 저는 아내와 함께 시간을 보내는 것을 좋아합니다. 평일에는 둘 다 일로 너무 바빠서 함께할 시간이 많지 않습니다."},{"step":"전개","summary":"휴가 때 함께 대화하고 웃으며 유대감 강화","enHtml":"That's why, during vacations, I try to <span class=\"hl-expr\">focus on her</span>. We cook, watch movies, and talk a lot. When we do this, we laugh more and <span class=\"hl-expr\">feel much closer</span>.","ko":"그래서 휴가 동안에는 아내에게 집중하려고 노력합니다. 요리하고, 영화 보고, 이야기도 많이 나눕니다. 이렇게 하면 더 많이 웃고 훨씬 가까워지는 느낌입니다."},{"step":"결론","summary":"바쁜 일상 속 소중한 재충전 시간","enHtml":"It is a great chance to <span class=\"hl-expr\">relax and recharge</span> together. <span class=\"hl-filler\">So,</span> I always try to spend as much time with my wife as I can.","ko":"함께 쉬고 에너지를 재충전할 수 있는 좋은 기회입니다. 그래서 언제나 아내와 가능한 한 많은 시간을 보내려 합니다."}],"aEnPlain":"When I have a vacation at home, I like to spend time with my wife. On weekdays, we are both very busy with work, so we don't have much time together. That's why, during vacations, I try to focus on her. We cook, watch movies, and talk a lot. When we do this, we laugh more and feel much closer. It is a great chance to relax and recharge together. So, I always try to spend as much time with my wife as I can."},"31":{"id":31,"aKeywords":"🎬 At home: Netflix, cooking & coffee w/ wife ➔ 🌳 Outside: walk in nearby park, bench talk & picnic ➔ 😌 Simple, refreshing vacation","aSections":[{"step":"도입","summary":"아내와 집에서 보내는 편안한 실내 활동","enHtml":"When I stay home on vacation with my wife, we do <span class=\"hl-expr\">fun and relaxing things</span>. At home, we <span class=\"hl-expr\">watch Netflix</span>, cook nice meals, and drink coffee with music. We really enjoy talking over good food.","ko":"아내와 집에서 휴가를 보낼 때 우리는 재미있고 편한 일들을 합니다. 집에서는 넷플릭스를 보고, 맛있는 식사를 요리하며, 음악과 함께 커피를 마십니다. 좋은 음식을 먹으며 이야기하는 것을 정말 좋아합니다."},{"step":"전개","summary":"집 앞 공원 산책과 벤치 대화·피크닉","enHtml":"We also go to the <span class=\"hl-expr\">park near our apartment</span>. We <span class=\"hl-expr\">take a walk</span>, sit on a bench, and talk for a long time. Sometimes we bring snacks for a <span class=\"hl-expr\">small picnic</span> on the grass.","ko":"아파트 근처 공원에도 갑니다. 산책을 하고 벤치에 앉아 오랫동안 이야기를 나눕니다. 가끔은 잔디밭에서 작은 소풍을 하려고 간식도 챙겨 갑니다."},{"step":"결론","summary":"스트레스 없이 기분 전환하는 최고의 휴가","enHtml":"Spending time outside makes us feel <span class=\"hl-expr\">fresh and happy</span>. <span class=\"hl-filler\">Overall,</span> these are the simple things we do on vacation at home.","ko":"바깥에서 시간을 보내면 상쾌하고 행복해집니다. 전반적으로 이것이 우리가 집에서 휴가 때 주로 하는 소소한 일들입니다."}],"aEnPlain":"When I stay home on vacation with my wife, we do fun and relaxing things. At home, we watch Netflix, cook nice meals, and drink coffee with music. We really enjoy talking over good food. We also go to the park near our apartment. We take a walk, sit on a bench, and talk for a long time. Sometimes we bring snacks for a small picnic on the grass. Spending time outside makes us feel fresh and happy. Overall, these are the simple things we do on vacation at home."},"32":{"id":32,"aKeywords":"🏨 Easy to find near subways (modern/bright) ➔ ✨ Inside clean, kind staff & kiosks ➔ 📶 Free Wi-Fi & cozy seats ➔ 👍 Very convenient","aSections":[{"step":"도입","summary":"지하철역 근처 편리한 위치와 밝고 모던한 외관","enHtml":"Most hotels in Korea are <span class=\"hl-expr\">easy to find</span>. They are usually near <span class=\"hl-expr\">subway stations</span> or busy areas. Outside, they look modern and clean, with bright signs that are easy to see at night.","ko":"한국의 대부분 호텔은 찾기 쉽습니다. 보통 지하철역이나 번화가 근처에 있습니다. 바깥 모습은 현대적이고 깔끔하며, 밤에도 보기 쉬운 밝은 간판이 있습니다."},{"step":"전개","summary":"깔끔한 내부, 친절한 직원과 키오스크·무료 와이파이","enHtml":"Inside, everything is <span class=\"hl-expr\">clean and neat</span>. The staff are kind, and many hotels have <span class=\"hl-expr\">self check-in machines</span>, so you don't wait long. Also, there is free Wi-Fi, nice seats, and soft music.","ko":"내부는 모든 것이 깨끗하고 정돈되어 있습니다. 직원분들은 친절하고, 셀프 체크인 기기가 있는 호텔도 많아 오래 기다리지 않습니다. 무료 와이파이, 좋은 좌석, 잔잔한 음악도 있습니다."},{"step":"결론","summary":"편리하고 쾌적한 한국 호텔 총평","enHtml":"<span class=\"hl-filler\">Overall,</span> hotels in Korea are <span class=\"hl-expr\">very convenient</span> and comfortable to stay in.","ko":"전반적으로 한국의 호텔은 매우 편리하고 머물기에 편안합니다."}],"aEnPlain":"Most hotels in Korea are easy to find. They are usually near subway stations or busy areas. Outside, they look modern and clean, with bright signs that are easy to see at night. Inside, everything is clean and neat. The staff are kind, and many hotels have self check-in machines, so you don't wait long. Also, there is free Wi-Fi, nice seats, and soft music. Overall, hotels in Korea are very convenient and comfortable to stay in."},"33":{"id":33,"aKeywords":"🌳 Lake Park near home (short walk) ➔ 🪑 Small/old, but parking & enough benches ➔ 😌 Quiet & relaxed atmosphere ➔ 👍 Great place to visit","aSections":[{"step":"도입","summary":"집에서 걸어서 금방 가는 레이크 파크 소개","enHtml":"There is a park called <span class=\"hl-expr\">Lake Park</span> near my home. I go there very often. The best thing is that it is <span class=\"hl-expr\">close to my house</span>. It takes only a short walk, so I can go even on busy days.","ko":"집 근처에 레이크 파크라는 공원이 있습니다. 저는 거기에 아주 자주 갑니다. 가장 좋은 점은 집과 가깝다는 것입니다. 걸어서 금방이라 바쁜 날에도 갈 수 있습니다."},{"step":"전개","summary":"주차장과 벤치가 잘 갖춰진 편리함과 편안한 분위기","enHtml":"The park is a bit old and small, <span class=\"hl-expr\">but it has everything I need</span>. There is parking and <span class=\"hl-expr\">many benches</span> to sit on. Also, it is quiet, and I always feel comfortable there.","ko":"공원이 조금 오래되고 작지만 필요한 것은 다 있습니다. 주차장도 있고 앉을 벤치도 많습니다. 또한 조용해서 거기 가면 항상 마음이 편합니다."},{"step":"결론","summary":"여유롭게 쉬기 좋은 장소 마무리","enHtml":"I never feel rushed at that park. <span class=\"hl-filler\">All in all,</span> it is a <span class=\"hl-expr\">great place to relax</span>.","ko":"그 공원에서는 절대 서두르는 느낌이 들지 않습니다. 대체로 휴식을 취하기에 정말 좋은 곳입니다."}],"aEnPlain":"There is a park called Lake Park near my home. I go there very often. The best thing is that it is close to my house. It takes only a short walk, so I can go even on busy days. The park is a bit old and small, but it has everything I need. There is parking and many benches to sit on. Also, it is quiet, and I always feel comfortable there. I never feel rushed at that park. All in all, it is a great place to relax."},"34":{"id":34,"aKeywords":"✈️ Visited China (Shanghai/HK, 2-hr flight) ➔ 🌃 Crowded, tall buildings & lively nights ➔ 🥟 Amazing street food everywhere ➔ 🤩 Very exciting place","aSections":[{"step":"도입","summary":"비행기로 2시간 거리인 중국 대도시(상하이·홍콩)","enHtml":"I want to talk about <span class=\"hl-expr\">China</span>, especially big cities like Shanghai and Hong Kong. China is close to Korea. It takes only <span class=\"hl-expr\">two hours by plane</span>.","ko":"중국, 특히 상하이나 홍콩 같은 대도시에 대해 이야기하고 싶습니다. 중국은 한국과 가깝습니다. 비행기로 2시간밖에 걸리지 않습니다."},{"step":"전개","summary":"활기찬 거리 풍경과 다양한 길거리 음식","enHtml":"Big cities in China are <span class=\"hl-expr\">full of energy</span>. There are tall buildings, bright lights, and many people on the streets, even late at night. <span class=\"hl-filler\">Also,</span> there is so much <span class=\"hl-expr\">delicious street food</span> at night markets.","ko":"중국의 대도시들은 에너지가 넘칩니다. 높은 빌딩과 밝은 불빛이 있고 밤늦게까지 거리에 사람이 많습니다. 또한 야시장에 맛있는 길거리 음식이 정말 많습니다."},{"step":"결론","summary":"볼거리·먹을거리 가득한 흥미로운 여행지","enHtml":"The whole city smells great! <span class=\"hl-filler\">Overall,</span> China is a <span class=\"hl-expr\">very exciting place</span> to travel.","ko":"도시 전체에 맛있는 냄새가 가득합니다! 전반적으로 중국은 여행하기에 아주 신나는 곳입니다."}],"aEnPlain":"I want to talk about China, especially big cities like Shanghai and Hong Kong. China is close to Korea. It takes only two hours by plane. Big cities in China are full of energy. There are tall buildings, bright lights, and many people on the streets, even late at night. Also, there is so much delicious street food at night markets. The whole city smells great! Overall, China is a very exciting place to travel."},"35":{"id":35,"aKeywords":"💪 Best friend Jake (strong & energetic) ➔ 🏃 Exercises every day (jog/gym/yoga) ➔ 🥗 Eats healthy homemade food ➔ 🌟 Great role model","aSections":[{"step":"도입","summary":"오랜 절친 제이크의 건강하고 활기찬 모습","enHtml":"<span class=\"hl-filler\">Let me tell you about</span> my best friend, Jake. We have been friends for a long time. He looks <span class=\"hl-expr\">very healthy and strong</span>. Even after work, he never looks tired, and he always walks with confidence.","ko":"제 절친 제이크에 대해 말씀드리겠습니다. 우리는 오랜 친구입니다. 그는 아주 건강하고 튼튼해 보입니다. 퇴근 후에도 지쳐 보이지 않고 언제나 자신감 있게 걷습니다."},{"step":"전개","summary":"매일 꾸준한 운동과 건강한 집밥 습관","enHtml":"He stays healthy because of his <span class=\"hl-expr\">good habits</span>. He exercises almost every day—he goes jogging, goes to the gym, or does yoga. <span class=\"hl-filler\">Also,</span> he doesn't eat fast food. He eats <span class=\"hl-expr\">homemade food</span> with lots of vegetables.","ko":"그는 좋은 습관 덕분에 건강을 유지합니다. 조깅, 헬스, 요가 등 거의 매일 운동합니다. 또한 패스트푸드를 먹지 않고 채소가 많은 집밥을 먹습니다."},{"step":"결론","summary":"긍정적인 에너지를 주는 친구 마무리","enHtml":"<span class=\"hl-filler\">So,</span> I really respect him, and he always gives me <span class=\"hl-expr\">good energy</span>.","ko":"그래서 저는 그를 정말 존경하고, 그는 늘 저에게 좋은 에너지를 줍니다."}],"aEnPlain":"Let me tell you about my best friend, Jake. We have been friends for a long time. He looks very healthy and strong. Even after work, he never looks tired, and he always walks with confidence. He stays healthy because of his good habits. He exercises almost every day—he goes jogging, goes to the gym, or does yoga. Also, he doesn't eat fast food. He eats homemade food with lots of vegetables. So, I really respect him, and he always gives me good energy."},"36":{"id":36,"aKeywords":"🛎️ Check in & unpack bag first ➔ 🚶 Walk around to check hotel facilities ➔ 🏊 Swim, relax & enjoy breakfast buffet ➔ 😊 Nice hotel routine","aSections":[{"step":"도입","summary":"호텔 도착 후 체크인 및 짐 풀기","enHtml":"I usually stay at hotels when I travel or take a break. First, I <span class=\"hl-expr\">check in</span> at the front desk. When I get my key, I go to my room and <span class=\"hl-expr\">unpack my bag</span>. This helps me feel relaxed.","ko":"저는 여행하거나 쉴 때 주로 호텔에 묵습니다. 먼저 프런트에서 체크인을 합니다. 열쇠를 받으면 방으로 올라가 짐을 풉니다. 그래야 마음이 편해집니다."},{"step":"전개","summary":"호텔 내부 시설 둘러보기","enHtml":"Next, I like to <span class=\"hl-expr\">walk around the hotel</span>. I check where the restaurants, cafes, and pool are. It is fun to look around a new place.","ko":"그다음 호텔 주변을 둘러보는 것을 좋아합니다. 식당, 카페, 수영장이 어디 있는지 확인합니다. 새로운 곳을 구경하는 게 재미있습니다."},{"step":"결론","summary":"수영·휴식 후 아침 조식 뷔페 즐기기","enHtml":"Then, I go swimming or rest in the lounge. In the morning, I never miss the <span class=\"hl-expr\">breakfast buffet</span> because the food is great. <span class=\"hl-filler\">So,</span> that is what I do at a hotel.","ko":"그런 다음 수영을 하거나 라운지에서 쉽니다. 아침에는 음식이 맛있어서 조식 뷔페를 절대 놓치지 않습니다. 이것이 제가 호텔에서 하는 일입니다."}],"aEnPlain":"I usually stay at hotels when I travel or take a break. First, I check in at the front desk. When I get my key, I go to my room and unpack my bag. This helps me feel relaxed. Next, I like to walk around the hotel. I check where the restaurants, cafes, and pool are. It is fun to look around a new place. Then, I go swimming or rest in the lounge. In the morning, I never miss the breakfast buffet because the food is great. So, that is what I do at a hotel."},"37":{"id":37,"aKeywords":"🎫 Take waiting number & check phone ➔ 🗣️ Explain need to teller (sometimes fill forms) ➔ 🏧 Use ATM for simple things (faster)","aSections":[{"step":"도입","summary":"은행 방문 목적과 번호표 뽑고 대기","enHtml":"I sometimes go to the bank to send money or get papers. First, I <span class=\"hl-expr\">take a waiting number</span> and wait for my turn. While waiting, I usually look at my phone or drink water.","ko":"저는 송금이나 서류 발급을 위해 가끔 은행에 갑니다. 먼저 번호표를 뽑고 제 차례를 기다립니다. 기다리는 동안 보통 휴대폰을 보거나 물을 마십니다."},{"step":"전개","summary":"번호 호출 후 창구 직원과 업무 진행","enHtml":"When they call my number, I go to the <span class=\"hl-expr\">bank worker</span> and explain what I need. Usually it is <span class=\"hl-expr\">very quick</span>, but it takes longer if I have to write many forms.","ko":"제 번호를 부르면 창구 직원에게 가서 필요한 것을 설명합니다. 보통 아주 빠르지만 서류를 많이 써야 하면 조금 더 걸립니다."},{"step":"결론","summary":"간단한 거래는 빠른 ATM 기기 이용","enHtml":"If my task is simple, I just <span class=\"hl-expr\">use the ATM</span> instead. It is much faster and easier. <span class=\"hl-filler\">So,</span> that is what I do at the bank.","ko":"업무가 간단할 때는 대신 ATM 기기를 씁니다. 훨씬 빠르고 쉽습니다. 이것이 제가 은행에서 하는 일입니다."}],"aEnPlain":"I sometimes go to the bank to send money or get papers. First, I take a waiting number and wait for my turn. While waiting, I usually look at my phone or drink water. When they call my number, I go to the bank worker and explain what I need. Usually it is very quick, but it takes longer if I have to write many forms. If my task is simple, I just use the ATM instead. It is much faster and easier. So, that is what I do at the bank."},"38":{"id":38,"aKeywords":"💻 Search jobs & company info online ➔ 🎪 Check skills & go to job fairs ➔ 📝 Take classes, write resume & practice interviews","aSections":[{"step":"도입","summary":"온라인으로 채용 정보와 기업 조사 시작","enHtml":"These days, <span class=\"hl-expr\">preparing for a job</span> usually starts online. First, many young people search for job openings and <span class=\"hl-expr\">check company websites</span>.","ko":"요즘에는 직업을 준비하는 일이 보통 온라인에서 시작됩니다. 먼저 많은 젊은이들이 채용 공고를 찾고 회사 웹사이트를 확인합니다."},{"step":"전개","summary":"자격 요건 확인 및 채용 박람회 참석","enHtml":"Next, they check what skills they need for the job. Many people also go to <span class=\"hl-expr\">job fairs</span>. There, they can talk directly to company workers and <span class=\"hl-expr\">ask questions</span>.","ko":"그다음 그 직무에 어떤 능력이 필요한지 확인합니다. 많은 사람들이 취업 박람회에도 갑니다. 거기서 회사 직원들과 직접 이야기하고 질문할 수 있습니다."},{"step":"결론","summary":"수업 수강, 이력서·면접 및 어학 준비","enHtml":"Finally, they work hard to improve their skills. They take classes, <span class=\"hl-expr\">write resumes</span>, and practice for interviews. <span class=\"hl-filler\">Overall,</span> these are the main steps to get a job.","ko":"마지막으로 실력을 키우기 위해 열심히 노력합니다. 수업을 듣고 이력서를 쓰며 면접 연습을 합니다. 전반적으로 이것이 취업을 위한 주요 과정입니다."}],"aEnPlain":"These days, preparing for a job usually starts online. First, many young people search for job openings and check company websites. Next, they check what skills they need for the job. Many people also go to job fairs. There, they can talk directly to company workers and ask questions. Finally, they work hard to improve their skills. They take classes, write resumes, and practice for interviews. Overall, these are the main steps to get a job."},"39":{"id":39,"aKeywords":"👴 Older people: simple news, weather & health search ➔ 📱 Young people: Instagram, YouTube, shopping & banking ➔ 🌐 Different use by age","aSections":[{"step":"도입","summary":"연령대별로 다른 인터넷 활용과 노년층의 사용 패턴","enHtml":"People use the Internet differently <span class=\"hl-expr\">depending on their age</span>. For example, older people usually do <span class=\"hl-expr\">simple things</span>. They read news, check the weather, and search for health tips.","ko":"사람들은 나이에 따라 인터넷을 다르게 사용합니다. 예를 들어 어르신들은 보통 간단한 것들을 하십니다. 뉴스를 읽고, 날씨를 확인하며, 건강 정보를 검색하십니다."},{"step":"전개","summary":"기술에 익숙한 젊은 층의 SNS·유튜브·쇼핑·뱅킹","enHtml":"<span class=\"hl-filler\">On the other hand,</span> young people are <span class=\"hl-expr\">good with technology</span>. They use Instagram, watch YouTube, and listen to music. They also do <span class=\"hl-expr\">online shopping and banking</span>, and chat with friends.","ko":"반면에 젊은 사람들은 기술을 잘 다룹니다. 인스타그램을 쓰고, 유튜브를 보며, 음악을 듣습니다. 또한 온라인 쇼핑과 뱅킹을 하고 친구들과 채팅합니다."},{"step":"결론","summary":"각자 필요에 따른 다양한 인터넷 사용 요약","enHtml":"<span class=\"hl-filler\">So,</span> everyone uses the Internet in different ways based on what they need.","ko":"이처럼 모든 사람은 자신이 필요한 것에 따라 다양한 방식으로 인터넷을 사용합니다."}],"aEnPlain":"People use the Internet differently depending on their age. For example, older people usually do simple things. They read news, check the weather, and search for health tips. On the other hand, young people are good with technology. They use Instagram, watch YouTube, and listen to music. They also do online shopping and banking, and chat with friends. So, everyone uses the Internet in different ways based on what they need."},"40":{"id":40,"aKeywords":"🏃 Run in park w/ wife after lunch ➔ 🐕 Saw giant black dog (no leash!) ➔ 😱 Wife terrified, froze → I filmed & laughed ➔ 😠 Wife got mad at me (funny memory)","aSections":[{"step":"도입","summary":"휴가 중 점심 식사 후 아내와 아파트 공원 달리기","enHtml":"This happened a few years ago on vacation. After lunch, my wife and I <span class=\"hl-expr\">went running</span> in the park near our apartment.","ko":"몇 년 전 휴가 때 있었던 일입니다. 점심을 먹고 아내와 아파트 근처 공원으로 달리기를 하러 갔습니다."},{"step":"전개","summary":"목줄 없는 큰 검은 개와 겁에 질려 얼어붙은 아내","enHtml":"Halfway through, we saw a <span class=\"hl-expr\">huge black dog</span> with no leash and no owner! My wife is usually brave, <span class=\"hl-expr\">but she is very scared of dogs</span>. She couldn't even move! I thought it was funny, so I laughed and <span class=\"hl-expr\">took a video</span> of her. Luckily, the dog just walked away.","ko":"절반쯤 달렸을 때 목줄도 주인도 없는 거대한 검은 개를 보았습니다! 아내는 평소 용감하지만 개를 무척 무서워합니다. 꼼짝도 못 하더군요! 저는 그 모습이 웃겨서 웃으며 아내 영상을 찍었습니다. 다행히 개는 그냥 가 버렸습니다."},{"step":"결론","summary":"오히려 나에게 화낸 아내와 잊지 못할 웃긴 추억","enHtml":"<span class=\"hl-filler\">However,</span> my wife got <span class=\"hl-expr\">really mad at me</span> for laughing at her. The dog's owner was wrong, <span class=\"hl-expr\">but I got in trouble</span>! It is still one of our funniest memories.","ko":"하지만 아내는 비웃었다며 저에게 정말 화를 냈습니다. 잘못은 견주가 했는데 혼난 건 저였어요! 지금도 우리의 가장 웃긴 추억 중 하나입니다."}],"aEnPlain":"This happened a few years ago on vacation. After lunch, my wife and I went running in the park near our apartment. Halfway through, we saw a huge black dog with no leash and no owner! My wife is usually brave, but she is very scared of dogs. She couldn't even move! I thought it was funny, so I laughed and took a video of her. Luckily, the dog just walked away. However, my wife got really mad at me for laughing at her. The dog's owner was wrong, but I got in trouble! It is still one of our funniest memories."}};

    if (audioPlayer) audioPlayer.preload = "auto";
    let audioCtx = null;

    function unlockAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!audioCtx) {
        try {
          audioCtx = new AudioCtx();
        } catch {
          return null;
        }
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTransitionChime() {
      const ctx = unlockAudioContext();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const notes = [
          { freq: 783.99, delay: 0, dur: 0.16, peak: 0.07 },
          { freq: 1046.5, delay: 0.09, dur: 0.24, peak: 0.085 }
        ];
        notes.forEach(({ freq, delay, dur, peak }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(0.0001, now + delay);
          gain.gain.linearRampToValueAtTime(peak, now + delay + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur + 0.02);
        });
      } catch {}
    }

    // --- Persistence ---
    function getEffectiveItem(item) {
      if (!item) return null;
      if (state.prefs.level !== "im3") return item;

    function applyItemPatch(item, patch) {
      if (!item || !patch || typeof patch !== "object") return;
      if (typeof patch.stars === "number" && patch.stars >= 0 && patch.stars <= 5) item.stars = patch.stars;
      if (typeof patch.qKeywords === "string") item.qKeywords = patch.qKeywords;
      if (typeof patch.qEn === "string") item.qEn = patch.qEn;
      if (typeof patch.qKo === "string") item.qKo = patch.qKo;
      if (typeof patch.aKeywords === "string") item.aKeywords = patch.aKeywords;
      if (Array.isArray(patch.aSections) && patch.aSections.length === item.aSections.length) {
        patch.aSections.forEach((secPatch, i) => {
          if (typeof secPatch.enHtml === "string") item.aSections[i].enHtml = secPatch.enHtml;
          if (typeof secPatch.ko === "string") item.aSections[i].ko = secPatch.ko;
        });
      }
      if (typeof patch.aEnPlain === "string") item.aEnPlain = patch.aEnPlain;
    }

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEYS.starred) || "[]");
        if (Array.isArray(s)) state.starredIds = new Set(s);
      } catch {}
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEYS.done) || "[]");
        if (Array.isArray(d)) state.doneIds = new Set(d);
      } catch {}
      try {
        const p = JSON.parse(localStorage.getItem(STORAGE_KEYS.prefs) || "{}");
        if (p && typeof p === "object") {
          if (p.level === "al" || p.level === "im3") state.prefs.level = p.level;
          if (typeof p.showKo === "boolean") state.prefs.showKo = p.showKo;
          if (typeof p.blindMode === "boolean") state.prefs.blindMode = p.blindMode;
          if (["qa", "a", "q"].includes(p.playMode)) state.prefs.playMode = p.playMode;
          if (RATES.includes(p.rate)) state.prefs.rate = p.rate;
          if (typeof p.voiceName === "string") state.prefs.voiceName = p.voiceName;
          if (typeof p.popupFontSize === "number" && p.popupFontSize >= 13 && p.popupFontSize <= 26) {
            state.prefs.popupFontSize = p.popupFontSize;
          }
          if (p.audioSource === "file" || p.audioSource === "web") {
            state.prefs.audioSource = p.audioSource;
          }
        }
      } catch {}
      try {
        const e = JSON.parse(localStorage.getItem(STORAGE_KEYS.edits) || "{}");
        if (e && typeof e === "object") {
          let migrated = false;
          for (const [idStr, sig] of Object.entries(LEGACY_SCRIPT_SIGNATURES)) {
            const patch = e[idStr];
            if (patch && typeof patch.aEnPlain === "string" && patch.aEnPlain.includes(sig)) {
              const defItem = DEFAULT_OPIC_DATA.find(x => x.id === Number(idStr));
              const qUnchanged = !defItem || !patch.qEn || patch.qEn.trim() === defItem.qEn.trim();
              if (qUnchanged) {
                delete e[idStr];
              } else {
                delete patch.aKeywords;
                delete patch.aSections;
                delete patch.aEnPlain;
              }
              migrated = true;
            }
          }
          state.edits = e;
          for (const [idStr, patch] of Object.entries(e)) {
            const item = OPIC_DATA.find(x => x.id === Number(idStr));
            if (item) {
              applyItemPatch(item, patch);
              const defItem = DEFAULT_OPIC_DATA.find(x => x.id === Number(idStr));
              const arrowCount = ((patch.aKeywords || "").match(/➔/g) || []).length;
              if (defItem && arrowCount <= 2) {
                if (!patch.aEnPlain || patch.aEnPlain.trim() === defItem.aEnPlain.trim()) {
                  item.aKeywords = defItem.aKeywords;
                } else {
                  item.aKeywords = buildUpdatedAKeywords(item, defItem);
                }
                patch.aKeywords = item.aKeywords;
                if (!patch.qEn || patch.qEn.trim() === defItem.qEn.trim()) {
                  item.qKeywords = defItem.qKeywords;
                  patch.qKeywords = defItem.qKeywords;
                }
                migrated = true;
              }
            }
          }
          if (migrated) saveEdits();
        }
      } catch {}
      try {
        const ie = JSON.parse(localStorage.getItem(STORAGE_KEYS.im3Edits) || "{}");
        if (ie && typeof ie === "object") {
          state.im3Edits = ie;
          for (const [idStr, patch] of Object.entries(ie)) {
            const im3Item = IM3_DATA_MAP[Number(idStr)];
            if (im3Item) applyItemPatch(im3Item, patch);

    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function unescapeHtml(str) {
      return str
        .replace(/&quot;/g, "\"")
        .replace(/&gt;/g, ">")
        .replace(/&lt;/g, "<")
        .replace(/&amp;/g, "&");
    }

    function stripHtmlToPlain(html) {
      return unescapeHtml(html.replace(/<[^>]+>/g, "")).replace(/\s+/g, " ").trim();
    }

    function splitSentences(text) {
      const protectedText = text
        .replace(/\b([pPaA])\.[mM]\.(?=\s+[a-z0-9,])/g, "$1__m__dot__")
        .replace(/\b([pPaA])\.[mM]\./g, "$1__m.")
        .replace(/\.\.\./g, "__ELLIPSIS__");
      const rawMatches = protectedText.match(/[^.!?]+(?:[.!?]+["']?|\s*$)/g) || [protectedText];
      return rawMatches
        .map(s => s
          .replace(/([pPaA])__m__dot__/g, "$1.m.")
          .replace(/([pPaA])__m\./g, "$1.m.")
          .replace(/__ELLIPSIS__/g, "...")
          .trim()
        )
        .filter(Boolean);
    }

    function splitHtmlBySentences(html, itemId, part, startIdx) {
      // Protect p.m./a.m. followed by lowercase and ellipses without altering tags
      const placeholderMap = [];
      let safeHtml = html.replace(/<[^>]+>/g, tag => {
        const key = `__TAG_${placeholderMap.length}__`;
        placeholderMap.push(tag);
        return key;
      });

      safeHtml = safeHtml
        .replace(/\b([pPaA])\.[mM]\.(?=\s+[a-z0-9,])/g, "$1__m__dot__")
        .replace(/\b([pPaA])\.[mM]\./g, "$1__m.")
        .replace(/\.\.\./g, "__ELLIPSIS__");

      const parts = safeHtml.match(/[^.!?]+(?:[.!?]+["']?(?:__TAG_\d+__)*|\s*$)/g) || [safeHtml];
      let idx = startIdx;
      const wrapped = parts
        .map(chunk => {
          const trimmed = chunk.trim();
          if (!trimmed) return "";
          let restored = trimmed
            .replace(/([pPaA])__m__dot__/g, "$1.m.")
            .replace(/([pPaA])__m\./g, "$1.m.")
            .replace(/__ELLIPSIS__/g, "...");
          restored = restored.replace(/__TAG_(\d+)__/g, (_, n) => placeholderMap[Number(n)]);
          const curIdx = idx++;
          return `<span class="tts-sentence" data-item-id="${itemId}" data-part="${part}" data-sidx="${curIdx}">${restored}</span>`;
        })
        .filter(Boolean)
        .join(" ");

      return { html: wrapped, nextIdx: idx };
    }

    function matchesSearchQuery(item, rawQuery) {
      const q = String(rawQuery || "").trim().toLowerCase();
      if (!q) return true;
      const viewItem = getEffectiveItem(item);
      const numStr = String(viewItem.id).padStart(2, "0");
      const secText = Array.isArray(viewItem.aSections)
        ? viewItem.aSections.map(s => `${s.summary || ""} ${s.ko || ""}`).join(" ")
        : "";
      const haystack = [
        `#${viewItem.id}`,
        `#${numStr}`,
        String(viewItem.id),
        viewItem.title || "",
        viewItem.badge || "",
        viewItem.qKeywords || "",
        viewItem.aKeywords || "",
        viewItem.qEn || "",
        viewItem.qKo || "",
        viewItem.aEnPlain || "",
        secText
      ].join(" ").toLowerCase();

      const tokens = q.split(/\s+/).filter(Boolean);
      return tokens.every(tok => haystack.includes(tok));
    }

    function matchesStarFilter(item, filterId) {
      const s = Number(item.stars || 0);
      if (filterId === "all") return true;
      if (filterId === "any") return s >= 1;
      if (filterId === "gte4") return s >= 4;
      if (filterId === "eq5") return s === 5;
      if (filterId === "eq4") return s === 4;
      if (filterId === "eq3") return s === 3;
      if (filterId === "eq2") return s === 2;
      if (filterId === "eq1") return s === 1;
      return true;
    }

    function getItemsForTab(tabId, ignoreStarFilter = false) {
      let base;
      if (tabId === "all") base = OPIC_DATA;
      else if (tabId === "starred") base = OPIC_DATA.filter(item => state.starredIds.has(item.id));
      else base = OPIC_DATA.filter(item => item.category === tabId);
      if (state.searchQuery && state.searchQuery.trim()) {
        base = base.filter(item => matchesSearchQuery(item, state.searchQuery));
      }
      if (ignoreStarFilter) return base;
      return base.filter(item => matchesStarFilter(item, state.starFilter));
    }

    function getBadgeClass(badge) {
      if (badge.startsWith("롤플레이") || badge.includes("뉴스")) return "badge-rp";
      if (badge === "묘사/경험" || badge.includes("묘사")) return "badge-desc";
      if (badge === "과거경험" || badge.includes("경험") || badge.includes("과거")) return "badge-exp";
      if (badge === "연계경험" || badge.includes("비교") || badge.includes("변화")) return "badge-link";
      return "badge-proc";

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // --- Wake Lock ---
    async function acquireWakeLock() {
      if (!("wakeLock" in navigator) || state.wakeLock) return;
      try {
        state.wakeLock = await navigator.wakeLock.request("screen");
        state.wakeLock.addEventListener("release", () => {
          state.wakeLock = null;
        });
      } catch {
        // Ignore unsupported / battery-saver denials gracefully
      }
    }

    async function releaseWakeLock() {
      if (!state.wakeLock) return;
      try {
        await state.wakeLock.release();
      } catch {}
      state.wakeLock = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.playback.active && !state.playback.paused) {
        acquireWakeLock();
