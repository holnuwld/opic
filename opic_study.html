<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OPIc 포켓 스터디 (2026)</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --accent: #0d9488;
      --accent-soft: #f0fdfa;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-player: 0 -6px 24px rgba(15, 23, 42, 0.14);
      --radius-card: 16px;
      --radius-inner: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      padding-bottom: calc(64px + var(--safe-bottom));
      position: relative;
    }

    /* Header & Utility Bar */
    .top-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 10px 12px 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .survey-link-btn,
    .memorize-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #fef3c7;
      color: #78350f;
      border: 1px solid #f59e0b;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.14);
      transition: transform 0.1s;
    }

    .memorize-link-btn {
      background: #ede9fe;
      color: #4c1d95;
      border-color: #c4b5fd;
    }

    .survey-link-btn:active,
    .memorize-link-btn:active {
      transform: scale(0.95);
    }

    .progress-pill {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .utility-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: nowrap;
    }

    .util-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 30px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .util-btn:active {
      transform: scale(0.96);
    }

    .util-btn.is-active {
      background: #ffffff;
      color: #1e3a8a;
      border-color: #ffffff;
    }

    .util-btn.filler-btn {
      background: #fbbf24;
      color: #451a03;
      border-color: #f59e0b;
    }

    .search-box-top {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-top {
      width: 100%;
      min-width: 0;
      height: 30px;
      background: rgba(15, 23, 42, 0.35);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 0 26px 0 10px;
      font-size: 11.5px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-input-top::placeholder {
      color: rgba(255, 255, 255, 0.72);
      font-weight: 500;
    }

    .search-input-top:focus {
      background: rgba(15, 23, 42, 0.55);
      border-color: rgba(255, 255, 255, 0.75);
    }

    .search-input-top::-webkit-search-cancel-button {
      display: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 5px;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .search-clear-btn[hidden] {
      display: none;
    }

    /* Sticky Topic Tabs */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(243, 245, 249, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .tab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 7px 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s;
    }

    .tab-pill .tab-count {
      font-size: 10.5px;
      font-weight: 700;
      background: var(--bg);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 999px;
    }

    .tab-pill.is-active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-pill.is-active .tab-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .star-filter-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding: 0 12px 7px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .star-filter-bar::-webkit-scrollbar {
      display: none;
    }

    .star-pill {
      appearance: none;
      border: 1px solid #fde68a;
      background: #fffbeb;
      color: #92400e;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }

    .star-pill .star-cnt {
      font-size: 10px;
      opacity: 0.8;
    }

    .star-pill.is-active {
      background: #f59e0b;
      color: #ffffff;
      border-color: #d97706;
    }

    .star-pill.is-active .star-cnt {
      opacity: 1;
      color: #ffffff;
    }

    /* Tab Top Controls */
    .tab-controls {
      padding: 7px 12px 2px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .play-all-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play-all,
    .btn-play-random {
      flex: 1;
      appearance: none;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      padding: 9px 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 40px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.22);
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-play-random {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.22);
    }

    .btn-play-all:active,
    .btn-play-random:active {
      transform: scale(0.98);
    }

    .btn-play-all.is-playing,
    .btn-play-random.is-playing {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.22);
    }

    .btn-play-all:disabled,
    .btn-play-random:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .mode-btn {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 4px;
      border-radius: 7px;
      cursor: pointer;
      min-height: 30px;
      transition: all 0.15s;
    }

    .mode-btn.is-active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .level-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .level-btn {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
      padding: 6px 6px;
      border-radius: 7px;
      cursor: pointer;
      min-height: 32px;
      transition: all 0.15s;
    }

    .level-btn.is-active[data-level="al"] {
      background: var(--primary);
      color: #ffffff;
    }

    .level-btn.is-active[data-level="im3"] {
      background: var(--accent);
      color: #ffffff;
    }

    /* Card List */
    .card-list {
      padding: 8px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-card);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 6px;
    }

    .q-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .q-card.is-active-card {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15), var(--shadow-md);
    }

    .q-card.is-done {
      border-color: #bbf7d0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px 6px;
      border-bottom: 1px solid #f1f5f9;
      background: #fafbfd;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .item-num {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .type-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .badge-rp { background: #ede9fe; color: #6d28d9; }
    .badge-exp { background: #dbeafe; color: #1d4ed8; }
    .badge-desc { background: #ccfbf1; color: #0f766e; }
    .badge-link { background: #fef3c7; color: #b45309; }
    .badge-proc { background: #fce7f3; color: #be185d; }

    .star-rating-pill {
      font-size: 10px;
      font-weight: 800;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 1px 5px;
      border-radius: 5px;
      letter-spacing: -0.04em;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-toggle {
      appearance: none;
      border: none;
      background: transparent;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.42;
      transition: opacity 0.15s, background 0.15s, transform 0.1s;
    }

    .icon-toggle:active {
      transform: scale(0.92);
    }

    .icon-toggle.is-on {
      opacity: 1;
      background: #f1f5f9;
    }

    /* Accordion Row (Question & Answer) */
    .qa-block {
      border-bottom: 1px solid #f1f5f9;
    }

    .qa-block:last-child {
      border-bottom: none;
    }

    .qa-block.is-playing-block > .qa-row {
      background: #eff6ff;
    }

    .qa-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .qa-row:active {
      background: #f8fafc;
    }

    .btn-play-item {
      appearance: none;
      border: 1.5px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .btn-play-item:active {
      transform: scale(0.93);
    }

    .btn-play-item.is-answer {
      border-color: #99f6e4;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-play-item.is-playing {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      animation: pulseRing 1.4s infinite;
    }

    .btn-play-item.is-answer.is-playing {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35); }
      70% { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .qa-summary-area {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qa-tag {
      font-size: 10.5px;
      font-weight: 900;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qa-tag.tag-q {
      background: #dbeafe;
      color: #1e40af;
    }

    .qa-tag.tag-a {
      background: #ccfbf1;
      color: #115e59;
    }

    .qa-keywords {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }

    .open-arrow {
      font-size: 14px;
      color: var(--text-muted);
      flex-shrink: 0;
      padding: 2px;
    }

    .step-mini {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
      vertical-align: 1px;
      letter-spacing: 0.01em;
    }

    .step-intro { background: #e0e7ff; color: #3730a3; }
    .step-body { background: #cffafe; color: #155e75; }
    .step-outro { background: #dcfce7; color: #166534; }

    /* Full-Screen Script Popup */
    .popup-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: calc(44px + var(--safe-bottom));
      background: rgba(15, 23, 42, 0.55);
      z-index: 45;
      display: none;
      justify-content: center;
    }

    .popup-backdrop.is-open {
      display: flex;
    }

    .script-popup {
      --popup-font-size: 16px;
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }

    .popup-toolbar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .popup-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .popup-title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .popup-num {
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .popup-num.is-answer {
      background: var(--accent);
    }

    .popup-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pop-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      white-space: nowrap;
    }

    .pop-btn:active {
      transform: scale(0.96);
    }

    .pop-btn.is-active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .pop-btn.pop-play {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .pop-btn.pop-play.is-playing {
      background: var(--danger);
      border-color: var(--danger);
    }

    .pop-switch-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      font-size: 11.5px;
      font-weight: 700;
      height: 28px;
      padding: 0 8px;
      border-radius: 7px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .pop-level-btn {
      appearance: none;
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      height: 28px;
      padding: 0 8px;
      border-radius: 7px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .pop-level-btn.is-im3 {
      border-color: #99f6e4;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .popup-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 20px;
      cursor: pointer;
    }

    .script-popup.is-editing .popup-body {
      cursor: default;
    }

    .popup-kw-line {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 12px;
    }

    .popup-para-block {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .popup-para-block:last-of-type {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;

    .popup-en-script .tts-sentence {
      cursor: pointer;
    }

    .popup-edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .edit-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--primary);
    }

    .edit-textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text);
      background: var(--surface);
      resize: vertical;
    }

    .edit-input:focus,
    .edit-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .edit-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .edit-save-btn {
      flex: 2;
      appearance: none;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
    }

    .edit-reset-btn {
      flex: 1;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 700;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
    }

    .edit-reset-btn {
      color: var(--danger);
    }

    .edit-auto-btn {
      width: 100%;
      appearance: none;
      border: 1.5px solid #99f6e4;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 800;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .edit-auto-btn:disabled,
    .edit-save-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* Highlighting & Blind Mode */
    .hl-filler {
      background: #fef3c7;
      color: #92400e;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    .hl-expr {
      background: #e0f2fe;
      color: #0369a1;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 700;
      border-bottom: 1.5px solid #38bdf8;
    }

    body.blind-on .hl-expr:not(.is-revealed) {
      background: #cbd5e1;
      color: transparent;
      border-bottom: 1.5px dashed #64748b;
      user-select: none;
      cursor: pointer;
    }

    body.blind-on .hl-expr.is-revealed {
      background: #dcfce7;
      color: #166534;
      border-bottom-color: #22c55e;
      cursor: pointer;
    }

    /* Interactive TTS Sentences */
    .tts-sentence {
      cursor: pointer;
      border-radius: 4px;
      padding: 1px 2px;
      transition: background 0.15s;
    }

    .tts-sentence:active {
      background: #e2e8f0;
    }

    .tts-sentence.is-speaking {
      background: #fde047;
      color: #0f172a;
      box-shadow: 0 0 0 2px #facc15;
    }

    body.blind-on .tts-sentence.is-speaking .hl-expr:not(.is-revealed) {
      color: transparent;
      background: #94a3b8;
    }

    /* Sticky Bottom Single-Line Mini Player */
    .mini-player {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      color: #f8fafc;
      padding: 6px 8px calc(6px + var(--safe-bottom));
      z-index: 50;
      box-shadow: var(--shadow-player);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .player-now {
      font-size: 11px;
      font-weight: 700;
      color: #93c5fd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;

    .player-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .source-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 800;
      height: 32px;
      padding: 0 6px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;

      align-items: center;
      gap: 2px;

    .source-btn.is-file {
      background: #0d9488;
      border-color: #14b8a6;
      color: #ffffff;
    }

    .p-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      height: 32px;
      min-width: 28px;
      padding: 0 5px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .p-btn:active {
      transform: scale(0.95);
    }

    .p-btn.p-main {
      background: #2563eb;
      border-color: #3b82f6;
      min-width: 32px;
      font-weight: 800;
    }

    .p-btn.is-on {
      background: #0d9488;
      border-color: #14b8a6;
    }

    .rate-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fde68a;
      font-size: 11px;
      font-weight: 800;
      height: 32px;
      padding: 0 5px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Bottom Sheet Modal (Filler Cheat Sheet) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 80;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 82vh;
      background: var(--surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .sheet-close {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .sheet-body {
      padding: 14px 16px calc(24px + var(--safe-bottom));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filler-group-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 8px;
    }

    .filler-chips {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filler-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      text-align: left;
    }

    .filler-chip:active {
      background: var(--primary-soft);
    }

    .filler-en {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .filler-ko {
      font-size: 12px;
      color: var(--text-sub);
    }

    .filler-say {
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(56px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 999px;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      max-width: 90vw;
      text-align: center;
    }

    .toast.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    const IM3_DATA_MAP = {"1":{"id":1,"aKeywords":"📅 Last month wife sick ➔ 🍲 Ordered veggie porridge (rice/carrots) ➔ 🥄 Warm, mild & easy to eat ➔ 😌 Felt better & good choice","aSections":[{"step":"도입","summary":"지난달 아내 배탈로 가벼운 음식 주문","enHtml":"The last time I ate healthy food was last month. My wife had a <span class=\"hl-expr\">stomachache</span>, so she didn't want heavy food. We decided to order something <span class=\"hl-expr\">light and healthy</span>.","ko":"마지막으로 건강한 음식을 먹은 것은 지난달입니다. 아내가 배가 아파서 무거운 음식을 먹기 싫어했습니다. 그래서 가볍고 건강한 음식을 주문하기로 했습니다."},{"step":"전개","summary":"야채죽의 재료와 담백하고 따뜻한 맛","enHtml":"We ordered <span class=\"hl-expr\">vegetable porridge</span> from a Korean restaurant. It has rice, carrots, and mushrooms, so it is <span class=\"hl-expr\">easy to digest</span>. It was not spicy, and it tasted very <span class=\"hl-expr\">warm and clean</span>.","ko":"한국 죽집에서 야채죽을 시켰습니다. 쌀, 당근, 버섯이 들어가서 소화가 잘됩니다. 맵지 않고 맛이 아주 따뜻하고 깔끔했습니다."},{"step":"결론","summary":"속이 편해지고 만족스러웠던 식사","enHtml":"After eating it, our stomachs felt much better. My wife liked it too. <span class=\"hl-filler\">Overall,</span> it was a simple meal, and it was <span class=\"hl-expr\">the right choice</span>.","ko":"먹고 나니 속이 훨씬 편해졌습니다. 아내도 좋아했습니다. 전반적으로 소박한 식사였지만 딱 맞는 선택이었습니다."}],"aEnPlain":"The last time I ate healthy food was last month. My wife had a stomachache, so she didn't want heavy food. We decided to order something light and healthy. We ordered vegetable porridge from a Korean restaurant. It has rice, carrots, and mushrooms, so it is easy to digest. It was not spicy, and it tasted very warm and clean. After eating it, our stomachs felt much better. My wife liked it too. Overall, it was a simple meal, and it was the right choice."},"2":{"id":2,"aKeywords":"🏖️ Last summer Daecheon Beach (Boryeong) ➔ 👀 Very wide & many happy people ➔ 🌅 Red sunset like a picture ➔ 😍 Great place, want to go back","aSections":[{"step":"도입","summary":"지난여름 보령 대천해수욕장 방문","enHtml":"<span class=\"hl-fille
